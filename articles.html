kenDad", "保險廣告", "五百萬保額", "五百萬大傘", "年紀", "內涵", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/af45e112ddcb04266ff9.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "family", "title": "《雅虎與右右的貓日常》：一隻追著人玩，一隻看到弟弟就跑", "excerpt": "雞爸爸一家_我們家的兩隻咪咪 – LINE貼圖 | LINE STORE 雞爸爸一家做成貼圖，兔阿嬤也有了自己的專屬版本。 這次，輪到家裡另外兩位成員——雅虎和右右。 雅虎是精壯的賓士貓，右右是圓潤的橘貓。 不過，牠們的差別，當然不只是毛色和身材。 為大家介紹一下我們家的兩隻咪咪...", "date": "2026.10.21", "href": "/articles/vocus-20261021-01d57717.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "右右", "雅虎", "LINE貼圖", "vocus2026", "個性"], "cover": "/assets/posts/vocus-import-20261105/3dc9b14697b34cddf91a.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "《兔阿嬤的暖心日常》：有規矩、有氣質，也有溫度的24張貼圖", "excerpt": "兔阿嬤也有自己的專屬貼圖了！她疼愛孫子、孫女，也講究規矩，有原則的日常裡，藏著給家人的鼓勵與關心。這次，雞爸爸把這份溫暖做成24張LINE貼圖，搭配珍珠、絲巾與優雅笑容，陪大家說早安、送抱抱，也提醒自己享受一下。收藏兔阿嬤常用的溫柔，還能讓她少打幾個字。生活再忙，也別忘了給自己留點時間，優雅一下！", "date": "2026.10.21", "href": "/articles/vocus-20261021-01d45002.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "兔阿嬤", "LINE貼圖", "雞爸爸一家", "家庭日常", "祖孫", "正能量", "溫暖陪伴", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/c0ef7045ec36d03c2ce6.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "cdhj", "title": "雞爸爸想把腰間肉冷凍減脂一下...", "excerpt": "雞爸爸想把腰間的游泳圈冷凍一下，卻先掉進論文海。這篇從三篇研究出發，聊聊冷凍減脂的效果、反常性脂肪增生風險，以及躺著增肌的證據。阿爾發和酷塑有什麼不同？療程專案該怎麼比？雞爸爸用白話整理效果與限制，提醒自己別只看價格和廣告。愛漂亮可以，先讀懂研究、問清風險，再決定要不要讓肚子體驗這場低溫改造計畫。", "date": "2026.10.21", "href": "/articles/vocus-20261021-01cf4e92.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸健康期刊", "CDHJ", "冷凍減脂", "阿爾發", "酷塑減脂", "反常性脂肪增生", "PAH", "EMBODY", "電磁增肌", "腹部雕塑", "實證醫學", "vocus2026", "脂肪", "風險"], "cover": "/assets/posts/vocus-import-20261105/630cc6c9a1d6c15e7824.webp", "roomLabel": "雞爸爸健康期刊", "originalCategory": "保健室"}, {"journal": "family", "title": "與內心的自己相遇，他會怎麼問你?", "excerpt": "如果八歲與八十歲的自己搬進家裡，現在的我會和他們聊些什麼？想送童年的自己一份禮物，卻發現早已忘記他喜歡什麼；想問年老的自己，如今放不下的事，是否都已雲淡風輕。夾在夢想與回憶之間，我開始聽見自己的期待、害怕與疲憊。也許，和他們一起生活，能讓我重新認識自己，勇敢嘗試，也好好感受...", "date": "2026.10.20", "href": "/articles/vocus-20261020-01ac1776.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "內心小孩", "自我探索", "內心對話", "三明治世代"], "cover": "/assets/posts/vocus-import-20261105/f698d82850f78e1f37cc.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "cdhj", "title": "假牙裝好了，怎麼反而咬下去會痛？兔阿嬤的牙齒修復記", "excerpt": "兔阿嬤好不容易裝上新牙冠，原以為終於能安心吃飯，沒想到一咬就痛，接著牙齦腫脹，連早上刷牙都見血！明明是為了修好牙齒，怎麼反而問題更多？這期《雞爸爸健康期刊》精選三篇醫學研究，從咬合疼痛、牙齦發炎到抗生素使用，揭開假牙修復背後容易忽略的健康問題。", "date": "2026.10.20", "href": "/articles/vocus-20261020-01a72004.html", "tags": ["雞爸爸生活研究室", "雞爸爸健康期刊", "CDHJ", "兔阿嬤", "假牙", "牙冠", "植牙", "咬合疼痛", "牙齦發炎", "牙齦出血", "高齡口腔健康", "抗生素", "止痛藥", "普拿疼", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/a4a3ca8f09d664735717.webp", "roomLabel": "雞爸爸健康期刊", "originalCategory": "保健室"}, {"journal": "devil", "title": "每次都覺得，放假比上班還累...", "excerpt": "鼠媽媽早上拜拜、下午帶鼠姊姊去親子館、看遊行， 一回到家，龍弟弟立刻黏上來，接著陪玩、餵飯... 好不容易癱在沙發上： 「怎麼放假比上班還累？」 雞爸爸內心小惡魔覺得很合理： 👿「因為公司只願意花錢請妳做擅長的事，但孩子覺得妳每件事都擅長...」", "date": "2026.10.20", "href": "/articles/vocus-20261020-01a581e4.html", "tags": ["雞爸爸內心小惡魔", "雞爸爸ChickenDad", "能者多勞", "假日比工作還累", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/ec15dc012559e212c1c0.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "cdhj", "title": "遠視不是看遠比較清楚而已：孩子看得到，不代表眼睛不累", "excerpt": "鼠姊姊有先天遠視與調節性內斜視，戴上眼鏡後眼位明顯改善，老師也觀察到重新穩定戴鏡後，學習狀態恢復。研究指出，中度未矯正遠視可能影響近距離視力、立體視、調節、早期識字與注意力。這不代表遠視一定造成學習困難，但提醒家長：孩子「看得到」，不等於眼睛看得輕鬆，真正重要的是整體視覺功能。", "date": "2026.10.19", "href": "/articles/vocus-20261019-012dc8a7.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸健康期刊", "CDHJ", "幼兒遠視", "先天遠視", "調節性內斜視", "弱視", "兒童視力", "兒童眼科", "視覺發展", "近距離視力", "立體視", "調節能力", "學齡前兒童", "學習與視力", "眼鏡矯正", "親子健康", "vocus2026", "鼠姊姊"], "cover": "/assets/posts/vocus-import-20261105/b0a5546e1fbff8cb5720.webp", "roomLabel": "雞爸爸健康期刊", "originalCategory": "保健室"}, {"journal": "cdpj", "title": "有耐心的父母，真的會養出比較穩定的孩子嗎？", "excerpt": "同樣的孩子、爸爸，為什麼昨天能好好說，今天卻一下就爆炸？一項追蹤264名學齡前兒童與母親的每日研究發現，在正向教養較多、親子關係較親近的日子，孩子的情緒調節通常也較好，退縮與攻擊行為較少。但研究也提醒，親子影響可能是雙向的。與其把一天的失控當成固定個性，不如看見：家庭每天的狀態，本來就會彼此牽動。", "date": "2026.10.19", "href": "/articles/vocus-20261019-013a13bd.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸親子期刊", "CDPJ", "親子教養", "正向教養", "幼兒情緒", "情緒調節", "學齡前兒童", "親子互動", "母子關係", "問題行為", "親職壓力", "家庭互動", "幼兒發展", "每日追蹤研究", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/8eb7a1813524ed6f4048.webp", "roomLabel": "雞爸爸親子期刊", "originalCategory": "家庭誌"}, {"journal": "cdpj", "title": "究竟是兩歲的他不講理，還是六歲的她不懂事？", "excerpt": "兩歲的龍弟弟與六歲的鼠姊姊，面對情緒與衝突時常有不同反應。台灣一項121名2～6歲兒童研究發現，情緒理解會隨年齡提升，並從辨認外在情緒，逐步發展到理解他人觀點、隱藏情緒與情緒調節。這提醒父母：「知道」不等於每次都做得到。與其急著貼上不講理或不懂事的標籤，也許更值得先看見，孩子現在究竟卡在哪裡。", "date": "2026.10.19", "href": "/articles/vocus-20261019-01389b9d.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "CDPJ", "雞爸爸親子期刊", "親子教養", "幼兒情緒", "情緒理解", "情緒調節", "2到6歲", "兒童發展", "幼兒發展", "同理心", "親子互動", "正向教養", "手足互動", "教養觀察", "親職研究", "鼠姊姊", "龍弟弟"], "cover": "/assets/posts/vocus-import-20261105/01394803e2a61e4ae9b1.webp", "roomLabel": "雞爸爸親子期刊", "originalCategory": "家庭誌"}, {"journal": "family", "title": "我不認識你，但我謝謝你", "excerpt": "10月14日原本是個再平凡不過的日子，直到雞爸爸收到了一封來自 Vocus 的通知。 有人贊助雞爸爸的文章了！ 而且，還是雞爸爸在 Vocus 收到的第一筆贊助。 被贊助的文章，是前一天發表的： 《雞爸爸一家》正式出道！當一家四口的日常，變成16張LINE貼圖。 沒想到寫了這麼多篇．．．", "date": "2026.10.19", "href": "/articles/vocus-20261019-01375941.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "vocus", "第一次", "贊助", "分享", "LINE貼圖", "LINE", "貼圖", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/08b5cf9c91770e2c05bd.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "替每一種文字，找到適合的房間｜雞爸爸生活研究室重新裝潢", "excerpt": "寫著寫著，雞爸爸生活研究室累積了家庭故事、生活哲學、家族記憶與科學研究。為了讓不同類型的內容各自找到適合的位置，決定重新規劃五大房間：一家生活紀錄、內心小惡魔、珍山陳經典語錄，以及每週一、週五固定更新的親子與健康期刊。這不是重新開始，而是讓過去累積的故事更加清晰，也讓未來的創作有更明確的方向。", "date": "2026.10.19", "href": "/articles/vocus-20261019-012f4dbe.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "創作日常", "親子生活", "家庭記錄", "生活觀察", "科學研究", "vocus2026", "雞爸爸內心小惡魔", "珍山陳經典語錄", "兔阿嬤", "鼠媽媽", "鼠姊姊", "龍弟弟", "珍山陳", "科學", "人生", 13-017b7eb4.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "波速球", "親子共玩", "手足關係", "兒童發展", "感覺統合", "平衡訓練", "核心訓練", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/08263f2d286f4238d66c.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "devil", "title": "雞爸爸內心小惡魔LINE貼圖...", "excerpt": "之前有格友建議雞爸爸可以幫小惡魔出一套LINE貼圖... 小惡魔說，這個需求很有想法，不然我們先出一套試試看好了... PS.下周看審核有沒有過...祝大家連假快樂...", "date": "2026.10.08", "href": "/articles/vocus-20261008-01fb5214.html", "tags": ["雞爸爸生活研究室", "雞爸爸內心小惡魔", "雞爸爸ChickenDad", "LINE貼圖", "vocus2026", "厭世"], "cover": "/assets/posts/vocus-import-20261105/acc41fc68645cb07a49e.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "family", "title": "經絡 × 筋膜怎麼用？｜不是背穴位，而是學會找身體的入口", "excerpt": "雞爸爸談完「經絡是什麼」這篇則談「經絡怎麼用」從中醫辨證、經脈、經筋、皮部到穴位，再接上筋膜、神經與現代解剖，雞爸爸用心血管、脊椎側彎、眼睛、皮膚過敏與氣喘五個案例實際拆解。最後才發現，經絡真正提供的不是「哪個病按哪個穴」的標準答案，而是一套幫助我們定位問題、理解身體連動，並找到介入入口的方法。", "date": "2026.10.07", "href": "/articles/vocus-20261007-017a816f.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "中醫", "經絡", "筋膜", "穴位", "經筋", "皮部", "經絡應用", "筋膜鏈", "點穴", "神經系統", "自律神經", "心包經", "脊椎側彎", "眼睛疲勞", "皮膚過敏", "氣喘", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/124241287d8c3d4fe994.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "保健室"}, {"journal": "family", "title": "別再說經絡只是玄學？從筋膜、神經重新看一張兩千年的身體地圖", "excerpt": "不要再把經絡當玄學—我就是被這句騙進去的 前幾天滑到一篇文章，大意是：「不要再把中醫的經絡當成玄學。」 這種標題對雞爸爸很有效，既然不是玄學，就是科學囉~明明只是滑手機，下一秒已經開始查筋膜、穴位、解剖列車、迷走神經，查著查著還差點忘記自己一開始到底想看什麼。", "date": "2026.10.06", "href": "/articles/vocus-20261006-0181471c.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "經絡", "筋膜", "筋絡不是玄學", "筋膜調理", "筋膜初探", "神經", "組織", "地圖", "科學", "中醫", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/aa3766df5c8cf5672523.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "保健室"}, {"journal": "family", "title": "身體真的越鬆越好嗎？雞爸爸的脊椎側彎、重訓到整復 RESET", "excerpt": "雞爸爸接觸推拿整復，總被提醒「身體太緊」，也因此開始追求放鬆。但研究筋膜、手法治療與重訓後才發現，「緊」不一定等於不好，身體更重要的是肌肉、神經與骨架能否協同工作。RESET 可以帶來當下舒服，卻不會自動建立力量與穩定。現在的雞爸爸，比起追求越鬆越好，更在意身體是否真的好用、撐得住生活。", "date": "2026.10.06", "href": "/articles/vocus-20261006-01785257.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "筋膜", "經絡", "肌肉", "神經", "整復", "推拿", "脊椎側彎", "帳篷", "張力", "組織", "控制", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/54b04c506b8fbffaf06d.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "保健室"}, {"journal": "family", "title": "《歡迎來龍餐館》後記：人在最脆弱的時候，有誰願意餵你一口飯？", "excerpt": "《歡迎來龍餐館》表面談戰爭，真正讓雞爸爸放不下的，卻是那些被推向命運岔路的人。東尼把孩子視為未來敵人，老扎被仇恨吞沒，賽夫卻在失去一眼後，看清所謂「戰士」的真相。電影反覆出現「餵飯」：人在最脆弱時，不論大人還是孩子，都需要有人先說一句「張嘴，先活下來。」有時候，人生真正的轉彎，可能就從這一口飯開始。", "date": "2026.10.06", "href": "/articles/vocus-20261006-01932a79.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "歡迎來龍餐館", "沈騰", "文牧野", "李治廷", "戰爭與孩子", "兒童", "創傷", "仇恨", "人生低谷", "內在小孩", "餵飯", "張嘴", "徐福", "賽夫", "老扎", "東尼王", "我不是藥神", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/56bf65fb097f2d3af79b.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "光影誌"}, {"journal": "family", "title": "《歡迎來龍餐館》戰爭很遠，直到你看見那也是誰家的孩子", "excerpt": "本來只是想看沈騰輕鬆一下，結果《歡迎來龍餐館》卻讓雞爸爸一路從餐館、戰亂、逃亡，看到一群孩子如何在大人的戰爭裡努力活下來。最打動我的，不是哪一場戰爭，而是那句：「那也是孩子。」電影結束後，看著家裡熟睡的兩個孩子，才突然發現，能安心吃飯、長大、煩惱生活裡的小事，本身就是一種值得珍惜的幸福。", "date": "2026.10.05", "href": "/articles/vocus-20261005-0193aff4.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "歡迎來龍餐館", "沈騰", "電影心得", "反戰", "恐怖主義", "兒童與戰爭", "親子", "那也是孩子", "父親視角"], "cover": "/assets/posts/vocus-import-20261105/b5809ae0300befaaac3b.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "光影誌"}, {"journal": "family", "title": "我們總習慣把最喜歡的，都保存得太好了", "excerpt": "—為什麼不讓它在愛意最深的時候，進入你的生命裡流動 前幾天，兔阿嬤帶了一支 Dyson 回來。 剛好鼠姊姊最近學會自己洗澡，也開始想自己吹頭髮，只是家裡原本的吹風機對她來說有點重，拿沒多久就會手痠。 鼠媽媽看著兔阿嬤那支又輕、風又大的 Dyson，便說：「不然我們也去買一支…」", "date": "2026.10.03", "href": "/articles/vocus-20261003-01ede4c1.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "vocus2026", "鼠姊姊", "吹風機", "Dyson吹風機", "小米", "捨不得", "使勁用", "進入生命中流動", "進入生命", "物的功能"], "cover": "/assets/posts/vocus-import-20261105/19f6acf9212cfa59267f.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": " 一張小朋友，就成功取悅一個小朋友。👿", "date": "2026.09.27", "href": "/articles/vocus-20260927-01409bcb.html", "tags": ["雞爸爸內心小惡魔", "雞爸爸ChickenDad", "鼠姊姊", "生日快樂", "vocus2026", "價格", "價值"], "cover": "/assets/posts/vocus-import-20261105/b7ffdd555e9e71d2ed27.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "devil", "title": "人生其實只有兩件事...", "excerpt": "雞爸爸內心小惡魔說：「人生只有兩件事：關你屁事，和關我屁事。」 別把他人想法當成你的人生待辦清單—因為成熟不是看開，是終於學會分類... 😈", "date": "2026.09.24", "href": "/articles/vocus-20260924-016225db.html", "tags": ["雞爸爸內心小惡魔", "雞爸爸ChickenDad", "vocus2026", "成熟", "分類"], "cover": "/assets/posts/vocus-import-20261105/533c8b57b62f312a7282.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "devil", "title": "很多工作就像私生子一樣...", "excerpt": "雞爸爸內心小惡魔：「很多工作就像私生子一樣，突然跳出來就要我負責。」 沒有最可怕，只有更可怕...英雄不怕工作多，只是它明明不是我生的，最後大家卻說： 「沒關係，你比較熟，你處理一下。」 嗯，熟到都可以驗 DNA 了... 😈", "date": "2026.09.24", "href": "/articles/vocus-20260924-0161491c.html", "tags": ["雞爸爸內心小惡魔", "雞爸爸ChickenDad", "vocus2026"], "cover": "/assets/posts/vocus-import-20261105/93c825467663a7ab45ac.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "devil", "title": "雞爸爸跟小妾說：我想開房間...", "excerpt": "最近雞爸爸想找小妾一起開個房間... 鼠媽媽先別急，小妾只是跟雞爸爸心中的小惡魔合作， 惡魔雞爸爸多兩根角，不陽光、愛偷懶，只會在雞爸爸耳邊講幹話... 有些話雞爸爸不好說，就讓他說吧。 歡迎入住——雞爸爸內心小惡魔。", "date": "2026.09.24", "href": "/articles/vocus-20260924-01603443.html", "tags": ["雞爸爸內心小惡魔", "雞爸爸幹話集", "雞爸爸ChickenDad", "vocus2026", "小惡魔"], "cover": "/assets/posts/vocus-import-20261105/4cbcd7cad1609726dcfa.webp", "roomLabel": "雞爸爸內心小惡魔", "originalCategory": "風格誌"}, {"journal": "family", "title": "我們總把時間留給最急的事，卻忘了最重要的人", "excerpt": "為了讓容易慌張的鼠姊姊能更從容進教室，我們開始提早起床，也重新調整每天送孩子的路線。只是多繞了一段路，雞爸爸卻在途中想起研究所教授，也重新看見鼠媽媽與兔阿嬤。原來家庭裡最會照顧別人、最能照顧自己的人，反而最容易被放心地放到最後。人生真正需要重新校準的，也許不是行程表，而是我們心裡那張重要順序表。", "date": "2026.09.23", "href": "/articles/vocus-20260923-01efc149.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "親子陪伴", "家庭關係", "時間分配", "人生省思", "中年生活", "家庭分工", "陪伴", "珍惜當下", "人生重新校準", "雞爸爸", "鼠姊姊", "鼠媽媽", "兔阿嬤", "龍弟弟", "vocus2026", "學校", "生日快樂", "謝謝我的人生導師"], "cover": "/assets/posts/vocus-import-20261105/17c123d965a46bea47c7.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "我們只是想順便調一下眼鏡，結果「啪」的一聲事情就不單純了", "excerpt": "原本只是吃完晚餐，順路幫鼠媽媽調整一下變形的眼鏡，沒想到雞爸爸才剛看到桌上的「損壞恕不賠償」，下一秒就聽見「啪」的一聲。從找原廠、跑同品牌分店，到勉強找到替代鏡框，原本五分鐘的小事，硬是變成一場家庭小冒險。最後救場的，竟然是那副早就退休、差點被遺忘的舊眼鏡。", "date": "2026.09.22", "href": "/articles/vocus-20260922-0160556c.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸", "鼠媽媽", "中天眼鏡", "寶島眼鏡", "vocus2026", "眼鏡行", "天母", "教師節連假", "中秋節", "生活散文"], "cover": "/assets/posts/vocus-import-20261105/5fe88674720a6f536a2d.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "六歲以前，她怕的是自己洗澡；後來卻開始期待自己的床", "excerpt": "鼠姊姊六歲生日快到了，卻一直想不到自己想要什麼禮物。最後，我們決定送她一張上下舖，從SUNBABY看到IKEA，途中還意外上演一場「常山雞子龍」迷路記。原本有點害怕六歲、擔心要開始自己洗澡的鼠姊姊，因為期待新床，開始期待生日快點到來。原來孩子開始期待自己的空間時，家裡也正悄悄替她騰出長大的位置...", "date": "2026.09.21", "href": "/articles/vocus-20260921-01013923.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "鼠姊姊", "鼠媽媽", "兔阿嬤", "龍弟弟", "雞爸爸", "vocus2026", "六歲生日", "生日禮物", "上下舖", "兒童房", "ikea", "親子生活", "育兒日常", "家庭生活", "獨立練習", "親子陪伴", "家庭教育", "成長紀錄"], "cover": "/assets/posts/vocus-import-20261105/903c565be6abdd2fa708.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "有一天，名字終於追上了現在的自己", "excerpt": "昨天和兔阿嬤回淡水整理老家時，翻出雞爸爸幼兒園的照片。想不到龍弟弟一看到幾十年前、連名字都不同的小男孩，卻一眼認出「爸爸」。也讓雞爸爸重新想起，名字會改、身分會變，但過去從未真正消失。就像從機器學習走到雞爸爸生活研究室，新的名字不是刪掉以前，而是終於裝得下後來長成的自己...", "date": "2026.09.21", "href": "/articles/vocus-20260921-01fb1884.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "vocus2026", "家庭記憶", "童年回憶", "名字", "改名", "成長", "人生故事", "淡水", "舊照片", "人生沒有NewProject", "LifeLearning", "幼兒園", "Facebook"], "cover": "/assets/posts/vocus-import-20261105/8bd28ab7f2267cebb089.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "風格誌"}, {"journal": "family", "title": "不是活得更用力，而是不要離自己太遠", "excerpt": "偶然間發現國中同學的先生突然因主動脈剝離離世，正感慨人生無常時，讀到《100天後會死的鱷魚》。如果真的知道自己只剩100天，真的需要把原本的人生全部推翻嗎？追過夢、愛過人、有朋友、有日常，這樣的生活真的不夠好嗎？也許比起死前突然用力活，更重要的是，平常就別讓自己離想要的人生太遠...", "date": "2026.09.18", "href": "/articles/vocus-20260918-0102e2dc.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "100天後會死的鱷魚", "人生無常", "平常心", "生活哲學", "人生選擇", "活在當下", "日常生活", "死亡思考", "vocus2026", "生命", "夢想"], "cover": "/assets/posts/vocus-20260918-0102e2dc/7be0d453-11e6-4dd1-aca7-eb4b96188300.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "看完常風大俠「四海之內皆兄弟」，我突然想到鼠姊姊最近的交友世界", "excerpt": "常風大俠一路遇人就結拜，真正把「四海之內皆兄弟」活成了江湖笑話。笑著笑著，雞爸爸卻想到鼠姊姊最近的交友困擾：有人用「不跟妳玩」要求朋友選邊站。比起急著替孩子解決關係，也許更重要的是陪她站穩自己，知道別人的規則不必變成自己的規則。與其讓一句「不跟妳玩」縮小世界，不如更豁達地笑傲江湖...", "date": "2026.09.17", "href": "/articles/vocus-20260917-01ede58c.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "鼠姊姊", "天龍八部", "喬峰", "常風", "四海之內皆兄弟", "人際關係", "幼兒園", "笑傲江湖", "令狐沖", "親子教養", "幼兒園生活", "孩子交友", "友情教育", "情緒陪伴", "育兒觀察"], "cover": "/assets/posts/vocus-20260917-01ede58c/5b560c23-8cc6-4de2-bd3a-8f8bfad5b80b.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "鼠姊姊的新生活運動：雞老師第一堂ㄅㄆㄇ，還以為 App 在罵人", "excerpt": "老師一句「不專心」讓雞爸爸開始了鼠姊姊的「新生活運動」：放學後在車上多聊天，回家後再陪她玩著複習ㄅㄆㄇ。從搞不清楚聲母、韻母，到下載注音 App，一路笑著學到ㄏ，沒想到睡前還收到一句：「雞爸爸教得比老師還好。」後來才發現，孩子真正喜歡的，也許不是多一堂課，而是有人願意陪她一起走進正在長大的世界。", "date": "2026.09.16", "href": "/articles/vocus-20260916-01b5a802.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "鼠姊姊", "雞爸爸", "鼠媽媽", "龍弟弟", "兔阿嬤", "ㄅㄆㄇ", "APP", "老師", "注音符號", "聲母", "韻母", "體操", "學習", "上課", "報名好習慣養成班"], "cover": "/assets/posts/vocus-20260916-01b5a802/0d7fc89b-354e-4372-a9de-1fb1e2c7d238.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "原來人生沒有 New Project，只有繼續寫下去", "excerpt": "每到一個新平台，都得從零開始。直到想起那個沉睡許久的「機器學習與深度學習資源分享」粉絲團，突然發現：以前研究資料、模型與演算法的自己，從來沒有離開。只是研究的對象，變成孩子、家庭與生活。也許人生沒有 New Project，不必刪掉過去才能成為新的自己；所謂重新開始，只是把曾經的自己帶上，繼續往前", "date": "2026.09.16", "href": "/articles/vocus-20260916-01b0b65a.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸", "vocus2026", "Facebook", "Instagram", "Threads", "Youtube", "粉絲團", "改名", "重新開始", "機器學習", "機器學習與深度學習分享"], "cover": "/assets/posts/vocus-20260916-01b0b65a/5f20862c-96f6-4bb2-9148-216f5ebe6dba.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "我們一直都在她身邊，卻差點錯過她最近的心事", "excerpt": "老師一句「最近好像有點不專心」，讓雞爸爸重新回頭看鼠姊姊最近的生活：眼睛不舒服、ㄅㄆㄇ還認不熟、朋友關係有變化，也快要六歲，開始面對更多「長大一點」的期待。原來一直陪在孩子身邊，不代表真的知道她在想什麼。比起急著要求，雞爸爸更想先抱抱她、聽她說，也陪她慢慢畫出自己想成為的樣子。", "date": "2026.09.15", "href": "/articles/vocus-20260915-013f4896.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "鼠姊姊", "幼兒園", "不專心", "進度落後", "學習", "作業", "ㄅㄆㄇ", "孩子", "人生", "白紙", "老師", "眼睛"], "cover": "/assets/posts/vocus-20260915-013f4896/72ad3d78-632b-498b-955b-042219d5e7b4.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "雞爸爸差點被煮成心靈雞湯：怕的不是走錯路 而是落入別人的局 #內心的恐懼", "excerpt": "—有些騙局拿走的是錢，有些局拿走的，卻可能是一段一段的人生\n\n最近雞爸爸開始問自己到底怕什麼？想人生也快邁向五字頭，失敗本身好像都還沒那麼可怕，畢竟走錯路、跌一跤、重新開始，很多時候都還有機會。雞爸爸反而感到害怕的是：會不會有天發現自己的人生，其實只是一直被別人的利益推著走...", "date": "2026.09.14", "href": "/articles/vocus-20260914-01405379.html", "tags": ["雞爸爸生活研究室", "雞爸爸ChickenDad", "雞爸爸", "心靈雞湯", "局", "設局", "騙局", "成功", "慾望", "野心", "成就感", "失敗", "孩子", "人生", "內心的恐懼", "意圖", "利益"], "cover": "/assets/posts/vocus-20260914-01405379/e26c2512-6c7e-4f69-87b5-8bf2b7465730.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "家庭誌"}, {"journal": "family", "title": "以前總想把敏感和內向修好，後來才發現，有些缺口就是我們溫柔的形狀", "excerpt": "原本只在車上聽首歌，卻意外看見以前的自己。《哀人(i)》寫的是 I 人在愛情裡的哀傷，卻把內心的痛、不甘與反省一起唱出來。以前總覺得敏感、內向、想太多都需要修正，後來才明白，真正讓人累的，不是敏感本身，而是一直否定敏感的自己。人生走了一段後才發現，有些缺口不必補好，因為那些容易受傷的地方．．．", "date": "2026.09.11", "href": "/articles/vocus-20260911-01b3eb74.html", "tags": ["雞爸爸生活研究室", "雞爸爸", "哀人", "i人", "內向", "敏感", "自我接納", "情緒", "成長", "HSP", "高敏感", "余文樂", "王以太", "艾熱", "披荊斬棘", "披荊斬棘的哥哥", "愛情", "內心的恐懼"], "cover": "/assets/posts/vocus-20260911-01b3eb74/9bdbed66-fd19-40b7-a84a-d9a776e2fab1.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "風格誌"}, {"journal": "family", "title": "雞爸爸 ChickenDad 官方 Threads 重新開張：歡迎來到脆雞爸爸生活研究室", "excerpt": "重新都更過一遍，發現其實是篇很長的 Threads 開幕廣告\n\n有些帳號消失的時候，很像搬家。東西還在，故事也還在，只是原本的門牌突然不見了。之前雞爸爸的 Threads 帳號被停用之後，其實有一段時間沒有很想重來。一方面覺得麻煩。另一方面也忍不住想：「都這麼久了，難道又要從『嗨，我是雞爸爸』開始?", "date": "2026.09.10", "href": "/articles/vocus-20260910-01ff2026.html", "tags": ["雞爸爸生活研究室", "雞爸爸", "脆", "永久停用", "Threads", "Instagram", "帳號", "開幕", "官方帳號", "雞爸爸ChickenDad", "一家人", "鼠媽媽", "鼠姊姊", "龍弟弟", "兔阿嬤", "健康", "Vocus", "vocus2026"], "cover": "/assets/posts/vocus-20260910-01ff2026/3566baf3-e294-4a7b-a586-2587a09e47f0.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "風格誌"}, {"journal": "family", "title": "《Meow Life Story》：本來只是開給龍弟弟看的貓咪，最後變成全家的「另類爽片」", "excerpt": "鼠媽媽每天晚上去洗澡，都是龍弟弟最焦躁的時刻...\n\n昨晚雞爸爸原本只想開Youtube吸引他，沒想到一隻「騎車車的貓咪」讓他召集全家坐下來看。看貓媽媽和兩個寶貝遇到困難，如何解決。看完才發現，療癒的不只是可愛貓咪，而是一個努力會有回音的世界；即使結果不如預期，幸福也可能在轉角出現...", "date": "2026.09.09", "href": "/articles/vocus-20260909-01f2a4b1.html", "tags": ["雞爸爸生活研究室", "雞爸爸", "龍弟弟", "兔阿嬤", "鼠姊姊", "鼠媽媽", "右右", "貓咪", "爽片", "YouTube", "消防車", "騎車"], "cover": "/assets/posts/vocus-20260909-01f2a4b1/9d3f6327-de44-4138-91be-fe82c2e129ed.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "光影誌"}, {"journal": "family", "title": "最怕的不是孩子受傷，而是她已經說了，我卻沒有聽懂 #內心的恐懼", "excerpt": "原本以為只是過敏；直到第二位醫師也說角膜磨破皮，雞爸爸才想起—兩個多月前，這件事其實已經發生過一次。\n\n鼠姊姊最近每天早上要起床都會遇到一堆麻煩事，首先是眼睛被黃色乾掉的分泌物黏住，沒有辦法睜開。接著又被廁所燈照得睜不開眼睛...雞爸爸眉頭一皺，發現案情並不單純...", "date": "2026.09.08", "href": "/articles/vocus-20260908-019f8af6.html", "tags": ["雞爸爸生活研究室", "鼠姊姊", "雞爸爸", "鼠媽媽", "畏光", "眼睛", "眼屎", "眼藥水", "內心的恐懼", "檢查", "受傷", "健康", "醫師", "過敏"], "cover": "/assets/posts/vocus-20260908-019f8af6/9fe864fc-5835-4b27-a4c8-e7388a3be771.webp", "roomLabel": "雞爸爸一家生活紀錄", "originalCategory": "保健室"}, {"journal": "family", "title": "雞爸爸不怕事情難，只怕事情一改再改磨得沒完 #內心的恐懼", "excerpt": "如果有人問：「你內心裡最害怕什麼？」鬼嗎？好像還好。蟲嗎？有些長得比較有創意的，雞爸爸確實會選擇保持安全社交距離。黑暗、密閉空間、恐怖片？也都沒有到真的會讓雞爸爸睡不著。\n\n直到最近才發現，真正讓我看到手機螢幕，心臟突然漏跳一下的東西，其實非常普通。不是鬼、不是死亡、甚至不是什麼人生大事，而是一個人", "date": "2026.09.07", "href": "/articles/vocus-20260907-015c94b3.html", "tags": ["雞爸爸生活研究室", "雞爸爸", "內心的恐懼", "業務", "理賠", "       if (item.cover) return item.cover;
      return 'assets/story-covers/default.svg';
    }

    function autoCoverPosition(item) {
      return item.coverPosition || 'center center';
    }

    const grid = document.getElementById('cards-grid');
    const filtered = key === 'all' ? stories : stories.filter(item => item.journal === key);
    filtered.forEach(item => {
      const a = document.createElement('a');
      a.className = 'story-card';
      a.href = item.href || '#';
      const cardImage = autoCover(item);
      const cardPosition = autoCoverPosition(item).replace(/"/g, '&quot;');
      const cardAlt = (item.coverAlt || `${item.title} 封面`).replace(/"/g, '&quot;');
      a.innerHTML = `
        <div class="card-media">
          <img src="${cardImage}" alt="${cardAlt}" loading="lazy" style="object-position:${cardPosition};" onerror="this.onerror=null;this.src='assets/story-covers/default.svg';">
        </div>
        <div class="card-head">
          <span class="card-journal">${item.roomLabel}</span>
          <span class="card-date">${item.date}</span>
        </div>
        <h3>${item.title}</h3>
        <p class="card-excerpt">${item.excerpt}</p>
        <div class="card-tags">${(item.tags || []).map(tag => `<span>${tag}</span>`).join('')}</div>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
