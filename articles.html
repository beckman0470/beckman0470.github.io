    const stories = [{"journal":"light","title":"《Meow Life Story》：本來只是開給龍弟弟看的貓咪，最後變成全家的「另類爽片」","excerpt":"鼠媽媽每天晚上去洗澡，都是龍弟弟最焦躁的時刻...\n\n昨晚雞爸爸原本只想開Youtube吸引他，沒想到一隻「騎車車的貓咪」讓他召集全家坐下來看。看貓媽媽和兩個寶貝遇到困難，如何解決。看完才發現，療癒的不只是可愛貓咪，而是一個努力會有回音的世界；即使結果不如預期，幸福也可能在轉角出現...","date":"2026.09.09","href":"https://vocus.cc/article/6aa0c6f4fd89780001f2a4b1","tags":["雞爸爸生活研究室","雞爸爸","龍弟弟"],"cover":"https://images.vocus.cc/9d3f6327-de44-4138-91be-fe82c2e129ed.png"},{"journal":"health","title":"最怕的不是孩子受傷，而是她已經說了，我卻沒有聽懂 #內心的恐懼","excerpt":"原本以為只是過敏；直到第二位醫師也說角膜磨破皮，雞爸爸才想起—兩個多月前，這件事其實已經發生過一次。\n\n鼠姊姊最近每天早上要起床都會遇到一堆麻煩事，首先是眼睛被黃色乾掉的分泌物黏住，沒有辦法睜開。接著又被廁所燈照得睜不開眼睛...雞爸爸眉頭一皺，發現案情並不單純...","date":"2026.09.08","href":"https://vocus.cc/article/6a9f749ffd897800019f8af6","tags":["雞爸爸生活研究室","鼠姊姊","雞爸爸"],"cover":"https://images.vocus.cc/9fe864fc-5835-4b27-a4c8-e7388a3be771.png"},{"journal":"family","title":"雞爸爸不怕事情難，只怕事情一改再改磨得沒完 #內心的恐懼","excerpt":"如果有人問：「你內心裡最害怕什麼？」鬼嗎？好像還好。蟲嗎？有些長得比較有創意的，雞爸爸確實會選擇保持安全社交距離。黑暗、密閉空間、恐怖片？也都沒有到真的會讓雞爸爸睡不著。\n\n直到最近才發現，真正讓我看到手機螢幕，心臟突然漏跳一下的東西，其實非常普通。不是鬼、不是死亡、甚至不是什麼人生大事，而是一個人","date":"2026.09.07","href":"https://vocus.cc/article/6a9e6575fd897800015c94b3","tags":["雞爸爸生活研究室","雞爸爸","內心的恐懼"],"cover":"https://images.vocus.cc/6cddac74-fddf-49ad-a5f6-ab94dd4f7057.png"},{"journal":"library","title":"原來創作不是多學一套方法：《創造力的修行》讓我看見自己的稜鏡 #報名好習慣養成班","excerpt":"開始寫作以後，雞爸爸曾經花了不少時間去想一個問題：到底什麼叫做「自己的風格」？是文字幽默？喜歡從生活裡找題目？文章最後的反思？還是讀者看了三段以後，就能說：「嗯，這一看就知道是雞爸爸寫的」？\n\n如果把創作當成一項技能，好像很自然就會開始找方法，但實際世界本身就是素材，差異在於我們是什麼樣的稜鏡...","date":"2026.09.07","href":"https://vocus.cc/article/6a9e1813fd8978000141d98c","tags":["雞爸爸生活研究室","雞爸爸","報名好習慣養成班"],"cover":"https://images.vocus.cc/c09a80b0-5367-4782-8d6c-a9835d280817.png"},{"journal":"family","title":"感謝格編在雞爸爸快寫不下去時，送來了一份小確幸：入圍本週創作者推薦","excerpt":"當流感、大雨、家人生病輪番上陣，雞爸爸開始懷疑自己是不是沒力氣繼續下去...原來：那些念念不忘的小日子，其實也有迴響...\n\n隨著雞爸爸最近才剛告別方格新手，常常有一種很奇怪的感覺。明明每天都忙很多事，卻又覺得好像沒發生什麼事，生活太過緻密，靈感沒有呼吸的空隙...無法發芽...","date":"2026.09.04","href":"https://vocus.cc/article/6a9a2b6ffd89780001574c0b","tags":["雞爸爸生活研究室","     function autoCover(item) {
