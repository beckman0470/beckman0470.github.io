<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雞爸爸客廳祭拜入口安裝器</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:640px;margin:40px auto;padding:20px;background:#f8f1e5;color:#3b2b20;line-height:1.8}main{background:white;padding:30px;border-radius:20px;box-shadow:0 7px 30px #7b56331c}button{font:700 18px system-ui;border:0;border-radius:12px;padding:15px 23px;background:#814b25;color:white;cursor:pointer;max-width:100%}p{margin:12px 0}a{color:#83461f}#status{white-space:pre-wrap;color:#5c3a20}code{background:#f9efd9;padding:3px 6px;border-radius:4px}</style></head><body><main><h1>雞爸爸客廳｜入口安裝器</h1><p>此工具會讀取 GitHub 公開的最新版 <code>videos.html</code>，保留原本客廳內容，再自動加入神桌與「點香祭拜」入口。</p><button id="do" type="button">產生可直接上傳的 videos.html</button><p id="status" role="status" aria-live="polite"></p><p>完成後，將下載的 <code>videos.html</code> 連同功能包內的 <code>worship/</code> 和 <code>js/worship-entry.js</code> 上傳 GitHub 儲存庫同名路徑即可。</p><p>注意：這個工具不會直接修改你的 GitHub；需要你在 GitHub 確認並上傳檔案。</p></main><script>document.getElementById('do').onclick=async()=>{const el=document.getElementById('status'),btn=document.getElementById('do');btn.disabled=true;el.textContent='正在讀取 GitHub 上的客廳原始檔…';try{const response=await fetch('https://raw.githubusercontent.com/beckman0470/beckman0470.github.io/main/videos.html?date='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('無法取得 GitHub 檔案（HTTP '+response.status+'）');let html=await response.text();if(!html.includes('</body>'))throw Error('找不到客廳頁面結尾，已取消');if(!html.includes('/js/worship-entry.js'))html=html.replace('</body>','<script defer src="/js/worship-entry.js?v=20261117-v5"></'+'script></body>');const blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='videos.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);el.textContent='已產生 videos.html。接著與功能包內其他檔案一起上傳 GitHub。'}catch(e){el.textContent='產生失敗：'+e.message+'。你也可以直接在 GitHub 的 videos.html 結尾加入一行 script。'}finally{btn.disabled=false;}};</script></body></html>
