<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雞爸爸｜金紙照片定案預覽</title><style>
:root{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;color:#ffe7b5;background:#25140e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#6b2917 0%,#2b150f 57%,#180e0b 100%)}
main{max-width:1380px;margin:auto;padding:20px 20px 35px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c89245;padding:18px 6px 23px;gap:20px}
h1{font-family:serif;font-size:clamp(29px,4vw,44px);color:#ffdc88;letter-spacing:.14em;margin:0}header span{color:#e7b979}
.sheet{margin-top:16px;border:1px solid #ad713b;padding:20px;border-radius:23px;background:#4c271be6;box-shadow:0 16px 50px #1108066a}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.col{padding:12px 12px 13px;border:1px solid #b47b47;border-radius:13px;background:linear-gradient(170deg,#4f2d21,#371d17);min-width:0}
.col h2{font-size:clamp(17px,2vw,24px);color:#ffdd95;margin:4px 0 8px;text-align:center}
.phase{border-top:1px solid #9d6441;margin-top:11px;padding-top:11px}.phase strong{font-size:14px;color:#efd19b;display:block;text-align:center;margin-bottom:9px}
.photo{background:#fbf4ef;border:1px solid #d1a36b;border-radius:8px;min-height:180px;height:190px;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.photo img{display:block;max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 2px #a3734030)}
.phase small{display:block;text-align:center;margin-top:7px;color:#d9c29d}
footer{color:#c3a178;font-size:13px;line-height:1.7;margin-top:16px;text-align:center}
@media(max-width:700px){main{padding:10px}header{padding:12px 6px}header span{display:none}.sheet{padding:8px}.cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.col{padding:6px}.photo{height:155px;min-height:155px;padding:2px}.phase strong{font-size:12px}.col h2{font-size:18px}}
</style></head><body><main><header><h1>燒金紙｜四種金紙定案圖片</h1><span>雞爸爸生活研究室 · 線上祭拜</span></header><div class="sheet"><div class="cols">

<section class="col"><h2>福金</h2><div class="phase"><strong>有束帶</strong><div class="photo"><img src="./worship/assets/approved-福金-bundle.webp" alt="福金 有束帶"></div></div><div class="phase"><strong>無束帶</strong><div class="photo"><img src="./worship/assets/approved-福金-loose.webp" alt="福金 無束帶"></div></div><div class="phase"><strong>對折後</strong><div class="photo"><img src="./worship/assets/approved-福金-folded.webp" alt="福金 對折後"></div></div></section>
<section class="col"><h2>刈金</h2><div class="phase"><strong>有束帶</strong><div class="photo"><img src="./worship/assets/approved-刈金-bundle.webp" alt="刈金 有束帶"></div></div><div class="phase"><strong>無束帶</strong><div class="photo"><img src="./worship/assets/approved-刈金-loose.webp" alt="刈金 無束帶"></div></div><div class="phase"><strong>對折後</strong><div class="photo"><img src="./worship/assets/approved-刈金-folded.webp" alt="刈金 對折後"></div></div></section></div></div><footer>此預覽直接使用原定案對照圖中的金紙照片，不重新繪製金紙、束帶、金箔或折線；僅調整網站容器的色調與樣式。</footer></main></body></html>
