function drawParty(ctx,group,tile){
 const motion=group.motion;
 const progress=motion?Math.min(1,(performance.now()-motion.started)/145):1;
 const figures=group.trail.map(({x,y},index)=>{
  const before=motion?.trail[index]||{x,y};
  return {x:(before.x+(x-before.x)*progress)*tile+tile/2,y:(before.y+(y-before.y)*progress)*tile+tile,member:fieldParty()[index]};
 });
 const stride=motion?Math.sin(progress*Math.PI*2)*2.5:0;
 figures.sort((a,b)=>a.y-b.y);
 for(const figure of figures){
  if(!figure.member)continue;
  drawTraveler(ctx,figure.member.id,figure.x,figure.y,group.facing||1,stride);
 }
}
function animateTravel(group,draw){
 const motion=group.motion;
 function frame(){
  if(group.motion!==motion||!view.querySelector('.walk-map')||(group===town?Boolean(walk||battle||supplies||titleScreen):walk!==group))return;
  draw();
  if(performance.now()-motion.started<145)requestAnimationFrame(frame);
  else delete group.motion;
 }
 frame();
}
function moveWalk(direction){
 if(walk.clue)return;
 const [dx,dy]=directions[direction],hero=walk.trail[0],x=hero.x+dx,y=hero.y+dy;
 if(x<0||x>=20||y<0||y>=9||Math.abs(y-road(x))>1)return;
 walk.motion={trail:walk.trail.slice(),started:performance.now()};
 if(dx)walk.facing=dx;
 walk.trail.unshift({x,y});walk.trail.pop();walk.steps++;
 const clue=state.chapter===0&&!walk.returning?roadClues[walk.clueIndex]:null;
 if(clue&&x>=clue.x){walk.clue=clue;render();return;}
 if(walk.returning&&x===0){finishReturn();render();}
 else if(!walk.returning&&x>=walk.encounter){state.returnX=x;state.returnY=y;walk=null;startBattle();render();window.scrollTo(0,0);}
 else animateTravel(walk,drawWalk);
}

function animateBattle(){
 const attacks=battle.effects.splice(0);
 if(!attacks.length)return 0;
 const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const duration=battle.auto?210:350;
 const interval=battle.auto?130:210;
 attacks.forEach(({attacker,target},index)=>{
  const source=view.querySelector('[data-slot="'+attacker+'"]');
  const victim=view.querySelector('[data-slot="'+target+'"]');
  if(!source||!victim)return;
  const delay=index*interval;
  const direction=attacker.startsWith('ally')?1:-1;
  if(!reducedMotion){
   const body=source.getBoundingClientRect();
   const bar=source.parentElement.querySelector('.meter').getBoundingClientRect();
   const advance=Math.max(8,direction*((direction===1?bar.right:bar.left)-(body.left+body.width/2)));
   source.animate([
    {transform:'translateX(0) rotate(0)'},
    {transform:'translateX('+direction*advance+'px) rotate('+direction*-8+'deg)',offset:.42},
    {transform:'translateX('+direction*(advance+7)+'px) rotate('+direction*18+'deg)',offset:.58},
    {transform:'translateX(0) rotate(0)'}
   ],{duration,delay,easing:'ease-in-out'});
  }
  victim.animate([
   {filter:'brightness(1)',opacity:1},
   {filter:reducedMotion?'brightness(1.35)':'brightness(3) drop-shadow(0 0 5px #ffe594)',opacity:1,offset:.38},
   {filter:'brightness(1)',opacity:1}
  ],{duration:160,delay:delay+duration*.48});
 });
 const elapsed=(attacks.length-1)*interval+duration;
 battle.busyUntil=performance.now()+elapsed;
 return elapsed;
}

function trade(kind,type,index){
 if(type==='ration'){
  if(kind==='buy'&&state.gold>=15){state.gold-=15;state.rations=rationCount()+1;}
  if(kind==='sell'&&rationCount()>0){state.gold+=7;state.rations=rationCount()-1;}
 }else{
  const member=state.party[shopMember],owned=member[type+'Owned'];
  const price=(type==='weapon'?weapons:armors)[index][2];
  if(kind==='buy'&&!owned.includes(index)&&state.gold>=price){state.gold-=price;owned.push(index);}
  if(kind==='equip'&&owned.includes(index))member[type]=index;
  if(kind==='sell'&&index>0&&owned.includes(index)){
   if(member[type]===index)member[type]=0;
   member[type+'Owned']=owned.filter(item=>item!==index);state.gold+=Math.floor(price/2);
  }
 }
 save();
}

function render(){
 document.body.classList.toggle('exploration',!battle);
 document.body.classList.toggle('in-battle',Boolean(battle));
 reset.hidden=Boolean(titleScreen)||!state||Boolean(battle);
 if(titleScreen){
  view.innerHTML='<section class="title-screen"><img class="cover-art" src="'+familyCover+'" alt="雞爸爸一家穿著三國古裝，在桃花樹下合照"><div class="cover-content">'+
   '<p class="chapter">雞爸爸生活研究室</p><h2><span>雞爸爸家</span><span>穿越三國</span></h2><p class="title-subtitle">桃源起兵</p>'+
   '<div class="title-menu">'+button('重新開始','new-game',titleCursor===0?'cursor':'')+
   button('載入進度','load-game',titleCursor===1?'cursor':'',!state)+'</div><small>'+
   (state?'存檔 · 第 '+Math.min(state.chapter+1,chapters.length)+' 章 · 等級 '+state.level:'目前沒有存檔')+'</small></div></section>';
  return;
 }
 if(!state){
  view.innerHTML=scene('東漢末年 · 涿郡','桃源村','雞爸爸一睜眼，竟從現代穿越到了東漢末年。他走到井邊一照，水裡還是自己的臉，身後卻有人喚他「劉玄德」。黃巾起事，他以劉備的身分與關羽、張飛在桃園結義，從桃源村出發。')+
  '<div class="section"><h3>開局隊伍</h3><div class="grid roster">'+startingParty.map(id=>{
   const [name,role,power,wisdom]=heroes[id];
   return '<div class="card"><img class="roster-portrait" width="420" height="420" src="'+openingPortraits[id]+'" alt="'+(id===8?'雞爸爸化身劉備':name)+'頭像"><div class="roster-details"><strong>'+name+'</strong><small>'+(id===8?'雞爸爸化身':role)+'</small><small class="roster-stats">武 '+power+'　智 '+wisdom+'</small></div></div>';
  }).join('')+'</div></div>'+button('進入桃源村','start','primary');
 }else if(state.storyStage==='aftermath'){
  const [speaker,line]=missions[state.chapter].aftermath[storyPage];
  view.innerHTML=scene('戰後',chapters[state.chapter][0],speaker+'　'+line,state.chapter)+
   '<div class="section">'+button(storyPage+1===missions[state.chapter].aftermath.length?'護送回城':'繼續','story-next','primary')+'</div>';
 }else if(walk){
  const c=chapters[state.chapter];
  view.innerHTML='<div class="bar"><div><small class="chapter">第 '+(state.chapter+1)+' 章</small><h2>'+c[0]+'</h2></div>'+(walk.returning?'':button('返回城內','camp'))+'</div>'+
  '<canvas class="walk-map" width="1440" height="648" role="img" aria-label="三名武將沿道路前進"></canvas>'+
  '<div class="bar"><p>'+(walk.returning?'沿原路往左走，進城後找村長回報。':'用方向鍵沿著道路前進。路上可能遇敵。')+'</p><div class="dpad" aria-label="移動">'+Object.keys(directions).map((key,i)=>button(['↑','↓','←','→'][i],'move:'+key)).join('')+'</div></div>';
  if(walk.clue)view.innerHTML+='<div class="panel"><strong>'+walk.clue.speaker+'</strong><p>'+walk.clue.line+'</p>'+button('繼續前進','road-next','primary')+'</div>';
  drawWalk();return;
 }else if(battle){
  const c=chapters[state.chapter], actor=battle.party[battle.turn], selectedSkill=skills[battle.skill];
  const choosingAlly=selectedSkill?.[3]==='ally'||battle.mode==='item';
  const choosingEnemy=battle.mode==='attack'||selectedSkill?.[3]==='enemy';
  const targetType=choosingAlly?'ally':choosingEnemy?'enemy':'';
  const needsHealing=battle.hp.some((hp,i)=>hp>0&&hp<maxHp(battle.party[i]));
  const commands=battle.mode==='tactics'&&!battle.skill
   ?advisor()[3].map(s=>button(skills[s][0]+' · '+skills[s][1]+' 點','skill:'+s,'',battle.sp<skills[s][1]||(s==='heal'&&!needsHealing))).join('')
   :battle.mode==='retreat'?button('繼續戰鬥','cancel')+button('確認撤退','retreat-confirm')
   :battleCommands.map((action,i)=>button(['攻 擊','總攻擊','策 略','道 具','休 息','撤 退'][i],action,'',action==='item'&&(!battle.rations||!needsHealing))).join('');
  const instruction=choosingEnemy?'選擇攻擊對象':choosingAlly?(battle.mode==='item'?'選擇使用軍糧的武將':'選擇需要補兵的友軍'):battle.mode==='tactics'?'選擇策略':battle.mode==='retreat'?'撤回城內？本場戰鬥將重新開始。':'下達指令';
  view.innerHTML='<div class="battle-title bar"><div><small class="chapter">第 '+(state.chapter+1)+' 章 · 第 '+battle.round+' 回合</small><h2>'+c[0]+'</h2></div>'+
  '<div><strong role="status">'+(battle.result==='win'?'戰鬥勝利':battle.result==='loss'?'義軍敗退':battle.result==='retreat'?'已撤離戰場':hero(actor)[0]+' 行動')+'</strong><br><small>軍師 '+advisor()[0]+' · 策略點 '+battle.sp+' / '+maxSP()+' · 軍糧 '+battle.rations+' · 滿格 '+battle.meterMax+'</small></div></div>'+
  '<div class="battlefield'+(battle.auto?' all-out':'')+'"><canvas width="450" height="110" data-land="'+state.chapter+'" aria-hidden="true"></canvas>'+
  '<section><h3>義軍</h3><div class="fighters" '+(targetType==='ally'?'data-nav="targets"':'')+'>'+battle.party.map((m,i)=>
   fighter(hero(m)[0],battle.hp[i],maxHp(m),m.id,false,i===battle.turn&&!battle.result,choosingAlly&&!battle.result?'ally:'+i:'',i)
  ).join('')+'</div></section><section><h3>敵軍</h3><div class="fighters" '+(targetType==='enemy'?'data-nav="targets"':'')+'>'+battle.enemies.map((e,i)=>
   fighter(e.name,e.hp,e.max,i,true,false,choosingEnemy&&!battle.result?'enemy:'+i:'',i)
  ).join('')+'</div></section></div>'+
  '<div class="panel battle-panel">'+(battle.result?'<div data-nav="result">'+button(battle.result==='win'?'查看戰後情況':'返回城內','return','primary')+'</div>':
  battle.auto?'<h3>總攻擊中</h3><div class="commands" data-nav="list">'+button('停止總攻擊','stop-all-out','primary')+'</div><small>空白鍵或 Esc 停止，回到手動指揮。</small>':
  '<h3>'+instruction+'</h3>'+(!targetType?'<div class="commands '+(!battle.mode?'battle-menu':'')+'" data-nav="'+(!battle.mode?'grid':'list')+'">'+commands+'</div>':'')+
  '<small>'+(targetType?'↑ ↓ 選目標':'方向鍵選指令')+' · Space 確認'+(battle.mode?' · Esc 返回':' · 休息回復自身兵力')+'</small>'+
  (battle.mode&&battle.mode!=='retreat'?' <span>'+button('返回','cancel')+'</span>':''))+'</div>';
 }else if(!supplies){
  const city=towns[state.storyReported?state.chapter-1:state.chapter]||towns[2];
  const lines=dialogue?.text;
  const message=lines?(lines[state.chapter]||lines[0]):(state.notice||'方向鍵移動，靠近人物按空白鍵對話。');
  const action=dialogue?.action;
  view.innerHTML='<div class="bar"><h2>'+city+'</h2><small>'+(state.chapter===3?'戰役完成':'往北走進「武」或「道」的店門')+'</small>'+button('隊伍 Esc','party')+'</div>'+
  '<div class="town-map-frame"><canvas class="walk-map" width="1440" height="648" role="img" aria-label="城內地圖"></canvas>'+(partyOpen?partySheet():'')+'</div>'+
  '<div class="panel"><p role="status">'+(dialogue?dialogue.label+'　':'')+message+'</p><div class="commands">'+
  (dialogue?(action&&!(action==='fight'&&state.chapter===3)?button(({fight:'出城',report:'回報戰果',invite:'邀請同行','accept-mission':'答應尋人'})[action],action,'primary'):'')+button('結束對話','close-talk'):button('對話','talk'))+'</div></div>'+
  '<div class="section dpad" aria-label="移動">'+Object.keys(directions).map((key,i)=>button(['↑','↓','←','→'][i],'town-move:'+key)).join('')+'</div>';
  drawTown();if(!dialogue)updateTalk();return;
 }else{
  const shop=shops.find(store=>store.key===supplies);
  const gear=supplies==='arms';
  view.innerHTML='<div class="bar"><h2>'+shop.name+'</h2><strong>持有 '+state.gold+' 金</strong>'+button('離開店鋪','back-town')+'</div>'+
  '<div class="panel">'+(gear?'<label>交易武將 <select data-change="shop-member">'+state.party.map((member,i)=>'<option value="'+i+'" '+(i===shopMember?'selected':'')+'>'+hero(member)[0]+'</option>').join('')+'</select></label>':'')+
  '<div class="trade-stock">'+(gear?shopGear('weapon','武器',weapons)+shopGear('armor','防具',armors):
  '<section class="card"><h3>道具</h3><div class="trade-row"><span>軍糧 × '+rationCount()+'</span>'+
  button('買 15','buy:ration','',state.gold<15)+button('賣 7','sell:ration','',rationCount()===0)+
  '</div><small>戰鬥中使用，最多回復 48 兵力。</small></section>')+'</div></div>';
 }
 draw();
 if(battle)drawFighters();
 if(battle)highlightCursor();
}
view.addEventListener('change',event=>{
 const type=event.target.dataset.change,value=Number(event.target.value);
 if(type==='formation'){state.formation=value;save();}
 else if(type==='shop-member')shopMember=value;
 else return;
 render();
});
function startBattle(){
 cursor=0;
 const party=fieldParty();
 battle={party,effects:[],busyUntil:0,rations:rationCount(),turn:0,round:1,hp:party.map(maxHp),sp:maxSP(),mode:null,skill:null,guard:false,result:null,log:['義軍整隊，戰鬥開始。'],enemies:chapters[state.chapter][2].map(([name,hp,power,armor])=>({name,hp,max:hp,power,armor}))};
 battle.meterMax=Math.max(...battle.hp,...battle.enemies.map(enemy=>enemy.max));
}
function record(message){battle.log.unshift(message);}
function strike(enemy,amount,label){
 const actual=Math.min(enemy.hp,Math.max(1,Math.round(amount)));enemy.hp-=actual;
 record(label+'，'+enemy.name+' 損失 '+actual+' 兵力'+(enemy.hp===0?'，退場。':'。'));
}
function autoAttack(currentBattle){
 if(battle!==currentBattle||!battle.auto||battle.result)return;
 battle.mode='attack';
 act(battle.enemies.findIndex(enemy=>enemy.hp>0));
 render();
 const elapsed=animateBattle();
 if(battle.result)battle.auto=false;
 else if(battle.auto)battle.autoTimer=setTimeout(()=>autoAttack(currentBattle),Math.max(260,elapsed+25));
}
function act(target){
 const member=battle.party[battle.turn],h=hero(member),label=h[0];
 if(battle.mode==='attack'){
  const e=battle.enemies[target];if(!e||e.hp<=0)return;
  const strength=(h[2]+weapons[member.weapon][1]+state.level*6)*(0.5+0.5*battle.hp[battle.turn]/maxHp(member));
  battle.effects.push({attacker:'ally:'+battle.turn,target:'enemy:'+target});
  strike(e,(strength-e.armor)*[1,1.18,.9][state.formation],label+' 攻擊');
 }else if(battle.mode==='item'||battle.mode==='rest'){
  const isItem=battle.mode==='item';
  const recipient=isItem?target:battle.turn;
  const missing=maxHp(battle.party[recipient])-battle.hp[recipient];
  if(isItem&&(!battle.rations||!battle.hp[recipient]||missing<=0))return;
  const recovery=Math.min(missing,isItem?48:Math.round(maxHp(member)*.14));
  if(isItem){battle.rations--;state.rations=battle.rations;save();}
  battle.hp[recipient]+=recovery;
  record(label+(isItem?' 使用軍糧，'+hero(battle.party[recipient])[0]:' 休息')+' 恢復 '+recovery+' 兵力。');
 }else{
  const id=battle.skill,skill=skills[id];if(!skill||battle.sp<skill[1])return;
  if(id==='raid'&&!battle.enemies[target]?.hp)return;
  if(id==='heal'&&(!battle.hp[target]||battle.hp[target]===maxHp(battle.party[target])))return;
  battle.sp-=skill[1];
  const power=h[3]+state.level*5;
  if(id==='heal'){
   const gain=Math.min(maxHp(battle.party[target])-battle.hp[target],20+power);
   battle.hp[target]+=gain;record(label+' 施展援糧，'+hero(battle.party[target])[0]+' 恢復 '+gain+' 兵力。');
  }else if(id==='guard'){battle.guard=true;record(label+' 施展固陣。');}
  else if(id==='raid'){strike(battle.enemies[target],16+power*1.15,label+' 施展奇襲');}
  else{const factor=id==='fire'&&state.chapter!==0?1.10:.80;battle.enemies.filter(e=>e.hp>0).forEach(e=>strike(e,8+power*factor,label+' 施展'+skill[0]));}
 }
 battle.mode=null;battle.skill=null;cursor=0;
 if(battle.enemies.every(e=>e.hp===0)){battle.result='win';return;}
 const next=battle.hp.findIndex((hp,i)=>hp>0&&i>battle.turn);
 if(next>=0){battle.turn=next;return;}
 for(const enemy of battle.enemies.filter(e=>e.hp>0)){
  const living=battle.hp.map((hp,i)=>hp>0?i:-1).filter(i=>i>=0);if(!living.length)break;
  const target=living[Math.floor(Math.random()*living.length)],m=battle.party[target];
  const damage=Math.min(battle.hp[target],Math.max(2,Math.round((enemy.power*(.55+.45*enemy.hp/enemy.max)-armors[m.armor][1])*[1,1.10,.80][state.formation]*(battle.guard?.55:1))));
  battle.effects.push({attacker:'enemy:'+battle.enemies.indexOf(enemy),target:'ally:'+target});
  battle.hp[target]-=damage;record(enemy.name+' 反擊，'+hero(m)[0]+' 損失 '+damage+' 兵力'+(battle.hp[target]===0?'，退場。':'。'));
 }
 battle.guard=false; battle.turn=battle.hp.findIndex(hp=>hp>0); battle.round++;
 if(battle.turn===-1)battle.result='loss';
}
view.addEventListener('click',event=>{
 const control=event.target.closest('button[data-action]');if(!control)return;
 const [action,arg,detail]=control.dataset.action.split(':'),index=Number(arg);
 if(battle&&performance.now()<battle.busyUntil&&action!=='stop-all-out')return;
 if(action==='load-game'&&state){
  titleScreen=null;
  if(state.storyStage==='returning')beginReturn();
 }else if(action==='new-game'){
  if(state&&!confirm('重新開始會清除目前的存檔。確定要繼續？'))return;
  state=null;titleScreen=null;
  try{localStorage.removeItem(key);}catch{}
 }else if(action==='start'&&!state){
  state={party:startingParty.map(recruit),chapter:0,level:1,xp:0,gold:80,advisor:0,formation:0};save();
 }else if(action==='party'){partyOpen=!partyOpen;}
 else if(action==='deploy'){
  const member=state.party[index];
  if(member.reserve||fieldParty().length>1){member.reserve=!member.reserve;save();}
 }else if(action==='order'){
  const next=index+Number(detail);
  [state.party[index],state.party[next]]=[state.party[next],state.party[index]];save();
 }else if(action==='appoint'){state.advisorId=state.party[index].id;save();}
 else if(['buy','sell','equip'].includes(action)){trade(action,arg,Number(detail));}
 else if(action==='town-move'){moveTown(arg);return;}
 else if(action==='talk'){dialogue=townConversation(nearTownsperson());}
 else if(action==='accept-mission'){
  state.villageBriefed=true;state.notice='前往東門出村，沿車痕找失蹤的村民。';dialogue=null;save();
 }else if(action==='road-next'){walk.clue=null;walk.clueIndex++;}
 else if(action==='report'){finishReport();}
 else if(action==='invite'&&dialogue?.id!==undefined){
  state.party.push(recruit(dialogue.id));
  state.notice=dialogue.label+'加入隊伍。';dialogue=null;save();
 }else if(action==='story-next'){
  storyPage++;
  if(storyPage>=missions[state.chapter].aftermath.length){
   storyPage=0;state.storyStage='returning';beginReturn();save();
  }
 }
 else if(action==='close-talk'){dialogue=null;}
 else if(action==='back-town'){supplies=false;}
 else if(action==='fight'&&chapters[state.chapter]&&state.storyStage!=='report'){
  dialogue=null;partyOpen=false;supplies=false;
  walk={trail:[{x:3,y:5},{x:2,y:5},{x:1,y:5}],steps:0,clueIndex:0,encounter:state.chapter===0?12:9+Math.floor(Math.random()*8)};
 }else if(action==='camp'){walk=null;}
 else if(action==='move'){moveWalk(arg);return;}
 else if(action==='return'){
  if(battle.result==='win'){
   state.storyStage='aftermath';storyPage=0;
  }else{state.notice='已返回城內，可重新挑戰。';}
  battle=null;save();
 }else if(action==='all-out'){
  battle.auto=true;cursor=0;
  const currentBattle=battle;
  battle.autoTimer=setTimeout(()=>autoAttack(currentBattle),260);
 }else if(action==='stop-all-out'){
  clearTimeout(battle.autoTimer);battle.auto=false;battle.busyUntil=0;cursor=0;
 }else if(action==='retreat-confirm'){
  battle.mode=null;battle.result='retreat';cursor=0;record('義軍撤離戰場。');
 }else if(['attack','tactics','item','rest','retreat','cancel'].includes(action)){
  const previous=battle.mode;
  battle.mode=action==='cancel'?(battle.skill?'tactics':null):action;
  battle.skill=null;
  cursor=action==='cancel'&&!battle.mode?Math.max(0,battleCommands.filter(action=>action!=='item'||(battle.rations&&battle.hp.some((hp,i)=>hp>0&&hp<maxHp(battle.party[i])))).indexOf(previous)):0;
  if(action==='rest')act();
 }else if(action==='skill'){
  cursor=0;battle.skill=arg;
  if(['self','all'].includes(skills[arg][3]))act();
 }else if(action==='enemy'||action==='ally'){act(index);}
 render();
 if(battle)animateBattle();
});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||(event.key!=='Escape'&&event.target.closest('select,input,textarea,[contenteditable]')))return;
 const key=event.key;
 if(titleScreen||!state){
  if(!['Enter',' ','Escape',...Object.keys(directions)].includes(key))return;
  event.preventDefault();
  if(titleScreen==='menu'&&directions[key]){
   if(state)titleCursor=1-titleCursor;
   render();return;
  }
  if((key==='Enter'||key===' ')&&!event.repeat){
   const action=titleScreen==='menu'?(titleCursor===0?'new-game':'load-game'):'start';
   view.querySelector('[data-action="'+action+'"]')?.click();
  }
  return;
 }
 if(state.storyStage==='aftermath'){
  if((key==='Enter'||key===' ')&&!event.repeat){event.preventDefault();view.querySelector('[data-action="story-next"]')?.click();}
  return;
 }
 if(state&&supplies&&key==='Escape'){event.preventDefault();supplies=false;render();return;}
 if(state&&!walk&&!battle&&!supplies){
  if(key==='Escape'&&!event.repeat){
   event.preventDefault();
   if(dialogue&&!partyOpen)dialogue=null;else partyOpen=!partyOpen;
   render();return;
  }
  if(partyOpen)return;
  if(directions[key]){event.preventDefault();moveTown(key);}
  else if(key===' '||key==='Enter'){
   event.preventDefault();
   if(!event.repeat){
    const action=dialogue?(dialogue.action&&!(dialogue.action==='fight'&&state.chapter===3)?dialogue.action:'close-talk'):'talk';
    view.querySelector('[data-action="'+action+'"]')?.click();
   }
  }
  return;
 }
 if(walk?.clue&&(key==='Enter'||key===' ')&&!event.repeat){event.preventDefault();view.querySelector('[data-action="road-next"]')?.click();return;}
 if(walk&&directions[key]){
  event.preventDefault();moveWalk(key);return;
 }
 if(!battle||!(directions[key]||[' ','Escape','Enter'].includes(key)))return;
 event.preventDefault();
 if(event.repeat&&!directions[key])return;
 if(key==='Escape'){
  view.querySelector(battle.auto?'[data-action="stop-all-out"]':'[data-action="cancel"]')?.click();return;
 }
 const options=battleButtons();
 if(!options.length)return;
 if(key===' '||key==='Enter'){
  options[cursor]?.click();highlightCursor(true);return;
 }
 const nav=view.querySelector('[data-nav]').dataset.nav;
 if(nav==='grid'){
  const grid=[...view.querySelectorAll('[data-nav="grid"] button')];
  const index=grid.indexOf(options[cursor]);
  const vertical=key==='ArrowUp'||key==='ArrowDown';
  const step=key==='ArrowUp'?-2:2;
  let next=(index+(vertical?step:index%2===0?1:-1)+grid.length)%grid.length;
  if(vertical&&grid[next].disabled)next=(next+step+grid.length)%grid.length;
  if(!grid[next].disabled)cursor=options.indexOf(grid[next]);
 }else if(nav!=='targets'||key==='ArrowUp'||key==='ArrowDown'){
  const step=key==='ArrowUp'||key==='ArrowLeft'?-1:1;
  cursor=(cursor+step+options.length)%options.length;
 }
 highlightCursor(true);
});
reset.addEventListener('click',()=>{
 walk=null;supplies=false;partyOpen=false;dialogue=null;
 town={trail:[{x:4,y:5},{x:3,y:5},{x:2,y:5}],steps:0};
 titleScreen='menu';titleCursor=1;render();
});
titleCursor=state?1:0;
render();
</script></body></html>
