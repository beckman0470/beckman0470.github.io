<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BABYMONSTER 歌詞分段小教室｜雞爸爸生活研究室</title><style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#375442;background:#faf7ef}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #d78b54;outline-offset:3px}a{color:#396b51}.wrap{max-width:1120px;margin:auto;padding:16px 15px 66px}.hero{background:linear-gradient(115deg,#e4efde,#fff5de,#f6e2e7);border-radius:22px;padding:19px 23px;border:1px solid #dde1d2}.hero h1{font-size:clamp(25px,4vw,38px);margin:10px 0 5px}.hero p{margin:0;line-height:1.65}.back{display:inline-flex;padding:9px 16px;border-radius:30px;background:#fff;border:1px solid #afc8ae;text-decoration:none;font-weight:800}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.tabs button,.actions button{border:1px solid #adc6b2;border-radius:13px;background:#fffdf8;padding:11px 13px;font-weight:800;color:#355a46}.tabs button[aria-pressed=true],.actions .primary{background:#426b54;color:white}.layout{display:grid;grid-template-columns:minmax(240px,310px) minmax(0,1fr);gap:18px}.clips{display:grid;gap:9px;max-height:750px;overflow:auto}.clip{display:flex;align-items:center;text-align:left;gap:10px;border:2px solid #e0e4da;border-radius:15px;padding:8px;background:#fffdfa;color:#355a46;cursor:pointer}.clip[aria-pressed=true]{border-color:#7caa8c;background:#edf4ea}.clip img{width:53px;height:66px;object-fit:contain}.clip small{display:block;font-size:12px;opacity:.8;margin-top:4px}.stage{background:white;border:1px solid #e1e1d4;border-radius:22px;padding:14px;box-shadow:0 8px 21px #2c46320e}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px;flex-wrap:wrap}.classroom{background:radial-gradient(ellipse at 22% 45%,#f7d8e1,#f5eddc 55%,#e4f0e5);border-radius:20px;padding:18px 12px;display:grid;grid-template-columns:34% 1fr;gap:8px;min-height:285px}.teacher{display:flex;flex-direction:column;justify-content:end;align-items:center;text-align:center}.teacher img{width:100%;max-width:205px;max-height:240px;object-fit:contain;animation:sway 1.8s ease-in-out infinite alternate}.teacher strong{color:#6c4760}.board{background:#315746;color:#fffaee;border:9px solid #bd8c59;border-radius:17px;min-height:255px;padding:20px 13px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;text-align:center}.board .kicker{font-size:12px;color:#c7e4d2}.board .zh{font-size:clamp(20px,3vw,29px);line-height:1.5;font-weight:850}.board .lyrics{font-size:clamp(16px,2vw,22px);color:#ffdeac;line-height:1.45}.board .counter{font-size:12px;color:#d4e5d5}.player{margin-top:13px;background:#e7efe8;border-radius:13px;overflow:hidden;aspect-ratio:16/9}.player iframe{width:100%;height:100%;border:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{flex:1 1 auto}.status{min-height:35px;line-height:1.5;font-size:14px}.notice{color:#64766a;font-size:13px;line-height:1.6}.editor{border-top:1px solid #e4e3d7;margin-top:13px;padding-top:12px}.editor summary{cursor:pointer;font-weight:750}.editor textarea{width:100%;min-height:78px;padding:10px;border:1px solid #aec6ae;border-radius:10px;resize:vertical}.editor p{font-size:12px}.editor button{border:1px solid #aac1ae;border-radius:10px;padding:9px 12px;background:#eaf2e8}.time{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}.time input{width:75px;padding:7px;border:1px solid #aac1ae;border-radius:8px}.time label{font-size:12px}.hidden{display:none!important}@keyframes sway{to{transform:translateY(-6px) rotate(1deg)}}@media(max-width:750px){.layout{grid-template-columns:1fr}.clips{display:flex;overflow-x:auto;max-height:none}.clip{flex:0 0 195px}.classroom{min-height:235px;padding:10px 5px}.board{min-height:210px;padding:9px 5px;border-width:6px}.teacher img{max-height:170px}.board .zh{font-size:19px}}@media(prefers-reduced-motion:reduce){.teacher img{animation:none}}</style></head><body><main class="wrap"><header class="hero"><a class="back" href="/rooms.html?room=games">← 回到遊戲間</a><h1>BABYMONSTER 歌詞分段小教室</h1><p>誰唱的這一段，就由誰的 Q 版小老師教。聽原唱、看真正的歌詞句意，再聽活潑的中文解說。</p></header><nav id="tabs" class="tabs" aria-label="歌曲"></nav><div class="layout"><aside><h2 id="songLabel">DRIP</h2><div id="clips" class="clips"></div></aside><section class="stage"><div class="stage-head"><strong id="head">選一段歌曲</strong><a class="back" href="/rooms.html?room=games">← 回到遊戲間</a></div><div class="classroom"><div class="teacher"><img id="teacher" alt="Q 版小老師"><strong id="person"></strong></div><div class="board"><div class="kicker" id="topic"></div><div id="lyric" class="lyrics"></div><div id="meaning" class="zh"></div><div class="counter" id="count"></div></div></div><div class="player" id="playerWrap"><div id="yt"></div></div><div class="actions"><button class="primary" id="play">▶ 聽這段原唱</button><button id="teach">▶ 卡通小老師解說</button><button id="before">上一句</button><button id="after">下一句</button><button id="repeat">↻ 再聽原唱</button><button id="halt">■ 停止</button><a class="back" id="mv" target="_blank" rel="noopener">官方 MV</a></div><p class="status" id="status" role="status" aria-live="polite"></p><p class="notice">原曲由 YouTube 播放；前一版留下的時間點尚未逐秒驗證，未校準的片段不會假裝已對準。歌詞原文可由家長於下方加入有權使用的文字，網站不會自動轉載完整歌詞。</p><details class="editor"><summary>家長設定｜加入合法使用的原歌詞／調整試聽秒數</summary><p>依畫面句數，每行輸入一句。只儲存在這台裝置。預設只顯示與真實歌詞對應的繁體中文句意。</p><textarea id="editLyrics" placeholder="每行一句原歌詞（請確認具有使用權）"></textarea><div class="time"><label>開始秒數 <input id="startTime" type="number" min="0" max="999" step="0.5"></label><label>結束秒數 <input id="endTime" type="number" min="0" max="999" step="0.5"></label></div><div class="actions"><button id="save">儲存這段設定</button><button id="clear">清除自訂歌詞</button></div></details></section></div></main><script>const TRACKS={"DRIP":{"id":"Zp-Jhuhq0bQ","parts":[{"member":"chiquita","start":8,"end":16,"topic":"穿搭與目標","lines":["我穿搭時不會想太多。","我有機會成為最頂尖的，不需要太多東西。","我要訂下目標，努力達成它。","用冰涼的意象表現自己的酷勁。"]},{"member":"ahyeon","start":16,"end":24,"topic":"一起玩、帶動全場","lines":["邀請大家一起玩，氣氛像觸電般刺激。","我們將一起主宰這座城市。","因為我有大家喜歡的特質，所以有人來找我。","機會不多，最好跟上舞步。"]},{"member":"ruka","start":24,"end":32,"topic":"我會在，不要猶豫","lines":["我會在你身邊，別煩惱。","我會在這裡，別猶豫。"]},{"member":"asa","start":32,"end":36,"topic":"你還不了解我","lines":["但你還不了解我。","你很快就會認識真正的我。"]},{"member":"rora","start":36,"end":40,"topic":"閃亮星空","lines":["這是美麗星星閃耀的夜晚。"]},{"member":"pharita","start":40,"end":48,"topic":"我自己的價值","lines":["你說什麼呢？","我的價值沒有盡頭，我自己最清楚。"]},{"member":"rami","start":48,"end":55,"topic":"準備打開燈光","lines":["你說什麼呢？","準備好了嗎？開始，打開燈光！"]},{"member":"ahyeon","start":55,"end":63,"topic":"熱情與抱負","lines":["我擁有熱情和抱負，會證明給你看。"]},{"member":"asa","start":113,"end":122,"topic":"怪獸登場","lines":["怪獸登場，準備征服全場。","我們是最棒的，其他人也不得不承認。"]},{"member":"ruka","start":122,"end":131,"topic":"繼續向前","lines":["沒有模仿，展現自己獨特的實力。","抓緊、不要鬆手，我們會一路向前。"]},{"member":"rami","start":217,"end":227,"topic":"像鑽石一樣發光","lines":["即使偶爾跌倒，我仍會像鑽石一樣閃亮。"]},{"member":"ahyeon","start":227,"end":234,"topic":"再次站起來","lines":["重新站起來，現在看我再做一次。"]}]},"SHEESH":{"id":"2wA_b6YHjqQ","parts":[{"member":"rora","start":null,"end":null,"topic":"開場旋律","lines":["以重複的吟唱音節帶出神祕的開場氛圍。"]},{"member":"pharita","start":null,"end":null,"topic":"我是怪獸","lines":["自信地宣告自己是 BABYMONSTER 的一員。"]},{"member":"chiquita","start":null,"end":null,"topic":"面對面交鋒","lines":["面對面較量，我看見你的動作像慢動作。","你知道自己已經遇上麻煩了。"]},{"member":"rora","start":null,"end":null,"topic":"逃不出掌心","lines":["就算努力掙扎，也逃不出我的掌握。"]},{"member":"rami","start":null,"end":null,"topic":"所有目光聚焦","lines":["睜開眼睛的瞬間綻放光芒。","所有人的目光都集中在我身上，點燃氣氛。"]},{"member":"asa","start":null,"end":null,"topic":"自信登場","lines":["你知道這是什麼，我正掌握全場。","節奏像引擎聲一樣強烈，令人心跳加速。"]},{"member":"ruka","start":null,"end":null,"topic":"音樂強勢登場","lines":["提醒大家注意，音樂就要衝進耳朵裡。","現場的氣氛越來越熱烈。"]},{"member":"ahyeon","start":null,"end":null,"topic":"跟著音樂跳舞","lines":["這段音樂就像送給耳朵的禮物。","跟著音樂一起跳舞。"]}]},"FOREVER":{"id":"eJCHKjt0MPw","parts":[{"member":"asa","start":10,"end":17,"topic":"不為煩惱停下","lines":["我心裡沒有煩惱，也不會停下腳步。","所以你可以說再見。"]},{"member":"chiquita","start":17,"end":24,"topic":"實現我的夢想","lines":["我要實現自己的幻想。","你可以在旁邊看著，並為我鼓掌。"]},{"member":"rora","start":24,"end":30,"topic":"耀眼的自己","lines":["光芒閃耀，大家都說她完美無瑕。"]},{"member":"ahyeon","start":32,"end":40,"topic":"與眾不同","lines":["她和其他人都不一樣。","無論走到哪裡都引起大家注意。"]},{"member":"rami","start":null,"end":null,"topic":"別誤會這只是一場夢","lines":["這一切曾像一場夢。","別擅自以為我屬於你。"]},{"member":"pharita","start":null,"end":null,"topic":"停不下來的感受","lines":["今晚這樣的感受無法停下。"]}]},"BATTER UP":{"id":"olDWm2veCrM","parts":[{"member":"rami","start":18,"end":26,"topic":"我有自己的任務","lines":["我有一個使命，不需要別人允許。","無論如何，我會自己做決定。"]},{"member":"rora","start":26,"end":33,"topic":"看看我的改變","lines":["你也想知道我會變成什麼樣子。","原本漂亮又溫柔的我，會展現出怪獸般的另一面。"]},{"member":"pharita","start":33,"end":40,"topic":"記住我的力量","lines":["記住我，我就像蜜蜂一樣會反擊。","我的個性就像飢餓的獅子一樣強烈。"]},{"member":"ruka","start":null,"end":null,"topic":"勇往直前的饒舌","lines":["我要向前衝，不會停下來。","音樂響起，我將帶領大家感受熱烈舞台。"]},{"member":"asa","start":null,"end":null,"topic":"不會被阻擋","lines":["誰也擋不住我，我會更用力往前。","我不裝作天真，舞台上的能量越來越強。"]}]}};</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const names={chiquita:'CHIQUITA',ahyeon:'AHYEON',ruka:'RUKA',asa:'ASA',rora:'RORA',pharita:'PHARITA',rami:'RAMI'};let song='DRIP',segment=0,line=0,player,ready=false,voiceToken=0,stopTimeout=null;const key=()=>`bm10_${song}_${segment}`;const selected=()=>TRACKS[song].parts[segment];function overrides(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch{return {}}}function currentTiming(){let o=overrides(),p=selected();return {start:o.start??p.start,end:o.end??p.end}}function actualLyrics(){return (overrides().lyrics||'').split('\n').map(x=>x.trim())}function message(s){$('status').textContent=s}function stop(){voiceToken++;speechSynthesis?.cancel();clearTimeout(stopTimeout);try{player?.pauseVideo()}catch{}}function paintLine(){const p=selected(),ls=actualLyrics(),original=ls[line]||'';$('lyric').textContent=original;$('lyric').classList.toggle('hidden',!original);$('meaning').textContent=p.lines[line];$('count').textContent=`第 ${line+1} / ${p.lines.length} 句`;$('before').disabled=line===0;$('after').disabled=line===p.lines.length-1}function paint(){stop();line=0;let p=selected(),t=currentTiming();$('head').textContent=`${song}｜${p.topic}`;$('person').textContent=names[p.member];$('teacher').src=`/assets/babymonster/${p.member}.gif`;$('teacher').alt=names[p.member]+' Q 版小老師';$('topic').textContent=p.topic;$('mv').href='https://www.youtube.com/watch?v='+TRACKS[song].id;$('editLyrics').value=overrides().lyrics||'';$('startTime').value=t.start??'';$('endTime').value=t.end??'';paintLine();let enabled=t.start!==null&&t.end!==null&&t.end>t.start;$('play').disabled=$('repeat').disabled=!enabled;message(enabled?'按「聽這段原唱」，接著聽 Q 版小老師說明歌詞。':'這段尚未核對 MV 時間，先可聽中文解說或開啟官方 MV。');document.querySelectorAll('.clip').forEach((e,i)=>e.setAttribute('aria-pressed',String(i===segment)))}function build(){let tabs=$('tabs');tabs.replaceChildren();Object.keys(TRACKS).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.setAttribute('aria-pressed',String(k===song));b.onclick=()=>{song=k;segment=0;if(ready)player.cueVideoById(TRACKS[k].id);build()};tabs.append(b)});$('songLabel').textContent=song+'｜成員演唱段落';let list=$('clips');list.replaceChildren();TRACKS[song].parts.forEach((p,i)=>{let b=document.createElement('button');b.className='clip';b.setAttribute('aria-pressed',String(i===segment));let img=document.createElement('img');img.src='/assets/babymonster/'+p.member+'.gif';img.alt='';img.loading='lazy';let desc=document.createElement('span');let strong=document.createElement('strong');strong.textContent=`${String(i+1).padStart(2,'0')}｜${names[p.member]}`;let small=document.createElement('small');small.textContent=p.topic;desc.append(strong,small);b.append(img,desc);b.onclick=()=>{segment=i;paint()};list.append(b)});paint()}
function music(){stop();let t=currentTiming();if(t.start===null||t.end===null||t.end<=t.start){message('這段沒有經過時間設定，暫不播放可能錯誤的片段。');return}if(!ready){message('播放器正在載入，請稍後再按播放。');return}try{player.loadVideoById({videoId:TRACKS[song].id,startSeconds:t.start,endSeconds:t.end});message('正在播放歌曲原唱。若片段不準，請家長在下方校正秒數。');stopTimeout=setTimeout(()=>{try{player.pauseVideo()}catch{}},(t.end-t.start+1)*1000)}catch(e){message('YouTube 播放失敗，請使用官方 MV 連結。')}}
/* Each member has an individual voice profile. Actual timbre depends on installed system voices. */
const cartoonVoices={
 chiquita:{pitch:1.68,rate:1.09,choice:0},
 ahyeon:{pitch:1.38,rate:1.06,choice:1},
 ruka:{pitch:1.19,rate:1.12,choice:2},
 asa:{pitch:1.51,rate:1.15,choice:3},
 rora:{pitch:1.60,rate:.94,choice:4},
 pharita:{pitch:1.44,rate:.93,choice:5},
 rami:{pitch:1.31,rate:1.01,choice:6}
};
function chooseVoice(locale,member){
 const pool=window.speechSynthesis.getVoices();const exact=pool.filter(v=>v.lang.toLowerCase()===locale.toLowerCase());
 const same=pool.filter(v=>v.lang.toLowerCase().startsWith(locale.slice(0,2).toLowerCase()));
 const candidates=exact.length?exact:same;
 if(!candidates.length)return null;
 // Prefer distinct installed voices where they actually exist. Never claim pitch alone changes the actor.
 const preferred=candidates.filter(v=>/female|woman|girl|xiaoxiao|hsiao|hanhan|yating|huihui|yunxi|meijia|yaoyao|tingting|natural/i.test(v.name));
 const available=preferred.length?preferred:candidates;
 return available[cartoonVoices[member]?.choice%available.length||0];
}
function speak(){
 stop();
 if(!('speechSynthesis'in window)){message('這台裝置沒有語音播放功能。');return;}
 const token=voiceToken,p=selected(),org=actualLyrics()[line],member=p.member,profile=cartoonVoices[member]||cartoonVoices.rora;
 const q=[];
 if(org){const lang=/[가-힣]/.test(org)?'ko-KR':'en-US';q.push({text:org,lang,rate:.83,pitch:1.0});}
 // No invented intro, giggle, or filler. Speak only the actual line explanation.
 q.push({text:p.lines[line],lang:'zh-TW',rate:profile.rate,pitch:profile.pitch});
 let n=0;const synth=window.speechSynthesis;
 function next(){
  if(token!==voiceToken)return;
  if(n>=q.length){message('這一句播放完畢。');return;}
  const x=q[n++],u=new SpeechSynthesisUtterance(x.text);u.lang=x.lang;u.rate=x.rate;u.pitch=x.pitch;u.volume=1;
  u.voice=chooseVoice(x.lang,member);
  const available=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('zh'));
  u.onstart=()=>{if(token===voiceToken)message(x.lang==='zh-TW'?`${names[member]} 正在講解這一句。${available.length<2?'（目前裝置的中文語音種類有限）':''}`:'正在播放原句發音。')};
  u.onend=()=>{if(token===voiceToken)next()};
  u.onerror=e=>{if(token===voiceToken)message('語音播放失敗：'+e.error+'。請檢查裝置的語音設定。')};
  synth.speak(u);
 }
 // Give asynchronous OS voices a moment to populate on first click; don't delay repeated clicks.
 if(!synth.getVoices().length){message('正在載入裝置語音…');setTimeout(()=>{if(token===voiceToken)next()},220)}
 else next();
}
$('play').onclick=music;$('repeat').onclick=music;$('teach').onclick=speak;$('halt').onclick=()=>{stop();message('已停止播放。')};$('before').onclick=()=>{stop();line=Math.max(0,line-1);paintLine()};$('after').onclick=()=>{stop();line=Math.min(selected().lines.length-1,line+1);paintLine()};$('save').onclick=()=>{const a=Number($('startTime').value),b=Number($('endTime').value);let x={lyrics:$('editLyrics').value, start:$('startTime').value===''?null:a,end:$('endTime').value===''?null:b};if(x.lyrics.split('\n').filter(y=>y.trim()).length>selected().lines.length){message('原歌詞行數超過這段可教的句數，請確認後再儲存。');return}localStorage.setItem(key(),JSON.stringify(x));paint();message('已儲存這段設定（只在這台裝置）。')};$('clear').onclick=()=>{let x=overrides();x.lyrics='';localStorage.setItem(key(),JSON.stringify(x));paint();message('已清除自訂歌詞。')};
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:TRACKS[song].id,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;message('音樂播放器已準備好。')}}})};let js=document.createElement('script');js.src='https://www.youtube.com/iframe_api';document.head.append(js);build();})();
</script></body></html>
