<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BABYMONSTER 小教室｜雞爸爸生活研究室</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#354b39;background:#faf7ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#f9f6eb,#f2eddd 55%,#f4e9e7);min-height:100vh}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:920px;margin:auto;padding:20px 16px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.home{width:60px;height:60px;display:grid;place-items:center;background:#e5ecde;border:2px solid #a4b9a3;border-radius:20px;text-decoration:none;font-size:34px;color:#2b5940}.tiny{font-weight:800;color:#4e6a52;font-size:15px}.card{background:#fffdf6;border:2px solid #d4decf;box-shadow:0 16px 40px #576c5c19;border-radius:28px;overflow:hidden}.banner{text-align:center;background:linear-gradient(90deg,#e7eee1,#f9eff0,#f7efdc);padding:14px}.banner h1{margin:0;color:#47674f;font-size:clamp(23px,4vw,32px)}.banner p{font-size:13px;margin:5px 0 0;color:#567061}.scene{display:grid;grid-template-columns:27% 73%;background:#f9f0e5;min-height:250px;padding:12px;align-items:stretch;gap:4px}.teacher{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-width:0}.teacher img{width:100%;max-width:190px;height:205px;object-fit:contain;animation:bob 2.2s ease-in-out infinite}.teacher span{font-size:11px;font-weight:900;letter-spacing:.06em;color:#55705a}.board{background:#376347;border:11px solid #a97947;box-shadow:inset 0 0 0 2px #e2bd84;border-radius:12px;min-width:0;padding:17px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;color:white;text-align:center}.board .song{font-size:clamp(27px,5.5vw,50px);font-weight:950;color:#fff1b3;letter-spacing:.06em}.board .line{font-size:clamp(16px,3vw,25px);line-height:1.55;font-weight:850;min-height:36px}.board .desc{font-size:clamp(15px,2.5vw,19px);color:#e1efdb;min-height:23px}.words{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.words span{display:inline-block;padding:5px 7px;border-radius:8px;background:#ffffff15;color:white;font-weight:800;transition:.2s;font-size:clamp(15px,2.6vw,23px)}.words span.active{background:#ffe17c;color:#35513d;transform:scale(1.12)}.video{position:relative;aspect-ratio:16/9;background:#24352a}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.transport{display:flex;justify-content:center;align-items:center;gap:26px;padding:20px 8px}.transport button{border:0;background:#dfe9df;color:#355d40;border-radius:50%;width:72px;height:72px;font-size:34px;display:grid;place-items:center;box-shadow:0 5px 0 #bbcebd}.transport .big{background:#426b51;color:white;width:94px;height:94px;font-size:40px;box-shadow:0 6px 0 #30513a}.transport button:active{transform:translateY(3px);box-shadow:none}.dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px}.dots i{height:10px;width:10px;background:#b7c9b5;border-radius:50%}.dots i.on{width:28px;border-radius:12px;background:#4d7755}.status{font-size:13px;color:#677a69;text-align:center;padding:0 20px 15px;min-height:32px}.smallprint{font-size:12px;line-height:1.6;color:#63756a;text-align:center;padding:8px 18px 14px}.smallprint a{color:#426b51}.speaker{font-size:12px;color:#f2e7a9}.hidden{display:none!important}button:focus-visible,a:focus-visible{outline:4px solid #e9a856;outline-offset:4px}@keyframes bob{50%{transform:translateY(-5px)}}@media(max-width:560px){.wrap{padding:8px 6px 28px}.scene{grid-template-columns:25% 75%;padding:5px}.teacher img{height:140px}.board{border-width:7px;padding:10px 4px}.transport{gap:17px}.transport button{width:62px;height:62px}.transport .big{width:86px;height:86px}.home{width:48px;height:48px;font-size:26px}}@media(prefers-reduced-motion:reduce){.teacher img{animation:none}}
</style></head><body><main class="wrap"><header class="top"><a class="home" href="/rooms.html?room=games" aria-label="回到遊戲間" title="回到遊戲間">⌂</a><span class="tiny">雞爸爸生活研究室 · 遊戲間</span></header><section class="card"><header class="banner"><h1>BABYMONSTER 小教室</h1><p>按大大的 ▶ 就可以開始聽歌囉</p></header><div class="scene"><div class="teacher"><img id="teacher" src="/assets/babymonster/chiquita.gif" alt="Q版小老師"><span id="member">CHIQUITA</span></div><div class="board"><div class="song" id="song">DRIP</div><div class="line" id="lyric"></div><div class="words" id="words"></div><div class="desc" id="description"></div></div></div><div class="video" id="video"><div id="yt"></div></div><div class="transport"><button id="previous" type="button" title="上一首" aria-label="上一首">⏮</button><button id="play" class="big" type="button" title="播放或暫停" aria-label="播放或暫停">▶</button><button id="next" type="button" title="下一首" aria-label="下一首">⏭</button></div><div class="dots" id="dots" aria-hidden="true"></div><p class="status" id="status" aria-live="polite">按 ▶ 播放歌曲</p><p class="smallprint">音樂由 BABYMONSTER 官方 YouTube 影片播放。<a id="official" target="_blank" rel="noopener">開啟官方 MV</a></p></section></main>
<script>
(()=>{'use strict';
const S=[{name:'DRIP',id:'Zp-Jhuhq0bQ',member:'chiquita'},{name:'SHEESH',id:'2wA_b6YHjqQ',member:'rora'},{name:'FOREVER',id:'eJCHKjt0MPw',member:'asa'},{name:'BATTER UP',id:'olDWm2veCrM',member:'rami'}];
// Only one short exact lyric quotation is displayed; other songs rely on the official video's own captions.
// This teaching cue was cross-checked against the official DRIP MV description.
const drip={start:8,end:16,text:'When I dress I don’t think so much',meaning:'我穿衣服的時候，不會想太多。',words:[['When','當……時'],['I','我'],['dress','穿衣服'],['don’t','不'],['think','想'],['so','那麼'],['much','多']]};
const $=id=>document.getElementById(id);let songIdx=0,player=null,ready=false,playing=false,phase=0,watcher=null,token=0,teachTimer=null;
const caps=()=>{let f=document.querySelector('#yt iframe');if(f){f.setAttribute('title','BABYMONSTER 官方音樂影片');f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');}};
function cancel(){token++;clearInterval(watcher);watcher=null;clearTimeout(teachTimer);teachTimer=null;phase=0;$('words').replaceChildren();$('lyric').textContent='';$('description').textContent='';}
function draw(){const s=S[songIdx];$('song').textContent=s.name;$('member').textContent=s.member.toUpperCase();$('teacher').src='/assets/babymonster/'+s.member+'.gif';$('teacher').alt=s.member+' Q 版小老師';$('official').href='https://www.youtube.com/watch?v='+s.id;$('dots').replaceChildren();S.forEach((_,i)=>{let d=document.createElement('i');if(i===songIdx)d.className='on';$('dots').append(d)});$('play').textContent=playing?'Ⅱ':'▶';}
function change(d){cancel();songIdx=(songIdx+d+S.length)%S.length;playing=false;draw();if(ready){player.loadVideoById({videoId:S[songIdx].id,startSeconds:0});playing=true;$('play').textContent='Ⅱ';beginMonitor();$('status').textContent='正在播放 '+S[songIdx].name;}else $('status').textContent='按 ▶ 播放歌曲';}
function start(){if(!ready){$('status').textContent='音樂正在載入，請再按 ▶';return}if(playing){try{player.pauseVideo()}catch{}playing=false;$('play').textContent='▶';$('status').textContent='已暫停';return}try{if(player.getPlayerState()===2)player.playVideo();else player.loadVideoById({videoId:S[songIdx].id,startSeconds:0});playing=true;draw();beginMonitor();$('status').textContent='正在播放 '+S[songIdx].name;}catch{$('status').textContent='請開啟官方 MV 播放'}}
function wordShow(index){const root=$('words');root.replaceChildren();drip.words.forEach((w,i)=>{let v=document.createElement('span');v.textContent=w[0];if(i===index)v.className='active';root.append(v)});$('description').textContent=index<0?drip.meaning:drip.words[index][0]+'：'+drip.words[index][1];}
// The player stays on the official MV. Visual prompts are introductory and approximate, never claimed frame-perfect sync.
function beginMonitor(){clearInterval(watcher);watcher=setInterval(()=>{if(!player||!playing||songIdx!==0)return;let t;try{t=player.getCurrentTime()}catch{return}if(!Number.isFinite(t))return;if(t>=drip.start&&t<drip.end){if(phase!==1){phase=1;$('lyric').textContent=drip.text;wordShow(-1);$('status').textContent='聽聽小七這一句';}const i=Math.min(drip.words.length-1,Math.floor((t-drip.start)/(drip.end-drip.start)*drip.words.length));wordShow(i);}else if(t>=drip.end&&phase===1){phase=2;$('words').replaceChildren();$('lyric').textContent='';$('description').textContent='';}},350);}
$('play').onclick=start;$('previous').onclick=()=>change(-1);$('next').onclick=()=>change(1);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:S[0].id,playerVars:{playsinline:1,rel:0,cc_load_policy:1,hl:'zh-TW',origin:location.origin},events:{onReady:()=>{ready=true;caps();$('status').textContent='按 ▶ 播放歌曲';},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){playing=false;cancel();draw();$('status').textContent='這首歌播完囉，按 ▶ 再聽一次';}else if(e.data===YT.PlayerState.PAUSED&&playing){playing=false;draw();}else if(e.data===YT.PlayerState.PLAYING&&!playing){playing=true;draw();beginMonitor();}}}})};
draw();let js=document.createElement('script');js.src='https://www.youtube.com/iframe_api';document.head.append(js);
})();</script></body></html>
