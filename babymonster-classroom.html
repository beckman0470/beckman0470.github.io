ax-height:245px;object-fit:contain;animation:bob 1.1s ease-in-out infinite alternate}.teacher strong{background:#fffaf2;border-radius:14px;padding:4px 12px}.board{border:9px solid #bc9068;background:#315d4d;border-radius:10px;color:#fff;min-width:0;align-self:center;padding:23px 15px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}.board .label{color:#dbead8;font-size:13px}.board .meaning{font-size:clamp(18px,3.1vw,27px);font-weight:850;line-height:1.5}.board .lesson{font-size:14px;color:#ffe4ac;line-height:1.6}.board .foreign-line{font-size:clamp(17px,2.5vw,26px);font-weight:850;line-height:1.5;color:#fff4dc}.board .foreign-hint{font-size:12px;color:#cde8da}.board .sentence-count{font-size:12px;color:#d7e5d8}.board{gap:8px}.board .meaning{font-size:clamp(17px,2.4vw,23px)}.video{aspect-ratio:16/9;margin-top:12px;position:relative;background:#eaf0e9;border-radius:13px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.controls button,.controls a{border-radius:12px;padding:11px 14px;border:1px solid #aac4ad;background:#ecf2e9;color:#335a40;font-weight:850;text-decoration:none}.controls .primary{background:#426b54;color:white}.status{min-height:38px;margin-top:10px;font-size:14px;line-height:1.6}.notice{font-size:13px;line-height:1.8;color:#647063}.hidden{display:none!important}@keyframes bob{to{transform:translateY(-7px)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.cards{display:flex;overflow-x:auto;max-height:none}.clip{flex:0 0 195px}.clip img{width:50px}.classroom{min-height:240px}.teacher img{max-height:175px}.board{min-height:185px;padding:12px 8px;border-width:6px}.controls button{flex:1 1 130px}}

</style></head><body><main class="wrap"><header class="hero"><a class="back" href="/rooms.html?room=games">← 回到遊戲間</a><h1>BABYMONSTER 成員分段小教室</h1><p>一段原唱、一句一句慢慢學。跟著 Q 版小老師開心聽、輕鬆學！</p></header><nav class="tabs" id="tabs" aria-label="選歌曲"></nav><div class="layout"><section><h2 id="songtitle">DRIP</h2><div class="cards" id="cards"></div></section><section class="stage"><div class="stage-head"><strong id="title">選擇一段</strong><a class="back" href="/rooms.html?room=games">← 回到遊戲間</a></div><div class="classroom"><div class="teacher"><img id="teacher" alt="Q 版小老師"><strong id="name"></strong></div><div class="board"><div class="label" id="part"></div><div class="foreign-line" id="foreign"></div><div class="foreign-hint" id="foreignhint"></div><div class="meaning" id="meaning"></div><div class="lesson" id="note"></div><div class="sentence-count" id="sentencecount"></div></div></div><div class="video"><div id="yt"></div></div><div class="controls"><button class="primary" id="music">▶ 聽這一段原歌</button><button id="voice">▶ 小老師慢慢教這一句</button><button id="prevline">上一句</button><button id="nextline">下一句</button><button id="replay">↻ 重聽原歌</button><button id="stop">■ 停止</button><button id="next">下一段 →</button><a id="official" target="_blank" rel="noopener">開啟官方 MV</a></div><p class="status" id="status" role="status" aria-live="polite"></p><p class="notice" id="notice"></p></section></div></main><script>(()=>{'use strict';
const tracks={"DRIP":{"id":"Zp-Jhuhq0bQ","quality":"參考歌詞時間軸，MV 秒數仍須微調","parts":[["chiquita",8,15,"第一段主歌｜展現自信","這一段唱的是自信、設定目標、勇敢展現自己。","英文的第一人稱敘述，語氣強烈而自信。"],["ahyeon",16,24,"第二段主歌｜和夥伴一起前進","唱出玩在一起、帶領大家向前的感覺。","韓英交錯，帶出整段活潑的氣氛。"],["ruka",24,32,"第一段銜接｜別擔心、別猶豫","歌曲提醒聽的人不要擔心，也別遲疑。","韓語的否定祈使表達，搭配英文安慰語氣。"],["asa",32,36,"第一段銜接｜認識真正的我","歌詞表現出：你還不真正了解我。","英語口語中的否定句與第二人稱。"],["rora",36,40,"夜晚的星星｜閃亮的畫面","描寫美麗星星照耀的夜晚。","這一段是韓文描述景色的完整句意。"],["pharita",40,47,"前副歌｜展現自己的價值","帶出自己的價值與態度。","注意歌詞中的英文提問語氣。"],["rami",48,55,"前副歌｜準備好了嗎","邀請聽眾準備好，燈光亮起。","英文問句到指令句的轉換。"],["ahyeon",56,60,"副歌前｜熱情與抱負","用英韓混合歌詞表達積極和企圖心。","英語抽象名詞與韓語句子連接。"],["asa",113,122,"第二段饒舌｜怪獸登場","氣勢十足地宣告登場、改變局面。","英文饒舌搭配韓文，適合練聽節奏。"],["ruka",122,130,"第二段饒舌｜勇敢向前","表達獨一無二、不退縮、繼續向前。","英韓快速交錯，先聽整段節奏。"],["rami",217,227,"橋段｜像鑽石一樣發光","即使遇到挫折，也希望再次發光。","英文比喻與韓語讓步表達。"],["ahyeon",227,234,"橋段｜重新站起來","跌倒後再次起身，再做一次。","練習表達重新開始的完整句意。"]]},"FOREVER":{"id":"eJCHKjt0MPw","quality":"參考歌詞時間軸，MV 秒數仍須微調","parts":[["asa",10,16,"第一段｜沒有煩惱也不停下","唱的是不被擔憂綁住，持續往前走。","英文句子搭配韓文否定表達。"],["chiquita",17,24,"下一段｜實現夢想","希望實現自己的想像與願望。","完整英語句子描述未來計畫。"],["rora",24,30,"下一段｜閃亮自信","形容耀眼的自己，展現自信。","韓語形容詞與英語描述的結合。"],["ahyeon",32,39,"下一段｜與眾不同","唱出不受限制、與別人不同的態度。","比較語意與日常描述。"]]},"BATTER UP":{"id":"olDWm2veCrM","quality":"參考非官方時間軸，可能與 MV 不同","parts":[["rami",18,26,"第一段｜有自己的目標","這段主歌強調不需要別人的允許，也會自己作決定。","英文完整句子的主詞、動詞和否定語氣。"],["rora",26,33,"下一段｜展現另一面","從溫柔的形象變成充滿力量的舞台主角。","韓英文交錯描述人物的變化。"],["pharita",33,40,"下一段｜記住我","用動物比喻表達有力量的個性。","英語比喻與韓語的形容方式。"]]},"SHEESH":{"id":"2wA_b6YHjqQ","quality":"演唱者已參考分配資料，MV 時間未校準","parts":[["rora",null,null,"開場｜帶出舞台氣氛","聽開頭的節奏與人聲，準備進入歌曲。","先認識這段的語氣。"],["pharita",null,null,"開場｜自我介紹","成員以自信方式介紹 BABYMONSTER。","感受英文的自我介紹句型。"],["chiquita",null,null,"主歌｜展現自信","帶著自信迎接眼前的挑戰。","整句聽懂語意，而不是只背單字。"],["rami",null,null,"主歌｜吸引注意","透過英韓混合句子展現舞台魅力。","先聽韓語，再對照中文。"],["asa",null,null,"饒舌段｜節奏挑戰","快速的英文饒舌，帶出有趣的節奏。","整句分拍慢慢聽。"]]}};

// 原創語言練習句：僅對應歌曲情境，並非 BABYMONSTER 原版歌詞。
// 每位成員演唱段落仍沿用 v8 的演唱者及 MV 時間軸。
const practice={
DRIP:[
 [['en','I can do it!','我做得到！','要相信自己喔！'],['ko','자신 있게 해 봐!','自信地試試看！','我們一起勇敢試試！']],
 [['en','Let’s go together!','我們一起出發！','跟朋友一起，真開心！'],['ko','같이 가자!','一起走吧！','準備好，就出發囉！']],
 [['ko','걱정하지 마!','別擔心！','別緊張，慢慢來就好！'],['en','Keep going!','繼續向前！','再試一次就更厲害！']],
 [['en','You don’t know me yet.','你還不了解我呢。','哇，這句好有自信！']],
 [['ko','별이 빛나요.','星星正在閃耀。','想像天空亮晶晶的樣子！']],
 [['en','What do you think?','你覺得呢？','用問句邀請朋友回答！']],
 [['en','Are you ready?','你準備好了嗎？','準備好了就一起來！']],
 [['ko','나는 할 수 있어!','我能做到！','給自己一個大大的加油！']],
 [['en','Here we go!','我們上場囉！','準備跟著節奏出發！']],
 [['ko','멈추지 마!','不要停下來！','我們再勇敢往前一步！']],
 [['en','Shine like a diamond.','像鑽石一樣閃亮。','你也可以閃閃發光！']],
 [['ko','다시 일어나!','再站起來！','跌倒沒關係，再來一次！']]
],
FOREVER:[
 [['en','No worries today!','今天不煩惱！','今天要開心地往前走！']],
 [['en','Follow your dreams.','追尋你的夢想。','夢想很棒，我們慢慢努力！']],
 [['ko','반짝반짝 빛나요.','閃閃發光。','就像小星星一樣！']],
 [['en','I am different!','我很不一樣！','每個人都有自己的特色！']]
],
'BATTER UP':[
 [['en','I choose my own way.','我選擇自己的道路。','做決定前，可以勇敢想一想！']],
 [['ko','나는 강해요.','我很堅強。','哇，你也有自己的力量！']],
 [['en','Remember me!','記得我！','用開心又有精神的聲音說！']]
],
SHEESH:[
 [['en','Let’s start!','我們開始吧！','跟著節奏開心出場！']],
 [['en','Hello, everyone!','大家好！','我們一起打個招呼！']],
 [['ko','난 자신 있어!','我有自信！','把肩膀挺起來，真棒！']],
 [['en','Look at me!','看看我！','把舞台上的活力傳給大家！']],
 [['en','Feel the rhythm!','感受節奏！','慢慢聽，每一拍都很有趣！']]
]};
let lineIndex=0;
function currentLine(){return (practice[song]?.[index]||[])[lineIndex]||['en','Let’s learn!','一起來學吧！','準備開始囉！']}
function renderLine(){const p=currentLine(),total=(practice[song]?.[index]||[]).length;
 $('foreign').textContent=p[1];$('foreignhint').textContent=(p[0]==='ko'?'韓語':'英語')+' · 原創情境練習句（非原歌詞）';$('meaning').textContent=p[2];$('note').textContent=p[3];$('sentencecount').textContent='第 '+(lineIndex+1)+' / '+total+' 句';
 $('prevline').disabled=lineIndex===0;$('nextline').disabled=lineIndex===total-1;
}

const $=id=>document.getElementById(id), names={chiquita:'CHIQUITA',ahyeon:'AHYEON',ruka:'RUKA',asa:'ASA',rora:'RORA',pharita:'PHARITA',rami:'RAMI'};
let song='DRIP',index=0,player=null,ready=false,voiceToken=0;
function state(t){$('status').textContent=t}
function stop(){voiceToken++;if('speechSynthesis'in window)speechSynthesis.cancel();try{player?.pauseVideo()}catch(_){} }
function entry(){return tracks[song].parts[index]}
function render(){stop();lineIndex=0;const p=entry();$('title').textContent=song+'｜'+p[3];$('part').textContent=p[3];$('name').textContent=names[p[0]];$('teacher').src='/assets/babymonster/'+p[0]+'.gif';$('teacher').alt=names[p[0]]+' Q 版小老師';renderLine();$('official').href='https://www.youtube.com/watch?v='+tracks[song].id;
const timed=p[1]!==null&&p[2]!==null;$('music').disabled=!timed;$('replay').disabled=!timed;
$('notice').textContent=timed?'段落秒數是依第三方歌詞時間軸推估，尚未實機對照官方 MV，若聽到前後段偏移，請以官方 MV 為準。':'目前已核對演唱者與段落，但沒有可靠的官方 MV 分段秒數，因此暫不播放錯誤片段。';
state(timed?'先聽這一段原歌，再聽小老師慢慢教這一句！':'這段原歌時間還在校準，可以先跟小老師練習這一句。');
document.querySelectorAll('.clip').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.i)===index)));
}
function build(){const nav=$('tabs');nav.replaceChildren();Object.keys(tracks).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.setAttribute('aria-pressed',String(k===song));b.onclick=()=>{song=k;index=0;try{player?.cueVideoById(tracks[k].id)}catch(_){}build()};nav.append(b)});$('songtitle').textContent=song+'｜成員演唱段落';const cards=$('cards');cards.replaceChildren();tracks[song].parts.forEach((p,i)=>{let b=document.createElement('button');b.className='clip';b.dataset.i=i;let pic=document.createElement('img');pic.src='/assets/babymonster/'+p[0]+'.gif';pic.alt='';pic.loading='lazy';let txt=document.createElement('span');let strong=document.createElement('strong');strong.textContent=String(i+1).padStart(2,'0')+' '+names[p[0]];let small=document.createElement('small');small.textContent=p[3];txt.append(strong,small);b.append(pic,txt);b.onclick=()=>{index=i;render()};cards.append(b)});render()}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:tracks[song].id,playerVars:{playsinline:1,rel:0,enablejsapi:1,origin:location.origin},events:{onReady:()=>{ready=true;state('影片可播放。請按「聽這一段原歌」。')},onError:e=>state('無法嵌入播放 YouTube（代碼 '+e.data+'），請改用官方 MV 連結。')}})};
function music(){const p=entry();if(p[1]===null){state('這段尚未校準，避免播放錯誤片段。');return}stop();if(!ready){state('YouTube 播放器尚未載入，請稍後點選或改用官方 MV。');return}try{player.loadVideoById({videoId:tracks[song].id,startSeconds:p[1],endSeconds:p[2]});state('播放 '+names[p[0]]+' 的參考段落（'+p[1]+'–'+p[2]+' 秒）。若 MV 有片頭，可能產生偏移。')}catch(e){state('播放失敗：'+e.message)}}
function speak(){
 stop();const token=voiceToken;
 if(!('speechSynthesis'in window)){state('這台裝置無法播放語音。請換用 Chrome 或 Edge，並檢查語音設定。');return;}
 const p=currentLine();const synth=window.speechSynthesis;
 const findVoice=lang=>{const vs=synth.getVoices();return vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;};
 const queue=[
  {text:p[1],lang:p[0]==='ko'?'ko-KR':'en-US',rate:.76,pitch:1.08},
  {text:'這句的意思是：'+p[2]+' '+p[3],lang:'zh-TW',rate:.86,pitch:1.19}
 ];
 let pos=0;
 function next(){if(token!==voiceToken||pos>=queue.length){if(token===voiceToken)state('學會這一句啦！可以按下一句，或再聽一次喔！');return;}
  const c=queue[pos++],u=new SpeechSynthesisUtterance(c.text);u.lang=c.lang;u.rate=c.rate;u.pitch=c.pitch;u.volume=1;u.voice=findVoice(c.lang);
  u.onstart=()=>{if(token===voiceToken)state(pos===1?'先慢慢聽'+(p[0]==='ko'?'韓語':'英語')+'發音～':'中文意思來囉！')};
  u.onend=()=>{if(token===voiceToken)next()};
  u.onerror=e=>{if(token!==voiceToken)return;state('語音播放失敗（'+e.error+'）。請檢查裝置語音或改用 Chrome／Edge。')};
  synth.speak(u);
 }
 state('小老師準備開始囉！');next();
}
$('music').onclick=music;$('replay').onclick=music;$('voice').onclick=speak;$('prevline').onclick=()=>{stop();lineIndex=Math.max(0,lineIndex-1);renderLine();state('這句也可以慢慢再聽一次！')};$('nextline').onclick=()=>{stop();lineIndex=Math.min((practice[song]?.[index]||[]).length-1,lineIndex+1);renderLine();state('換下一句囉！按小老師播放就會慢慢教。')};$('stop').onclick=()=>{stop();state('已停止。')};$('next').onclick=()=>{index=(index+1)%tracks[song].parts.length;render()};window.addEventListener('pagehide',stop);build();let s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>state('YouTube 無法載入，請直接開啟官方 MV。');document.head.append(s);
})();</script></body></html>
