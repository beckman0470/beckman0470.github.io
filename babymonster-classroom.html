adding:11px 16px;font-weight:900}.primary{background:#ffd1ed;color:#63255f}.secondary{background:#433b5c;color:white}.state{font-size:14px;line-height:1.7;color:#ffe2f3;padding:8px 4px;min-height:40px}.note{color:#615c68;font-size:13px;line-height:1.75;margin-top:18px}.official{display:inline-block;margin-top:10px;padding:11px 16px;border:1px solid #c8a6cc;border-radius:12px;color:#613577;background:white;font-weight:800;text-decoration:none}.hide{display:none!important}@keyframes bob{to{transform:translateY(-9px) rotate(1.5deg)}}@media(max-width:720px){.clips{grid-template-columns:repeat(2,minmax(0,1fr))}.clipart{height:145px}.clipart img{height:120px}.set{grid-template-columns:35% 65%;min-height:260px}.actor{padding-top:59px}.actor img{max-height:185px}.blackboard{margin:67px 10px 15px 0;padding:13px 8px;border-width:6px;min-height:160px}.wrap{padding:10px 10px 48px}.head{padding:14px}.screen{padding:9px}.screencontrols button{flex:1 1 130px}}@media(max-width:390px){.clips{grid-template-columns:1fr 1fr;gap:9px}.cliplabel{padding:8px}.cliplabel strong{font-size:13px}.clipart{height:115px}.clipart img{height:95px}.set{grid-template-columns:36% 64%}.actor-name{font-size:11px}.blackboard .original{font-size:17px}}@media(prefers-reduced-motion:reduce){.actor img.dancing{animation:none}}

</style></head><body><main class="wrap"><header class="head"><div class="topnav"><a href="/rooms.html?room=games" class="back">← 回到遊戲間</a><span>雞爸爸生活研究室 · 鼠姊姊的音樂教室</span></div><h1>BABYMONSTER 英韓短片教室</h1><p>一首歌有好幾支小短片。誰唱這一段，就由誰的 Q 版人物教這一句！</p></header>
<nav id="songtabs" class="songtabs" aria-label="選歌曲"></nav><p class="overview" id="overview"></p><section id="clips" class="clips" aria-label="分段教學短片"></section>
<section class="screen" id="screen" aria-label="短片播放舞台"><div class="screenhead"><strong id="heading">選一支短片開始</strong><a class="back" href="/rooms.html?room=games">← 回到遊戲間</a></div><div class="set"><div class="actor"><img id="actor" src="/assets/babymonster/ruka.gif" alt="BABYMONSTER Q 版小老師"><span class="actor-name" id="actor-name">RUKA</span></div><div class="blackboard"><div class="original" id="original"></div><div class="roman" id="roman"></div><div class="zh" id="zh"></div></div></div><div class="screencontrols"><button id="play" class="primary">▶ 播放這支教學短片</button><button id="again" class="secondary">↻ 重播</button><button id="stop" class="secondary">■ 停止</button><button id="next" class="secondary">下一支短片 →</button></div><div id="status" class="state" role="status" aria-live="polite"></div></section>
<a id="official" class="official" href="#" target="_blank" rel="noopener noreferrer">▶ 觀看這首歌的官方 MV</a><p class="note">本版的「短片」是 Q 版動畫、英韓發音與繁體中文語音講解的連續播放。歌曲原唱仍由官方 MV 播放；尚未逐段校準原唱的精確時間，因此不會假裝播放的是相同句子的原唱音樂。此為非官方教學作品，語音不模仿成員本人。</p></main>
<script>
(()=>{'use strict';
const tracks={"DRIP": {"url": "https://www.youtube.com/watch?v=Zp-Jhuhq0bQ", "lessons": [{"who": "ruka", "text": "고민하지 마", "lang": "ko-KR", "roman": "gominhaji ma", "zh": "不要煩惱，別想太多。", "explain": "고민表示煩惱；하지 마是不要做。這句可以用來安慰朋友。"}, {"who": "asa", "text": "But you don’t know ’bout me", "lang": "en-US", "roman": "But you don’t know about me", "zh": "但是你還不夠了解我。", "explain": "but是但是；know是知道、了解；about me是關於我。這句的意思是，你還不了解真正的我。"}, {"who": "rora", "text": "아름다운 별들이 빛나는 밤이야", "lang": "ko-KR", "roman": "areumdaun byeoldeuri binnaneun bamiya", "zh": "這是個美麗星星閃耀的夜晚。", "explain": "아름다운表示美麗的，별是星星，밤是夜晚。這是一句描述美麗夜空的韓語。"}]}, "SHEESH": {"url": "https://www.youtube.com/watch?v=2wA_b6YHjqQ", "lessons": [{"who": "chiquita", "text": "I see you in slow mo", "lang": "en-US", "roman": "I see you in slow motion", "zh": "我看見你的動作像慢動作一樣。", "explain": "I see you是我看見你；slow mo是slow motion的口語縮寫，意思是慢動作。"}, {"who": "rora", "text": "You know that", "lang": "en-US", "roman": "You know that", "zh": "你知道那件事。", "explain": "you是你，know是知道，that是那件事。"}, {"who": "rami", "text": "피어나", "lang": "ko-KR", "roman": "pieona", "zh": "綻放、開花。", "explain": "피어나是盛開、綻放的意思。"}, {"who": "pharita", "text": "Do or die", "lang": "en-US", "roman": "Do or die", "zh": "全力以赴的決心。", "explain": "這是一種強調決心的說法，不是真的要求人做危險的事。"}, {"who": "ahyeon", "text": "Sheesh", "lang": "en-US", "roman": "Sheesh", "zh": "哇！真令人驚訝！", "explain": "sheesh是感嘆語，可以表達驚訝。"}, {"who": "ruka", "text": "쉿", "lang": "ko-KR", "roman": "swit", "zh": "噓，安靜一下。", "explain": "쉿是韓文提醒別人小聲一點的感嘆詞。"}, {"who": "asa", "text": "Time’s up", "lang": "en-US", "roman": "Time is up", "zh": "時間到了。", "explain": "time是時間，time is up表示時間結束。"}]}};
const names={ruka:'RUKA',pharita:'PHARITA',asa:'ASA',ahyeon:'AHYEON',rami:'RAMI',rora:'RORA',chiquita:'CHIQUITA'};
const $=id=>document.getElementById(id),make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
let song='DRIP',index=0,serial=0,utter=null,running=false;
const voices=()=>{try{return speechSynthesis.getVoices()}catch(_){return []}};
function stop(){serial++;running=false;try{speechSynthesis.cancel()}catch(_){}$('actor').classList.remove('dancing');$('play').disabled=false;}
function say(text,lang,rate,run){return new Promise(resolve=>{if(run!==serial)return resolve(false);if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){status('這個瀏覽器無法使用語音功能，請改用最新版 Chrome 或 Edge。');return resolve(false)}let finished=false;const complete=ok=>{if(finished)return;finished=true;resolve(ok)};const u=new SpeechSynthesisUtterance(text);const all=voices(),key=lang.toLowerCase();u.lang=lang;u.voice=all.find(v=>v.lang.toLowerCase()===key)||all.find(v=>v.lang.toLowerCase().startsWith(key.slice(0,2)))||null;u.rate=rate;u.volume=1;u.pitch=1.05;u.onstart=()=>{if(run===serial){running=true;$('actor').classList.add('dancing')}};u.onend=()=>complete(true);u.onerror=e=>{if(run===serial)status('語音播放失敗：'+(e.error||'系統不支援這個語言')+'。請檢查系統語音與音量。');complete(false)};try{speechSynthesis.speak(u)}catch(e){status('語音無法啟動：'+e.message);complete(false)};setTimeout(()=>{if(!finished&&run===serial&&!speechSynthesis.speaking&&!speechSynthesis.pending){status('未能啟動語音，請確認裝置已安裝該語言語音。');complete(false)}},1800);});}
function status(t){$('status').textContent=t;}
function render(){stop();const lessons=tracks[song].lessons,p=lessons[index];$('actor').src='/assets/babymonster/'+p.who+'.gif?v=20261115-fix2';$('actor').alt=names[p.who]+' Q 版小老師';$('actor-name').textContent=names[p.who];$('original').textContent=p.text;$('original').lang=p.lang;$('roman').textContent=p.roman;$('zh').textContent=p.zh;$('heading').textContent=`${song}｜短片 ${String(index+1).padStart(2,'0')} · ${names[p.who]}`;$('overview').textContent=`${song} · ${lessons.length} 支分段小短片，點一張卡片即可播放。`;$('official').href=tracks[song].url;$('official').textContent=`▶ 觀看 ${song} 官方 MV`;status('點「播放這支教學短片」，由這一段的 Q 版小老師帶你學。');document.querySelectorAll('.clip').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===index)));}
function build(){const n=$('songtabs');n.replaceChildren();Object.keys(tracks).forEach(name=>{const b=make('button','',name);b.type='button';b.setAttribute('aria-pressed',String(name===song));b.onclick=()=>{song=name;index=0;build();};n.append(b)});const c=$('clips');c.replaceChildren();tracks[song].lessons.forEach((p,i)=>{const b=make('button','clip');b.type='button';b.dataset.index=i;const art=make('div','clipart'),img=make('img');img.src='/assets/babymonster/'+p.who+'.gif?v=20261115-fix2';img.alt='';img.loading='lazy';art.append(img);const label=make('div','cliplabel');label.append(make('strong','',`短片 ${String(i+1).padStart(2,'0')}｜${names[p.who]}`),make('span','',p.zh));b.append(art,label);b.onclick=()=>{index=i;render();$('screen').scrollIntoView({behavior:'smooth',block:'start'});play()};c.append(b)});render();}
async function play(){stop();const run=serial,p=tracks[song].lessons[index];$('play').disabled=true;status('第 1 段：聽這一句的英韓發音…');let ok=await say(p.text,p.lang,.82,run);if(run!==serial)return;if(!ok){$('play').disabled=false;return;}status('第 2 段：聽繁體中文解說…');ok=await say('這句話的意思是：'+p.zh+'。'+p.explain,'zh-TW',.9,run);if(run!==serial)return;if(!ok){$('play').disabled=false;return;}status('第 3 段：再聽一次這一句。');ok=await say(p.text,p.lang,.75,run);if(run!==serial)return;running=false;$('actor').classList.remove('dancing');$('play').disabled=false;status(ok?'這支短片播完了！可以重播或選下一支。':'語音未完成。請確認音量與語音設定。');}
$('play').onclick=play;$('again').onclick=play;$('stop').onclick=()=>{stop();status('已停止，可以再按播放。')};$('next').onclick=()=>{index=(index+1)%tracks[song].lessons.length;render();play()};window.addEventListener('pagehide',stop);build();
})();
</script></body></html>
