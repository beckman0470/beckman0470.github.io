</style></head><body><main class="wrap"><section class="screen"><div class="top"><div class="branding"><strong>BABYMONSTER</strong><span>鼠姊姊・英韓小教室</span></div><div class="lyrics" id="lyrics" aria-label="歌詞"></div></div><div class="song-meta"><span class="pill">DRIP　EP01</span><span>CHIQUITA｜小七</span></div><img class="stage" src="/assets/bm-approved/drip-stage.jpg" alt="七人固定站位，小七在前排，粉紅霓虹舞台，RORA、CHIQUITA、AHYEON、RAMI、PHARITA、ASA、RUKA"><div class="translation"><b>📖 整句意思</b><strong id="translation">我打扮的時候，不會想太多。</strong></div><div class="cards" id="cards"></div><div class="player"><a class="return" href="/rooms.html?room=games">⌂ 回遊戲間</a><button class="btn" id="play" aria-label="播放示範">▶</button><div class="status" id="status">按 ▶ 看逐字教學畫面</div></div><p class="note">這版只修正成你定案的視覺版型及疊影。逐字高亮是示範節奏，尚未與原唱同步；本檔沒有 BABYMONSTER 原唱音樂，亦沒有正式卡通配音。下方單字點擊可查看中文詞義，但不會偽裝成已完成配音。</p></section></main>
<script>(()=>{'use strict';const words=[['When','當……的時候','📅'],['I','我','🙋'],['dress','穿衣服、打扮','👗'],["don’t",'不、沒有','🚫'],['think','想、思考','💭'],['so','這麼、那麼','✨'],['much','多','📚']];let pos=0,step=0,timer=null;const $=s=>document.querySelector(s),ly=$('#lyrics'),cards=$('#cards'),play=$('#play');const make=(tag,className,txt)=>{const x=document.createElement(tag);x.className=className;x.textContent=txt;return x};function show(i){pos=i;[...ly.children].forEach((e,j)=>e.classList.toggle('active',j===i));[...cards.children].forEach((e,j)=>e.classList.toggle('selected',j===i));$('#status').textContent=words[i][0]+'：'+words[i][1];}words.forEach((w,i)=>{let b=make('button','',w[0]);b.onclick=()=>show(i);ly.append(b);let c=make('button','card', '');let a=make('span','word',w[0]),p=make('span','icon',w[2]),m=make('span','hint',w[1]);c.append(a,p,m);c.onclick=()=>show(i);cards.append(c)});function stop(){clearInterval(timer);timer=null;play.textContent='▶';play.setAttribute('aria-label','播放示範')}play.onclick=()=>{if(timer){stop();return}show(0);play.textContent='Ⅱ';play.setAttribute('aria-label','暫停示範');timer=setInterval(()=>{if(pos>=words.length-1){stop();$('#status').textContent='這句的意思：我打扮的時候，不會想太多。';return}show(pos+1)},2000)};show(0)})();</script></body></html>
