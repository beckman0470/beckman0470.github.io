<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIP EP01 | 鼠姊姊的 BABYMONSTER 英韓小教室</title><style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#fff9fc;background:#fbf6e9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:15px}.frame{border-radius:22px;overflow:hidden;border:6px solid #d8b48d;background:#170d28;box-shadow:0 10px 30px #3a1a3b30}.top{padding:16px 19px 12px;background:linear-gradient(110deg,#4d174d,#251039);display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:950;font-size:clamp(15px,2.3vw,24px);color:#fff}.brand span{color:#ff87c1}.nav-home{background:#fff6e8;color:#425d46;border-radius:40px;text-decoration:none;padding:10px 14px;font-size:16px}.song{background:linear-gradient(105deg,#231135,#512052);border:3px solid #f685c7;border-radius:17px;margin:10px 14px;padding:12px;text-align:center;min-height:104px}.song small{color:#ffc9e6;display:block;letter-spacing:.15em;font-weight:900}.lyrics{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin-top:8px}.lyric{display:inline-block;border:0;background:transparent;color:#fff;padding:4px 6px;font-size:clamp(19px,3vw,38px);font-weight:900;border-radius:10px}.lyric.current{background:#ffe46b;color:#401746;box-shadow:0 0 15px #ffb4eb}.stage{position:relative;background:radial-gradient(circle at 45% 35%,#b15d9c99,transparent 48%),linear-gradient(#4f2862,#2a1b4f 63%,#634f62 64%,#f3d9bc);height:350px;overflow:hidden}.lights{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 6px,transparent 6px 65px);pointer-events:none}.team{position:absolute;display:flex;justify-content:space-between;align-items:end;bottom:12px;left:0;right:0;padding:0 12px;gap:2px;height:210px}.person{width:calc(100% / 7);position:relative;text-align:center;transition:filter .5s,transform .6s,opacity .5s}.person img{width:100%;height:190px;object-fit:contain;object-position:bottom;mix-blend-mode:multiply;filter:drop-shadow(0 3px 6px #130a33bb)}.person strong{display:block;margin-top:-7px;background:#ffe0f0;border:2px solid #fe6cbe;border-radius:12px;color:#8a1d60;font-size:clamp(9px,1.3vw,13px);white-space:nowrap;padding:5px 0}.stage.focus .person:not([data-person="CHIQUITA"]){opacity:.65;filter:brightness(.8)}.stage.focus .person[data-person="CHIQUITA"]{opacity:.5}.solo{position:absolute;z-index:3;width:200px;height:300px;object-fit:contain;object-position:bottom;left:50%;bottom:-8px;transform:translate(-50%,120%);transition:transform .95s cubic-bezier(.2,.8,.2,1);mix-blend-mode:multiply;filter:drop-shadow(0 9px 8px #200b3b99)}.stage.focus .solo{transform:translate(-50%,0)}.bubble{position:absolute;z-index:4;top:18px;left:50%;transform:translateX(-50%);background:#fff9f4;color:#8d2e60;border:3px solid #f48abb;border-radius:24px;padding:8px 18px;font-weight:900;font-size:clamp(17px,2.1vw,25px);max-width:90%;text-align:center;box-shadow:0 4px 12px #37193866}.lesson{background:#fbf2e7;color:#34253c;padding:12px 16px 14px;min-height:188px}.explain{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:15px;background:#fff;box-shadow:0 2px 5px #5e375c1d;padding:8px 12px;text-align:center;font-weight:900;font-size:clamp(17px,2.2vw,27px)}.symbol{font-size:32px}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:11px}.vocab{border:2px solid #eab0d1;background:#fff;border-radius:14px;min-width:110px;padding:9px 10px;color:#682a58;cursor:pointer}.vocab strong{font-size:clamp(17px,1.8vw,22px);display:block}.vocab small{display:block;color:#2d604a;font-size:15px;margin-top:4px}.vocab.selected{border-color:#ffb52e;background:#fff3be;transform:translateY(-3px)}.vocab .emoji{font-size:25px}.controls{background:#25122f;display:flex;align-items:center;justify-content:center;gap:22px;padding:10px}.ctrl{background:#ffdeed;border:2px solid #ff80ba;color:#6a2f57;border-radius:100px;width:55px;height:55px;font-size:23px;cursor:pointer}.ctrl.main{background:#e64e9b;color:white;font-size:32px;width:68px;height:68px}.progress{width:25%;height:6px;background:#61455f;border-radius:5px;overflow:hidden}.progress>i{display:block;width:0;background:#f78ec7;height:100%;transition:width .2s}.help{text-align:center;background:#fff9ee;color:#66756a;padding:8px;font-size:13px;line-height:1.5}.footer{max-width:1000px;margin:10px auto;color:#756c6b;font-size:12px;line-height:1.8}.muted{opacity:.7}.hidden{display:none!important}@media(max-width:680px){.shell{padding:5px}.frame{border-width:3px}.song{min-height:96px;margin:6px}.stage{height:290px}.team{height:152px;bottom:13px;padding:0 3px}.person img{height:135px}.solo{height:245px;width:175px}.bubble{top:6px;font-size:16px;padding:5px 10px}.lesson{padding:8px}.vocab{min-width:83px;padding:6px}.vocab small{font-size:12px}.vocab .emoji{font-size:19px}.vocab strong{font-size:15px}.progress{width:20%}.person strong{font-size:8px;padding:3px 0}.top{padding:8px}}
</style></head><body><main class="shell"><div class="frame"><header class="top"><div class="brand">BABYMONSTER <span>英韓小教室</span>　<small>DRIP · EP01</small></div><a class="nav-home" href="/rooms.html?room=games" aria-label="回遊戲間">⌂</a></header><div class="song"><small id="songTag">♪ 卡通教室 · 按播放開始</small><div id="lyricRow" class="lyrics" aria-label="歌詞"></div></div><section id="stage" class="stage"><div class="lights"></div><div id="speech" class="bubble">我們是 BABYMONSTER！</div><div class="team" id="team"></div><img class="solo" id="solo" src="assets/bm-ep01/CHIQUITA.png" alt="小七"></section><section class="lesson"><div class="explain"><span class="symbol" id="icon">🎤</span><span id="meaning">七位 Q 版小老師歡迎你</span></div><div id="cards" class="cards"></div></section><div class="controls"><button id="again" class="ctrl" title="重播">↺</button><div class="progress"><i id="progress"></i></div><button id="play" class="ctrl main" title="播放／暫停" aria-label="播放">▶</button><div class="progress"><i id="progress2"></i></div><button id="next" class="ctrl" title="下一集（示範重播）">⏭</button></div><div id="status" class="help" role="status">按 ▶ 開始；單字圖卡可點一下，聽英文及中文意思。</div></div><div class="footer">本試作版已固定七人站位、完整人物、英文與中文點讀流程。未內含 BABYMONSTER 原唱；歌詞逐字亮起僅示範教學時間軸，不能視為原唱同步。語音使用目前裝置可用的英文與中文合成聲，尚非七種卡通配音；裝置沒有中文語音時會顯示提示。</div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const people=['RORA','CHIQUITA','AHYEON','RAMI','PHARITA','ASA','RUKA'];
for(const name of people){let div=document.createElement('div');div.className='person';div.dataset.person=name;div.innerHTML=`<img src="assets/bm-ep01/${name}.png" alt="${name}"><strong>${name}</strong>`;$('team').appendChild(div)}
const lyrics=['When','I','dress','I','don’t','think','so','much'];
const vocab=[{t:'When',zh:'當什麼時候',icon:'🕒'},{t:'I',zh:'我',icon:'🙋'},{t:'dress',zh:'穿衣服、打扮',icon:'👗'},{t:'don’t',zh:'不、不要',icon:'🚫'},{t:'think',zh:'想、思考',icon:'💭'},{t:'so',zh:'如此、這麼',icon:'↔️'},{t:'much',zh:'很多',icon:'📚'}];
const stages=[
{type:'intro',text:'我們是 BABYMONSTER！',zh:'七位小老師一起登場',emoji:'👋',speech:'我們是 BABYMONSTER！'},
{type:'solo',text:'我是 CHIQUITA！',zh:'今天由小七來教英文',emoji:'🎤',speech:'我是小七！'},
{type:'solo',text:'今天介紹 DRIP！',zh:'今天的歌曲：DRIP',emoji:'🎵',speech:'今天要介紹的歌曲是，DRIP！'},
{type:'solo',text:'來聽聽我的這一句！',zh:'歌曲原唱尚未加入此試作版',emoji:'🎧',speech:'一起來聽聽這一句。'},
{type:'lyric',text:'看英文歌詞',zh:'這句英文會逐字亮起',emoji:'🎶',speech:'這句英文，我們慢慢看。'},
{type:'meaning',text:'這句話的意思',zh:'我穿衣服時，不會想太多。',emoji:'👗',speech:'這句話的意思是，我穿衣服的時候，不會想太多。'},
{type:'vocabintro',text:'一起唸唸單字！',zh:'先念英文，再聽中文解釋',emoji:'📚',speech:'我們一起來念念單字。'},
...vocab.map(v=>({type:'vocab',text:v.t,zh:v.zh,emoji:v.icon,speechZh:v.zh,word:v.t})),
{type:'finish',text:'整句再聽一次',zh:'我穿衣服時，不會想太多。',emoji:'✨',speech:'最後再記住這句話：我穿衣服的時候，不會想太多。'}
];
let idx=0,playing=false,token=0,timer=null;
function selectVoice(lang){let all=speechSynthesis.getVoices(),match=all.filter(v=>v.lang.toLowerCase().startsWith(lang)); if(lang==='zh')return match.find(v=>/taiwan|zh-tw|hanhan|hsiaochen|xiaoyu/i.test(v.name+' '+v.lang))||match[0];return match.find(v=>/female|jenny|aria|samantha/i.test(v.name))||match[0]}
function say(text,lang,rate=.85){return new Promise(resolve=>{if(!('speechSynthesis' in window)){resolve();return}let u=new SpeechSynthesisUtterance(text);u.lang=lang==='zh'?'zh-TW':'en-US';u.rate=rate;u.pitch=1.05;const v=selectVoice(lang);if(v)u.voice=v;let done=false;const finish=()=>{if(done)return;done=true;resolve()};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,Math.max(4000,text.length*380+3000))})}
const wait=ms=>new Promise(resolve=>{timer=setTimeout(resolve,ms)});
function draw(){let s=stages[idx];$('stage').classList.toggle('focus',s.type!=='intro');$('speech').textContent=s.text;$('meaning').textContent=s.zh;$('icon').textContent=s.emoji;$('songTag').textContent=`DRIP · 小七教學 ${idx+1}/${stages.length}`;$('progress').style.width=$('progress2').style.width=(idx/(stages.length-1)*100)+'%';$('cards').replaceChildren();$('lyricRow').replaceChildren();if(s.type==='lyric'||s.type==='meaning'||s.type==='vocab'||s.type==='finish'){lyrics.forEach(w=>{const e=document.createElement('span');e.className='lyric';e.textContent=w;$('lyricRow').append(e)})}else{$('lyricRow').textContent='BABYMONSTER  ·  DRIP'}if(s.type==='vocab'||s.type==='vocabintro'||s.type==='finish'){vocab.forEach(v=>{let b=document.createElement('button');b.className='vocab';b.innerHTML=`<span class="emoji">${v.icon}</span><strong>${v.t} 🔊</strong><small>${v.zh}</small>`;if(v.t===s.word)b.classList.add('selected');b.onclick=async()=>{stopAuto();document.querySelectorAll('.vocab').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');speechSynthesis.cancel();await say(v.t,'en',.72);await wait(450);await say(v.zh,'zh',.83);$('status').textContent=`${v.t}：${v.zh}`};$('cards').appendChild(b)})}}
async function run(){let mine=++token;playing=true;$('play').textContent='⏸';for(;idx<stages.length;){if(mine!==token)return;draw();let s=stages[idx];if(s.type==='vocab'){await say(s.word,'en',.72);if(mine!==token)return;await wait(450);if(mine!==token)return;await say(s.speechZh,'zh',.83)}else{await say(s.speech,'zh',.85)}if(mine!==token)return;if(s.type==='lyric'){let elems=[...$('lyricRow').children];for(let k=0;k<elems.length;k++){if(mine!==token)return;elems.forEach((e,j)=>e.classList.toggle('current',j===k));await wait(560)} }else await wait(850);idx++}playing=false;$('play').textContent='▶';idx=0;$('status').textContent='這一集結束了！按 ▶ 可以再看一次。';draw()}
function stopAuto(){token++;playing=false;clearTimeout(timer);if('speechSynthesis'in window)speechSynthesis.cancel();$('play').textContent='▶'}
$('play').onclick=()=>{if(playing){stopAuto();$('status').textContent='已暫停；再按 ▶ 從這一步繼續。'}else{if(!('speechSynthesis'in window)){$('status').textContent='目前瀏覽器不支援語音。';return}run()}};
$('again').onclick=()=>{stopAuto();idx=0;run()};$('next').onclick=()=>{stopAuto();idx=0;draw();$('status').textContent='目前只有第 01 集；按 ▶ 重播。'};
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}draw();
})();
</script></body></html>
