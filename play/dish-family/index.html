(()=>{'use strict';const $=id=>document.getElementById(id),names=['小雞盤子','恐龍碗','小熊杯子'],n=3;let round=0,phase=0,stains=[],bubbleCount=0,rinseCount=0,locked=false,pointerDown=false,sound=true,stacked=0,audioCtx=null;
