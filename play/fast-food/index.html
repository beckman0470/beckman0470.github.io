</style></head><body><header><a href="https://beckman0470.github.io/rooms.html?room=dining" aria-label="回餐廳">← 🏠</a><h1>小森速食店</h1><div class="tools"><button class="tool active" id="easy" aria-label="簡單模式，一位客人" aria-pressed="true">1 🐰</button><button class="tool" id="challenge" aria-label="挑戰模式，三位客人" aria-pressed="false">3 🐰</button><button class="tool" id="voice" aria-label="語音說明開關" aria-pressed="true">🔊</button><button class="tool" id="restart" aria-label="重新開店">↻</button><span class="score" id="score" aria-live="polite">⭐ 0</span></div></header>

<div class="kitchen"><div class="step-icons" id="steps" aria-hidden="true"><span id="step-order">🍽️</span><small>→</small><span id="step-pay">🪙</span><small>→</small><span id="step-cash">💰</span></div><section class="cash-zone" aria-label="收錢和收銀機"><div id="held" class="held-cash" tabindex="0" role="button" aria-label="手裡的錢，可拖到打開的收銀機"></div><span class="hand-arrow" aria-hidden="true">→</span><div class="register-unit" id="register"><button class="register-toggle" id="open-register" aria-label="打開收銀機抽屜" aria-expanded="false"><span class="object register-art closed sprite-3" aria-hidden="true"></span><span class="object register-art open sprite-4" aria-hidden="true"></span></button><span class="register-count" id="register-count" aria-hidden="true">0</span><button class="drawer" id="deposit" aria-label="把手裡的錢放進收銀機" disabled></button></div></section><div class="equipment" id="equipment"></div><section class="assembly" id="assembly" hidden aria-label="漢堡組裝臺"><div class="layer-guide" id="guide"></div><div class="built" id="built"></div><div class="layer-buttons" id="layers"></div><div class="assembly-tools"><button id="burger-undo" aria-label="拿掉最後一層">↶</button><button id="burger-done" aria-label="漢堡放入托盤">✅</button><button id="burger-close" aria-label="關閉漢堡組裝臺">✕</button></div></section><div class="workbench"><div class="tray" id="tray" tabindex="0" role="button" aria-label="餐盤，點一下送給選中的客人，也可以拖到客人面前"></div><div class="actions"><button id="undo" aria-label="拿掉最後一樣餐點">↶</button><button id="clear" aria-label="清空餐盤">↺</button><button id="read" aria-label="再聽一次語音提示">🔈</button></div></div></div></div><div class="feedback" id="feedback" aria-hidden="true"></div><div class="sr" id="message" role="status" aria-live="polite"></div><details class="parent"><summary>⚙ 給爸爸媽媽</summary><p>客人從後方排隊，前一位完成收款後，隊伍會向前。看客人頭上的餐點圖示，到各站拿漢堡、薯條、可樂，放進餐盤，點餐盤或拖給客人。客人會把錢放在櫃檯上。</p><p>點櫃檯上的錢拿起來，再點收銀機打開抽屜，再點一次收銀機放錢，或把手上的錢拖進抽屜。錢放好後，下一位客人會走過來。這是外帶櫃檯，不需要清理餐桌。</p><p>1 🐰 為簡單模式，3 🐰 為三位客人的挑戰模式，漢堡依圖片組裝。沒有倒數，也不扣分。語音預設開啟，需先點一下畫面；🔈 重聽，🔊 開關語音。原創角色與插圖，無廣告、品牌素材、登入或個人資料蒐集。</p></details></main><script>
const foods={bottom:['下麵包','#dca05b','<path d="M9 19H91V28Q50 41 9 28Z"/>'],beef:['漢堡排','#895039','<rect x="7" y="10" width="86" height="24" rx="12"/><path d="M21 18h12m16 8h15m7-11h9" stroke="#b97d53" stroke-width="3"/>'],chicken:['雞排','#d69b35','<path d="M7 17l9-7 13 2 10-5 13 5 17-3 10 5 12 3-4 14-18 4-17-3-17 3-22-4Z"/><path d="M22 20l8 3m17-6 7 4m16 4 7-5" stroke="#f5c866" stroke-width="4"/>'],fish:['魚排','#e6b76e','<rect x="7" y="10" width="86" height="24" rx="8"/><path d="M18 18h65M20 26h61" stroke="#f9d89c" stroke-width="3"/>'],cheese:['起司','#efcb54','<path d="M6 12h88L83 31 56 27 33 35 9 27Z"/>'],lettuce:['生菜','#80ac68','<path d="M5 21Q12 6 23 16Q34 4 45 15Q57 5 69 15Q83 6 96 21L88 31 73 26 56 34 35 27 17 32Z"/>'],tomato:['番茄','#df7962','<ellipse cx="50" cy="22" rx="43" ry="13"/><path d="M18 22h64" stroke="#f3b39a" stroke-width="4"/>'],sauce:['醬料','#b45a40','<path d="M12 23Q22 8 34 23T58 23T82 23" fill="none" stroke="#b45a40" stroke-width="9" stroke-linecap="round"/>'],top:['上麵包','#e5b56e','<path d="M7 34Q7 3 50 3T93 34Z"/><path d="M25 17l5-3m16-3 3 4m18 1 5 3" stroke="#fff0c5" stroke-width="3" stroke-linecap="round"/>'],fries:['薯條','#efc75e','<path d="M27 22V4h10v24M45 25V1h10v24M62 25V7h10v20" stroke="#e5b94e" stroke-width="9"/><path d="M20 22h60L72 65H28Z" fill="#d47c59"/><circle cx="50" cy="42" r="9" fill="#fff1c5"/>'],drink:['飲料','#a5c7b4','<path d="M55 22L64 2h13" fill="none" stroke="#638a74" stroke-width="5"/><path d="M25 22h50L68 68H32Z"/><path d="M22 22h56" stroke="#64866e" stroke-width="5"/><path d="M38 43q12 10 24 0" fill="none" stroke="#42664d" stroke-width="3"/>']};
const $=id=>document.getElementById(id);const svg=id=>`<svg data-food="${id}" viewBox="0 0 100 ${['fries','drink'].includes(id)?75:40}" aria-hidden="true" fill="${foods[id][1]}">${foods[id][2]}</svg>`;

const combos=[['burger','fries','drink'],['burger','drink'],['burger','fries'],['fries','drink'],['burger'],['burger','fries','drink']];
const burgerLayers=['bottom','beef','lettuce','top'];
let mode='easy',guests=[],selected=0,issued=0,completed=0,stars=0,tray=[],voice=true,build=[],arrival=new Set(),drag=null,suppressClick=false,lastHint='',heldMoney=null,drawerOpen=false;const goal=6;
function burgerSVG(){return '<span class="meal sprite-0" aria-hidden="true"></span>';}
function food(id){return id==='burger'?burgerSVG():'<span class="side sprite-'+(id==='fries'?1:2)+'" aria-hidden="true"></span>';}

function animal(n){return '<span class="animal sprite-'+(n%6)+'" aria-hidden="true"></span>';}
function renderQueue(){const q=$('queue');if(q.dataset.head===String(issued))return;q.dataset.head=String(issued);q.replaceChildren();for(let n=issued;n<Math.min(goal,issued+3);n++){const p=document.createElement('span');p.className='animal waiting arrive sprite-'+(n%6);p.setAttribute('aria-hidden','true');q.append(p);}}

function say(t){lastHint=t;$('message').textContent=t;if(voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.82;speechSynthesis.speak(u);}}
function feedback(icon,t){$('feedback').textContent=icon;say(t);}
function fill(i){if(issued>=goal){guests[i]=null;return;}guests[i]={serial:issued,items:combos[issued%combos.length].slice(),phase:'order'};issued++;arrival.add(i);}
function hint(){if(heldMoney)return drawerOpen?'把手裡的錢，放進打開的收銀機抽屜。':'拿到錢了！點收銀機，打開抽屜。';const g=guests[selected];if(!g)return '點一下還在等餐的客人。';return g.phase==='pay'?'客人把錢放在櫃檯上了，點錢拿起來。':'看看客人頭上的圖片。拿餐放到餐盤，再送給客人。';}
function moneySVG(){return '<span class="object sprite-5" aria-hidden="true"></span>';}
function renderCash(){const r=$('register');r.className='register-unit'+(drawerOpen?' open':'')+(heldMoney&&!drawerOpen?' await-open':'');$('open-register').setAttribute('aria-expanded',String(drawerOpen));$('deposit').disabled=!drawerOpen||!heldMoney;$('deposit').innerHTML=drawerOpen?moneySVG():'<span aria-hidden="true">•</span>';$('held').className='held-cash'+(heldMoney?' has-money':'');$('held').innerHTML=heldMoney?'<span class="hand" aria-hidden="true">🤲</span>'+moneySVG():'<span class="hand placeholder" aria-hidden="true">🤲</span>';$('register-count').textContent=String(stars);}

function render(){
$('customers').replaceChildren();$('counter').replaceChildren();$('customers').className='customers'+(mode==='easy'?' single':'');$('counter').className='counter-slots'+(mode==='easy'?' single':'');
guests.forEach((g,i)=>{if(!g)return;const host=document.createElement('div');host.className='guest'+(selected===i?' active':'')+(arrival.has(i)?' arriving':'')+(g.phase==='cash'?' cash':'');host.id='guest-'+i;host.dataset.guest=String(i);host.style.gridColumn=String(mode==='easy'?1:i+1);const bubble=document.createElement('button');bubble.className='bubble';bubble.setAttribute('aria-label',g.phase==='order'?'客人的訂單：'+g.items.map(x=>({burger:'漢堡',fries:'薯條',drink:'可樂'})[x]).join('、'):'客人已收到餐點');bubble.innerHTML=g.phase==='order'?g.items.map(food).join(''):'<span class="status-icon">😋 🛍️</span>';bubble.onclick=()=>{if(suppressClick)return;selected=i;if(g.phase==='order'&&tray.length)deliver(i);else{render();say(hint());}};host.append(bubble);const picture=document.createElement('div');picture.innerHTML=animal(g.serial);host.append(picture);$('customers').append(host);const slot=document.createElement('div');slot.id='slot-'+i;slot.className='counter-slot';slot.style.gridColumn=String(mode==='easy'?1:i+1);slot.innerHTML='<span class="slot-dot">'+(i+1)+'</span>';if(g.phase==='pay'){const cash=document.createElement('button');cash.className='money-on-counter';cash.id='money-'+i;cash.setAttribute('aria-label','拿起'+(i+1)+'號客人放在櫃檯上的錢');cash.innerHTML=moneySVG();cash.onclick=()=>collect(i);slot.append(cash);}$('counter').append(slot);});
arrival.clear();$('tray').innerHTML=tray.length?tray.map(food).join('')+'<span class="serve-arrow" aria-hidden="true">⬆</span>':'<span class="empty-tray" aria-hidden="true">🍽️</span>';$('score').textContent='⭐ '+stars;$('undo').disabled=$('clear').disabled=!tray.length;const g=guests[selected];for(const p of ['order','pay','cash'])$('step-'+p).classList.toggle('on',g?.phase===p);const next=g?.phase==='order'?g.items.find(x=>!tray.includes(x)):null;document.querySelectorAll('[data-take]').forEach(b=>b.classList.toggle('suggest',mode==='easy'&&b.dataset.take===next));renderCash();renderQueue();
}

function add(id){if(completed>=goal)return;if(!guests.some(g=>g?.phase==='order')){feedback('🪙 💰',hint());return;}if(tray.length>=4){feedback('🍽️ ↶','餐盤滿囉，先拿掉一樣。');return;}tray.push(id);render();feedback('✓',({burger:'漢堡',fries:'薯條',drink:'可樂'})[id]+'放到餐盤了。');}
function deliver(i){const g=guests[i];if(!g||g.phase!=='order'||completed>=goal)return;selected=i;if(tray.slice().sort().join()!==g.items.slice().sort().join()){render();feedback('👀 🍽️','再看看頭上的圖片，要和餐盤裡一樣喔。做錯了可以按回轉箭頭拿掉。');return;}g.phase='pay';tray=[];render();feedback('😋 🪙','餐點都對了！客人把錢放在櫃檯上了，點一下拿起來。');}
function collect(i){const g=guests[i];if(!g||g.phase!=='pay')return;if(heldMoney){feedback('🤲 → 💰','手上已經有錢了，先把這筆放進收銀機。');return;}selected=i;heldMoney={slot:i,serial:g.serial};g.phase='cash';render();feedback('🤲 🪙','拿到錢了！點收銀機，打開抽屜。');}
function openRegister(){if(drawerOpen){depositMoney();return;}if(!heldMoney){feedback('👀 🪙','先點櫃檯上的錢，把錢拿起來。');return;}drawerOpen=true;renderCash();feedback('🤲 → 💰','抽屜打開了！再點收銀機就能放錢，也可以把錢拖進去。');}
function depositMoney(){if(!heldMoney)return;if(!drawerOpen){feedback('👆 💰','先點收銀機，打開抽屜喔。');return;}const i=heldMoney.slot,g=guests[i];if(!g||g.phase!=='cash'||g.serial!==heldMoney.serial)return;heldMoney=null;drawerOpen=false;stars++;completed++;fill(i);selected=guests[i]?i:guests.findIndex(Boolean);if(completed===goal){renderCash();$('score').textContent='⭐ '+stars;$('game').hidden=true;$('finish').hidden=false;$('finish').innerHTML='<div class="big">🐰 ⭐ '+stars+' 🎉</div><button id="again" aria-label="再玩一次">↻</button>';$('again').onclick=reset;$('again').focus();feedback('👏 ⭐','六位客人都服務好了，錢也放好了！好棒的小店長。');}else{render();feedback('⭐ 🐾','錢放好了，抽屜關起來！下一位客人來囉。');}}
$('open-register').onclick=openRegister;$('deposit').onclick=depositMoney;

function assembly(){if(mode==='easy'){add('burger');return;}if(!guests.some(g=>g?.phase==='order')){say(hint());return;}build=[];$('assembly').hidden=false;drawBuild();say('照上面的圖片，一層一層做漢堡。先放下麵包。');}
function drawBuild(){$('guide').innerHTML=burgerLayers.map((id,i)=>svg(id).replace('<svg ','<svg class="'+(i===build.length?'next':'')+'" ')).join('');$('built').innerHTML=build.map(svg).join('');$('burger-done').disabled=build.join()!==burgerLayers.join();}
for(const id of ['bottom','beef','lettuce','top','cheese','tomato']){const b=document.createElement('button');b.innerHTML=svg(id);b.setAttribute('aria-label','放入'+foods[id][0]);b.onclick=()=>{if(build.length>=4)return;if(id!==burgerLayers[build.length]){feedback('👀','看看金色框框，要先放這個喔。');return;}build.push(id);drawBuild();say(build.length===4?'做好了！按勾勾放進餐盤。':'放好了，接著放'+foods[burgerLayers[build.length]][0]+'。');};$('layers').append(b);}
$('burger-undo').onclick=()=>{build.pop();drawBuild();};$('burger-done').onclick=()=>{if(build.join()!==burgerLayers.join())return;$('assembly').hidden=true;add('burger');};$('burger-close').onclick=()=>{$('assembly').hidden=true;};
function machineArt(type){return '';}
for(const id of ['fries','burger','drink']){const section=document.createElement('div');section.className='machine '+(id==='burger'?'burger-station':id==='drink'?'cola':'fries');section.innerHTML=machineArt(id);const b=document.createElement('button');b.className='take';b.dataset.take=id;b.innerHTML=food(id);b.setAttribute('aria-label','拿'+({burger:'漢堡',fries:'薯條',drink:'可樂'})[id]);b.onclick=()=>{if(!suppressClick)(id==='burger'?assembly():add(id));};bindDrag(b,{type:'food',id});section.append(b);$('equipment').append(section);}
function cancelDrag(){document.getElementById('ghost')?.remove();document.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));drag=null;}
function dropAt(x,y){const candidates=drag.type==='food'?[$('tray')]:drag.type==='money'?[$('deposit')]:Array.from(document.querySelectorAll('[data-guest]'));return candidates.find(el=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});}
function bindDrag(el,payload){el.onpointerdown=e=>{if(e.button!==0||(payload.type==='tray'&&!tray.length)||(payload.type==='money'&&!heldMoney))return;drag={...payload,x:e.clientX,y:e.clientY,pointer:e.pointerId,moved:false};el.setPointerCapture(e.pointerId);};el.onpointermove=e=>{if(!drag||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;const g=document.createElement('div');g.id='ghost';g.className='ghost';g.innerHTML=drag.type==='food'?food(drag.id):drag.type==='money'?moneySVG():'<span class="plate">🍽️</span>';document.body.append(g);}if(!drag.moved)return;e.preventDefault();$('ghost').style.left=e.clientX-52+'px';$('ghost').style.top=e.clientY-45+'px';document.querySelectorAll('.over').forEach(b=>b.classList.remove('over'));dropAt(e.clientX,e.clientY)?.classList.add('over');};el.onpointerup=e=>{if(!drag||drag.pointer!==e.pointerId)return;const d=drag;if(d.moved){suppressClick=true;const target=dropAt(e.clientX,e.clientY);if(target){if(d.type==='food'){d.id==='burger'?assembly():add(d.id);}else if(d.type==='money')depositMoney();else deliver(Number(target.dataset.guest));}setTimeout(()=>suppressClick=false,0);}cancelDrag();};el.onpointercancel=cancelDrag;}
bindDrag($('held'),{type:'money'});$('held').onclick=()=>{if(!suppressClick&&heldMoney)say(hint());};bindDrag($('tray'),{type:'tray'});$('tray').onclick=()=>{if(!suppressClick)deliver(selected);};$('tray').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();deliver(selected);}};$('undo').onclick=()=>{tray.pop();render();feedback('↶','拿掉最後一樣了。');};$('clear').onclick=()=>{tray=[];render();feedback('🍽️','餐盤空了，可以重新拿餐。');};$('read').onclick=()=>say(hint());
function reset(){cancelDrag();if('speechSynthesis'in window)speechSynthesis.cancel();selected=issued=completed=stars=0;heldMoney=null;drawerOpen=false;guests=mode==='easy'?[null]:[null,null,null];tray=[];build=[];arrival.clear();for(let i=0;i<guests.length;i++)fill(i);$('finish').hidden=true;$('game').hidden=false;$('assembly').hidden=true;render();$('feedback').textContent='🍔 🍟 🥤';lastHint=hint();$('message').textContent=lastHint;}
for(const m of ['easy','challenge'])$(m).onclick=()=>{mode=m;for(const k of ['easy','challenge']){$(k).classList.toggle('active',k===m);$(k).setAttribute('aria-pressed',String(k===m));}reset();say(hint());};$('restart').onclick=()=>{reset();say(hint());};$('voice').onclick=()=>{voice=!voice;$('voice').textContent=voice?'🔊':'🔇';$('voice').setAttribute('aria-pressed',String(voice));if(voice)say(hint());else if('speechSynthesis'in window)speechSynthesis.cancel();};document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();if('speechSynthesis'in window)speechSynthesis.cancel();}});reset();
</script></body></html>
