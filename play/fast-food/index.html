<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小森速食店｜雞爸爸遊戲間</title>
<style>
[hidden]{display:none!important}
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#354c3a;background:#faf7ef}*{box-sizing:border-box}body{margin:0}button,a{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer;border:2px solid #dce2cf;background:#fffdf8;border-radius:18px;min-height:54px;padding:10px 16px;font-weight:700}button:hover{border-color:#658b65}button:focus-visible,a:focus-visible{outline:4px solid #d77a3b;outline-offset:3px}button:disabled{opacity:.5;cursor:default}header{max-width:1160px;margin:auto;padding:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:#42664d}main{max-width:1160px;padding:0 20px 35px;margin:auto}h1{font-size:clamp(28px,4vw,44px);margin:12px 0 6px}h2{font-size:21px;margin:0 0 12px}p{line-height:1.7}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.tag{color:#8b6848;font-size:13px;letter-spacing:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.active,.primary{background:#42664d;color:white;border-color:#42664d}.score{font-size:21px;font-weight:800;background:#fff0bc;border-radius:22px;padding:12px 20px}.layout{display:grid;grid-template-columns:290px 1fr;gap:20px}.card{background:#fffdf8;border:1px solid #e2dfcd;border-radius:26px;padding:22px;box-shadow:0 8px 24px #304d3608}.customer{display:flex;align-items:center;gap:10px}.customer svg{width:80px;height:85px}.recipe{display:flex;flex-direction:column;gap:7px;margin:14px 0}.step{display:flex;align-items:center;gap:10px;border:2px solid transparent;border-radius:12px;padding:4px 8px}.step svg{width:52px;height:32px}.step.done{background:#edf3e5}.step.next{border-color:#b37a39;background:#fff2d6}.step b{font-size:14px}.station{background:#eef0e2;border-radius:22px;padding:14px;text-align:center}.tray{min-height:260px;border:3px dashed #acbb95;border-radius:22px;background:#fafbf5;display:flex;align-items:center;justify-content:center;gap:20px;padding:20px;position:relative}.tray.over{background:#fff0c7;border-color:#ba803a}.burger{display:flex;flex-direction:column-reverse;align-items:center;min-width:150px}.burger svg{width:170px;height:34px;margin-top:-3px}.burger svg[data-food=top]{height:60px}.sides svg{width:65px;height:80px}.sides{display:flex;gap:8px}.empty{color:#6f795d}.ingredients{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}.ingredient{padding:8px 4px;min-height:94px;touch-action:none;user-select:none}.ingredient svg{width:65px;height:43px;display:block;margin:auto;pointer-events:none}.ingredient span{font-size:15px}.ingredient.suggest{border:3px solid #b28138;background:#fff1cc}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}#message{min-height:58px;font-size:18px;font-weight:700;margin:14px 0 4px}.note{font-size:14px;color:#697462}.ghost{position:fixed;z-index:20;pointer-events:none;width:90px;height:70px;background:#fff3d8;border-radius:16px;box-shadow:0 5px 20px #0003;display:grid;place-items:center}.ghost svg{width:75px;height:55px}#finish{background:#fff0bc;text-align:center;border-radius:20px;padding:24px}#finish[hidden]{display:none}@media(max-width:760px){main{padding:0 12px 25px}.layout{grid-template-columns:1fr}.card{padding:16px}.recipe{flex-direction:row;flex-wrap:wrap;gap:3px}.step{gap:2px;padding:3px}.step svg{width:40px;height:24px}.step b{font-size:12px}.customer svg{width:58px;height:60px}.tray{min-height:210px}.ingredients{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.ingredient{min-height:87px}.burger svg{width:140px;height:29px}.burger svg[data-food=top]{height:48px}.sides svg{width:45px;height:65px}.top p{margin:8px 0}header{font-size:14px;padding:16px}.score{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><a href="https://beckman0470.github.io/">雞爸爸生活研究室</a><nav aria-label="遊戲導覽"><a href="https://beckman0470.github.io/rooms.html?room=games">← 回遊戲間</a> · <a href="https://beckman0470.github.io/play/">親子樂園</a></nav></header>
<main><div class="top"><div><span class="tag">LITTLE FOREST KITCHEN</span><h1>小森速食店</h1><p>幫小動物做一份好吃的餐點吧！</p></div><div class="score" id="score" aria-live="polite">⭐ 0 顆星星</div></div>
<div class="controls" role="group" aria-label="遊戲模式"><button id="easy" class="active" aria-pressed="true">簡單 · 照圖做</button><button id="challenge" aria-pressed="false">挑戰 · 套餐小主廚</button><button id="voice" aria-pressed="false">讀出提示：關</button><button id="restart">重新玩</button></div>
<div id="finish" hidden></div><div class="layout" id="game"><aside class="card"><div class="customer"><svg viewBox="0 0 100 105" aria-hidden="true"><path d="M22 40Q0 0 31 12L43 37M60 37Q72-5 89 15L78 47" fill="#e5b87b" stroke="#705a3c" stroke-width="3"/><ellipse cx="50" cy="65" rx="40" ry="34" fill="#edcb97"/><circle cx="36" cy="61" r="4" fill="#354c3a"/><circle cx="64" cy="61" r="4" fill="#354c3a"/><path d="M41 76Q50 85 59 76" fill="none" stroke="#354c3a" stroke-width="3"/><ellipse cx="24" cy="73" rx="8" ry="5" fill="#e99c83"/><ellipse cx="76" cy="73" rx="8" ry="5" fill="#e99c83"/></svg><div><h2 id="customer">小兔的點餐卡</h2><span id="round"></span></div></div><h2 id="order"></h2><div id="recipe" class="recipe" aria-label="食材順序，由第一步開始"></div><p class="note" id="modeNote"></p><button id="read">聽聽這份訂單</button></aside>
<section class="card" aria-label="料理工作臺"><h2>小主廚的料理臺</h2><div class="station"><div id="tray" class="tray" aria-label="把食材拖到這裡的餐盤"><span class="empty">把食材拖進來<br>也可以點下面的食材</span></div><div class="actions"><button id="undo">↶ 拿掉最後一樣</button><button id="clear">清空餐盤</button><button id="serve" class="primary">完成出餐 →</button><button id="next" class="primary" hidden>下一位客人 →</button></div><p id="message" role="status" aria-live="polite"></p></div><div id="ingredients" class="ingredients" aria-label="食材櫃"></div></section></div>
<p class="note">給爸爸媽媽：簡單模式適合一起認圖；挑戰模式練習順序與配對。兩種模式都沒有倒數，做錯不扣星星。可以滑動頁面；拖食材時請從按鈕中央開始。原創小兔與食材插畫，無品牌、廣告、登入或個人資料蒐集。</p></main>
<script>
(()=>{'use strict';
const foods={bottom:['下麵包','#dca05b','<path d="M9 19H91V28Q50 41 9 28Z"/>'],beef:['漢堡排','#895039','<rect x="7" y="10" width="86" height="24" rx="12"/><path d="M21 18h12m16 8h15m7-11h9" stroke="#b97d53" stroke-width="3"/>'],chicken:['雞排','#d69b35','<path d="M7 17l9-7 13 2 10-5 13 5 17-3 10 5 12 3-4 14-18 4-17-3-17 3-22-4Z"/><path d="M22 20l8 3m17-6 7 4m16 4 7-5" stroke="#f5c866" stroke-width="4"/>'],fish:['魚排','#e6b76e','<rect x="7" y="10" width="86" height="24" rx="8"/><path d="M18 18h65M20 26h61" stroke="#f9d89c" stroke-width="3"/>'],cheese:['起司','#efcb54','<path d="M6 12h88L83 31 56 27 33 35 9 27Z"/>'],lettuce:['生菜','#80ac68','<path d="M5 21Q12 6 23 16Q34 4 45 15Q57 5 69 15Q83 6 96 21L88 31 73 26 56 34 35 27 17 32Z"/>'],tomato:['番茄','#df7962','<ellipse cx="50" cy="22" rx="43" ry="13"/><path d="M18 22h64" stroke="#f3b39a" stroke-width="4"/>'],sauce:['醬料','#b45a40','<path d="M12 23Q22 8 34 23T58 23T82 23" fill="none" stroke="#b45a40" stroke-width="9" stroke-linecap="round"/>'],top:['上麵包','#e5b56e','<path d="M7 34Q7 3 50 3T93 34Z"/><path d="M25 17l5-3m16-3 3 4m18 1 5 3" stroke="#fff0c5" stroke-width="3" stroke-linecap="round"/>'],fries:['薯條','#efc75e','<path d="M27 22V4h10v24M45 25V1h10v24M62 25V7h10v20" stroke="#e5b94e" stroke-width="9"/><path d="M20 22h60L72 65H28Z" fill="#d47c59"/><circle cx="50" cy="42" r="9" fill="#fff1c5"/>'],drink:['飲料','#a5c7b4','<path d="M55 22L64 2h13" fill="none" stroke="#638a74" stroke-width="5"/><path d="M25 22h50L68 68H32Z"/><path d="M22 22h56" stroke="#64866e" stroke-width="5"/><path d="M38 43q12 10 24 0" fill="none" stroke="#42664d" stroke-width="3"/>']};
const $=id=>document.getElementById(id);const svg=id=>`<svg data-food="${id}" viewBox="0 0 100 ${['fries','drink'].includes(id)?75:40}" aria-hidden="true" fill="${foods[id][1]}">${foods[id][2]}</svg>`;
const recipes=[{name:'經典漢堡',filling:'beef'},{name:'金黃炸雞堡',filling:'chicken'},{name:'香香魚堡',filling:'fish'}];
let mode='easy',round=0,stars=0,stack=[],sides=[],recipe=[],served=false,voice=false;let dragging=null,suppressClick=false;
function say(t){if(voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.8;speechSynthesis.speak(u);}}
function message(t){$('message').textContent=t;say(t);}
function fresh(){stack=[];sides=[];served=false;const meal=recipes[round%3];recipe=['bottom',meal.filling,...(mode==='challenge'?['cheese','lettuce','tomato','sauce']:round%3===1?['lettuce']:['cheese']),'top',...(mode==='challenge'?round%2?['drink']:['fries','drink']:[])];$('order').textContent=meal.name+(mode==='challenge'?'套餐':'');$('round').textContent=`第 ${round+1} / 5 位客人`;$('customer').textContent=['小兔','小熊','小鹿','小貓','小松鼠'][round]+'的點餐卡';$('modeNote').textContent=mode==='easy'?'照著金色框框，一樣一樣放。食材放錯也能拿掉！':'漢堡要照順序；薯條、飲料放旁邊，先後都可以。';message('歡迎小主廚！先看看客人的點餐卡。');render();}
function correct(){return stack.join(',')===recipe.filter(x=>!['fries','drink'].includes(x)).join(',')&&sides.slice().sort().join(',')===recipe.filter(x=>['fries','drink'].includes(x)).sort().join(',');}
function render(){const placed=[...stack,...sides];let matched=0;while(matched<recipe.length&&placed[matched]===recipe[matched])matched++;$('recipe').innerHTML=recipe.map((id,i)=>`<div class="step ${i<matched?'done':i===matched?'next':''}"><b>${i+1}</b>${svg(id)}<span>${foods[id][0]}</span>${i<matched?' ✓':''}</div>`).join('');$('tray').innerHTML=placed.length?`<div class="burger">${stack.map(svg).join('')}</div><div class="sides">${sides.map(svg).join('')}</div>`:'<span class="empty">把食材拖進來<br>也可以點下面的食材</span>';$('score').textContent=`⭐ ${stars} 顆星星`;$('serve').hidden=served;$('next').hidden=!served;$('next').textContent=round===4?'看看我的成果 ⭐':'下一位客人 →';$('undo').disabled=$('clear').disabled=served||!placed.length;document.querySelectorAll('.ingredient').forEach(b=>{b.disabled=served;b.classList.toggle('suggest',mode==='easy'&&b.dataset.id===recipe[matched]);});}
const history=[];
function add(id){if(served)return;if(stack.length+sides.length>=14){message('餐盤滿囉，拿掉一些再試試。');return;}history.push(id);(['fries','drink'].includes(id)?sides:stack).push(id);render();message('放好了：'+foods[id][0]+'。');}
Object.keys(foods).forEach(id=>{const b=document.createElement('button');b.className='ingredient';b.dataset.id=id;b.innerHTML=svg(id)+`<span>${foods[id][0]}</span>`;b.setAttribute('aria-label','加入'+foods[id][0]);b.onclick=()=>{if(!suppressClick)add(id);};b.onpointerdown=e=>{if(b.disabled||e.button!==0)return;dragging={id,x:e.clientX,y:e.clientY,moved:false,pointer:e.pointerId,button:b};b.setPointerCapture(e.pointerId);};b.onpointermove=e=>{if(!dragging||dragging.pointer!==e.pointerId)return;if(Math.hypot(e.clientX-dragging.x,e.clientY-dragging.y)>10&&!dragging.moved){dragging.moved=true;const g=document.createElement('div');g.className='ghost';g.id='ghost';g.innerHTML=svg(id);document.body.append(g);}if(dragging.moved){e.preventDefault();$('ghost').style.left=e.clientX-45+'px';$('ghost').style.top=e.clientY-35+'px';const r=$('tray').getBoundingClientRect();$('tray').classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);}};b.onpointerup=e=>{if(!dragging||dragging.pointer!==e.pointerId)return;if(dragging.moved){suppressClick=true;const r=$('tray').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)add(id);setTimeout(()=>suppressClick=false,0);}cancelDrag();};b.onpointercancel=cancelDrag;$('ingredients').append(b);});
function cancelDrag(){document.getElementById('ghost')?.remove();$('tray').classList.remove('over');dragging=null;}
$('undo').onclick=()=>{const id=history.pop();if(id)(['fries','drink'].includes(id)?sides:stack).pop();render();message('拿掉最後一樣，再試試看！');};$('clear').onclick=()=>{stack=[];sides=[];history.length=0;render();message('餐盤清好了，重新做一份吧！');};
$('serve').onclick=()=>{if(served)return;if(correct()){served=true;stars+=mode==='easy'?1:3;render();message('謝謝！餐點完全正確，你得到'+(mode==='easy'?'一':'三')+'顆星星！');}else{const expected=recipe.filter(x=>!['fries','drink'].includes(x));const at=expected.findIndex((x,i)=>x!==stack[i]);message(at>=0?`再看看第 ${at+1} 層：需要${foods[expected[at]][0]}。可以拿掉最後一樣或清空重做。`:stack.length!==expected.length?'漢堡多了一些食材，看看點餐卡再調整。':'看看旁邊的薯條和飲料，數量要和點餐卡一樣喔！');}};
$('next').onclick=()=>{if(!served)return;round++;history.length=0;if(round===5){$('game').hidden=true;$('finish').hidden=false;$('finish').innerHTML=`<h2>小森速食店，今天大成功！</h2><p>五位客人都吃到喜歡的餐點。</p><p>⭐ 你收集了 ${stars} 顆星星！</p><button id="again" class="primary">再開店一次</button>`;$('again').onclick=reset;$('again').focus();say('五位客人都完成了，你好棒！');}else fresh();};
function reset(){cancelDrag();if('speechSynthesis'in window)speechSynthesis.cancel();round=0;stars=0;history.length=0;$('finish').hidden=true;$('game').hidden=false;fresh();}
for(const m of ['easy','challenge'])$(m).onclick=()=>{mode=m;for(const k of ['easy','challenge']){$(k).classList.toggle('active',k===m);$(k).setAttribute('aria-pressed',String(k===m));}reset();};$('restart').onclick=reset;$('voice').onclick=()=>{voice=!voice;$('voice').textContent='讀出提示：'+(voice?'開':'關');$('voice').setAttribute('aria-pressed',String(voice));if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();else say('歡迎小主廚！');};$('read').onclick=()=>{if(!('speechSynthesis'in window)){message('這個裝置不支援讀音，可以一起看圖做。');return;}const old=voice;voice=true;say($('order').textContent+'。依序放入：'+recipe.map(x=>foods[x][0]).join('、'));voice=old;};document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();if('speechSynthesis'in window)speechSynthesis.cancel();}});reset();
})();
</script></body></html>
