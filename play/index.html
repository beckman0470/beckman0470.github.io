2px auto}.answer{border:2px solid #dedfd2;border-radius:20px;background:#fff;min-height:96px;font-size:42px;color:var(--ink);transition:transform .15s,background .15s}.answer:hover{transform:translateY(-3px)}.answer.good{background:#d5ead3;border-color:#719c64}.answer.wrong{background:#ffeddb;border-color:#dda26b}.feedback{min-height:32px;font-size:18px;font-weight:700;margin:12px 0;color:var(--green)}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.primary{border:0;border-radius:14px;padding:14px 24px;background:var(--green);color:white;font-weight:750}.secondary{border:1px solid #bac9b8;border-radius:14px;padding:12px 20px;background:white;color:var(--green)}.progress{font-size:14px;color:#65715f}.stars{letter-spacing:5px;color:#986f28}.closets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:650px;margin:24px auto}.closet{border:2px solid #e1d4bd;background:#f2e5cc;border-radius:22px;min-height:160px;font-size:64px}.cat-wrap{margin:22px auto}.cat-button{background:#fff4df;border:2px solid #eddbb9;border-radius:40px;width:220px;height:200px}.cat-button svg{width:170px;height:160px}.cat-button.bounce{animation:bounce .35s}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:520px;margin:24px auto}.pad{min-height:135px;border:0;border-radius:28px;color:#343d37;font-weight:800;font-size:27px;box-shadow:0 7px 0 #00000016}.pad:nth-child(1){background:#f0c395}.pad:nth-child(2){background:#c4d6b5}.pad:nth-child(3){background:#d0c9df}.pad:nth-child(4){background:#e9d78c}.pad:active,.pad.hit{transform:translateY(5px);box-shadow:0 2px 0 #00000016}.notice{font-size:13px;color:#73796f;max-width:720px;margin:24px auto 0;text-align:center}footer{text-align:center;font-size:13px;color:#75806f;margin:30px}button:disabled{cursor:default}.round{margin:12px auto;width:min(100%,640px);height:7px;background:#e1e7dc;border-radius:9px;overflow:hidden}.round span{display:block;background:#79976c;height:100%;transition:width .2s}@keyframes bounce{50%{transform:translateY(-12px) rotate(-4deg)}}@media(max-width:600px){header{padding:18px;font-size:14px}main{padding:12px 14px 40px}.panel{padding:18px}.playbox{padding:18px 12px}.answers{grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:82px}.closets{gap:8px}.closet{min-height:120px;font-size:45px}.panel-head{gap:12px}h2{font-size:23px}.portrait{width:62px;height:76px}.tabs .tab{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.game-cat{display:block;max-width:100%;width:180px;height:170px;object-fit:contain;margin:auto;user-select:none}.closet .game-cat{width:100%;height:130px}.closet:disabled{opacity:1}.cat-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:500px}.cat-wrap .cat-button{width:100%;height:210px;margin:0!important}.cat-choice{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.cat-choice .small{font-size:18px;font-weight:700;color:#426b54}@media(max-width:600px){.cat-wrap{gap:12px}.cat-wrap .cat-button{height:170px}.game-cat{height:145px}.closet .game-cat{height:95px}}

</head><body>
<header><a class="brand" href="https://beckman0470.github.io/">雞爸爸生活研究室 <span class="small">／互動樂園</span></a><a href="https://beckman0470.github.io/">回到首頁 ↗</a></header>
<main><nav aria-label="親子與大人互動入口" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 24px"><a class="tab" href="/play/" aria-current="page" style="text-decoration:none;background:#426b54;color:white">陪孩子玩</a><a class="tab" href="/relax.html" style="text-decoration:none">換大人放風 ☕</a></nav><div class="intro"><span class="eyebrow">一起學，一起玩，一起長大</span><h1>今天，想玩什麼？</h1><p>鼠姊姊的字母小冒險，龍弟弟的貓咪小世界。<br>不用計時，慢慢玩也很棒。</p></div>
<div class="tabs" role="tablist" aria-label="選擇遊戲區"><button class="tab" role="tab" id="tab-dodo" aria-controls="panel-dodo" aria-selected="true">鼠姊姊・學習樂園</button><button class="tab" role="tab" id="tab-dragon" aria-controls="panel-dragon" aria-selected="false" tabindex="-1">龍弟弟・快樂天地</button></div>
<section class="panel" role="tabpanel" id="panel-dodo" aria-labelledby="tab-dodo"><div class="panel-head"><img class="portrait" src="https://beckman0470.github.io/assets/img/portrait-dodo.png" alt="鼠姊姊"><div><span class="eyebrow">DODO'S LITTLE CLASSROOM</span><h2>每一次嘗試，都有新發現</h2><p class="hint">看一看、找一找，找出相同的注音或字母。</p></div></div>
<div class="modes" aria-label="學習玩法"><button class="mode" data-learn="zh" aria-pressed="true">ㄅㄆㄇ 找朋友</button><button class="mode" data-learn="abc" aria-pressed="false">ABC 大小寫配對</button></div>
<div class="playbox"><div class="progress" id="progress"></div><div class="round"><span id="bar"></span></div><p class="question" id="question"></p><div class="target" id="target"></div><div class="answers" id="answers"></div><div class="feedback" id="learn-feedback" role="status" aria-live="polite"></div><div class="controls"><button class="secondary" id="speak" hidden>🔊 聽英文字母</button><button class="primary" id="next" hidden>下一題 →</button><button class="secondary" id="restart">重新開始</button></div></div></section>
<section class="panel" role="tabpanel" id="panel-dragon" aria-labelledby="tab-dragon" hidden><div class="panel-head"><img class="portrait" src="https://beckman0470.github.io/assets/img/portrait-dragon.png" alt="龍弟弟"><div><span class="eyebrow">DRAGON'S HAPPY PLACE</span><h2>貓咪，你躲在哪裡？</h2><p class="hint">大大的按鈕，點一下就有小驚喜。</p></div></div>
<div class="modes" aria-label="遊戲玩法"><button class="mode" data-toddler="hide" aria-pressed="true">📦 貓咪躲貓貓</button><button class="mode" data-toddler="pet" aria-pressed="false">🐾 摸摸貓咪</button><button class="mode" data-toddler="drum" aria-pressed="false">🥁 BANG 節奏鼓</button></div>
<div class="playbox"><div id="toddler-stage"></div><div class="feedback" id="cat-feedback" role="status" aria-live="polite"></div><div class="controls"><button class="primary" id="hide-again">再躲一次 ↻</button><button class="secondary" id="sound" aria-pressed="true">聲音：開</button></div></div></section>
<p class="notice">給爸爸媽媽：每回合 5 題，隨時可以停下來。英文字母發音使用裝置語音；注音採看字配對。節奏鼓使用合成音效。這裡不蒐集孩子姓名，也不需要登入。</p></main><footer>雞爸爸生活研究室 · 把陪伴，變成好玩的日常</footer>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let learnMode='zh',round=0,answered=false,deck=[],sound=true,audioCtx=null,catAt=0,found=false,pets=0,toddlerMode='hide';
const zh=Array.from('ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ');
const alphabet=Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
function shuffle(xs){const a=xs.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tone(kind){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const f={good:660,pet:480,kick:140,snare:310,bell:880,clap:220}[kind]||440;o.type=kind==='snare'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(kind==='kick'?45:f*.7,t+.18);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3);}catch(e){}}
function start(){round=0;deck=shuffle(learnMode==='zh'?zh:alphabet).slice(0,5);renderQuestion();}
function renderQuestion(){answered=false;$('#next').hidden=true;$('#restart').hidden=false;$('#speak').hidden=learnMode!=='abc'||!('speechSynthesis'in window);$('#learn-feedback').textContent='';$('#progress').textContent='第 '+(round+1)+' / 5 題 · 已完成 '+round+' 題';$('#bar').style.width=(round/5*100)+'%';const target=deck[round];$('#question').textContent=learnMode==='zh'?'找出和上面一樣的注音':'找出這個大寫字母的小寫朋友';$('#target').textContent=target;const pool=learnMode==='zh'?zh:alphabet;const choices=shuffle([target,...shuffle(pool.filter(x=>x!==target)).slice(0,3)]);$('#answers').replaceChildren();choices.forEach(letter=>{const b=document.createElement('button');b.className='answer';b.textContent=learnMode==='abc'?letter.toLowerCase():letter;b.setAttribute('aria-label','選擇 '+b.textContent);b.addEventListener('click',()=>{if(answered)return;if(letter===target){answered=true;b.classList.add('good');tone('good');$('#learn-feedback').textContent='找到了！你觀察得好仔細 ⭐';$$('.answer').forEach(x=>x.disabled=true);$('#next').textContent=round===4?'看看我的小星星 ⭐':'下一題 →';$('#next').hidden=false;$('#bar').style.width=((round+1)/5*100)+'%';}else{b.classList.add('wrong');b.disabled=true;$('#learn-feedback').textContent='再看一看上面的字，試試另一個。';}});$('#answers').append(b);});}
$('#next').addEventListener('click',()=>{if(!answered)return;if(round<4){round++;renderQuestion();}else{$('#question').textContent='今天的 5 題都完成了！';$('#target').textContent='好棒！';$('#answers').replaceChildren();$('#learn-feedback').textContent='⭐ ⭐ ⭐ ⭐ ⭐';$('#progress').textContent='已完成 5 / 5 題';$('#next').hidden=true;$('#speak').hidden=true;$('#restart').textContent='再玩一回合 ↻';}});
$('#restart').addEventListener('click',()=>{$('#restart').textContent='重新開始';start();});
$$('[data-learn]').forEach(b=>b.addEventListener('click',()=>{learnMode=b.dataset.learn;$$('[data-learn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#restart').textContent='重新開始';if('speechSynthesis'in window)speechSynthesis.cancel();start();}));
$('#speak').addEventListener('click',()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(deck[round]);u.lang='en-US';u.rate=.7;speechSynthesis.speak(u);});
function selectTab(name){const d=name==='dodo';$('#panel-dodo').hidden=!d;$('#panel-dragon').hidden=d;$$('[role=tab]').forEach(b=>{const active=b.id==='tab-'+name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});if('speechSynthesis'in window)speechSynthesis.cancel();}
$$('[role=tab]').forEach(b=>{b.addEventListener('click',()=>selectTab(b.id.slice(4)));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const name=e.key==='Home'?'dodo':e.key==='End'?'dragon':b.id==='tab-dodo'?'dragon':'dodo';selectTab(name);$('#tab-'+name).focus();}});});
function catPicture(orange,pose){return '<img class="game-cat" src="/cat-'+(orange?'youyou':'yahoo')+'-'+pose+'.png?v=20261105-art1" alt="'+(orange?'右右':'雅虎')+'" width="180" height="180" draggable="false">';}
function renderToddler(){const stage=$('#toddler-stage');stage.replaceChildren();$('#cat-feedback').textContent='';$('#hide-again').hidden=toddlerMode!=='hide';if(toddlerMode==='hide'){catAt=Math.floor(Math.random()*3);found=false;const hiddenOrange=Math.random()<.5;const hiddenName=hiddenOrange?'右右':'雅虎';const p=document.createElement('p');p.className='question';p.textContent='貓咪躲進箱子裡了，打開看看！';const row=document.createElement('div');row.className='closets';for(let i=0;i<3;i++){const b=document.createElement('button');b.className='closet';b.textContent='📦';b.setAttribute('aria-label','打開第 '+(i+1)+' 個箱子');b.addEventListener('click',()=>{if(found)return;if(i===catAt){found=true;b.innerHTML=catPicture(hiddenOrange,'peek');b.setAttribute('aria-label','找到'+hiddenName+'了');$('#cat-feedback').textContent=hiddenName+'：喵～你找到我了！';tone('pet');row.querySelectorAll('button').forEach(x=>x.disabled=true);}else{b.textContent='🐾';b.disabled=true;$('#cat-feedback').textContent='這裡有小腳印，找找其他箱子！';}});row.append(b);}stage.append(p,row);}else if(toddlerMode==='pet'){pets=0;const p=document.createElement('p');p.className='question';p.textContent='輕輕摸摸貓咪，聽牠開心的聲音。';const row=document.createElement('div');row.className='cat-wrap';['雅虎','右右'].forEach((name,i)=>{const b=document.createElement('button');b.className='cat-button';b.style.margin='8px';b.innerHTML=catPicture(i===1,i===1?'sleep':'peek');b.setAttribute('aria-label','摸摸'+name);b.addEventListener('click',()=>{pets++;b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');tone('pet');$('#cat-feedback').textContent=name+'：'+['喵～謝謝你陪我！','呼嚕呼嚕，好舒服！','再陪我玩一下嘛～'][pets%3];});const choice=document.createElement('div');choice.className='cat-choice';const label=document.createElement('span');label.className='small';label.textContent=name;choice.append(b,label);row.append(choice);});stage.append(p,row);}else{const p=document.createElement('p');p.className='question';p.textContent='點一下、拍一下，打出你自己的節奏！';const row=document.createElement('div');row.className='pads';[['咚！','kick'],['啪！','snare'],['叮！','bell'],['砰！','clap']].forEach(([label,key])=>{const b=document.createElement('button');b.className='pad';b.textContent=label;b.addEventListener('click',()=>{tone(key);$('#cat-feedback').textContent=label+' 你的節奏真好聽！';});row.append(b);});stage.append(p,row);}}
$$('[data-toddler]').forEach(b=>b.addEventListener('click',()=>{toddlerMode=b.dataset.toddler;$$('[data-toddler]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderToddler();}));
$('#hide-again').addEventListener('click',renderToddler);$('#sound').addEventListener('click',()=>{sound=!sound;$('#sound').textContent='聲音：'+(sound?'開':'關');$('#sound').setAttribute('aria-pressed',String(sound));});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel();});
start();renderToddler();
</script></body></html>
