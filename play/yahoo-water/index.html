<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#89d9ca"><title>雅虎喝水｜雞爸爸生活研究室</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#24424c;background:#f8fbf5}*{box-sizing:border-box}body{margin:0}button{cursor:pointer;font:inherit}button:focus-visible{outline:4px solid #ffbf55;outline-offset:3px}button:disabled{cursor:default;opacity:.5}[hidden]{display:none!important}
.wrap{max-width:1110px;margin:16px auto 28px;padding:0 14px}.shell{background:#fff;border:4px solid #e7f8f1;border-radius:28px;overflow:hidden;box-shadow:0 16px 42px #6e9f922c}.banner{padding:18px 23px;background:linear-gradient(110deg,#6dd6cf 0%,#b7eebc 53%,#f3b5d4 100%);display:flex;align-items:center;justify-content:space-between;gap:10px}.banner h1{color:white;text-shadow:0 2px 6px #317b87a8;margin:0;font-size:clamp(26px,4vw,39px);letter-spacing:1px}.banner p{margin:3px 0 0;font-weight:750;color:#315957}.stars{background:#fffdf5;border:3px solid #ffe9b7;border-radius:22px;font-size:22px;color:#d88624;padding:9px 15px;font-weight:900;white-space:nowrap}.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:13px 18px}.back{color:#397b71;text-decoration:none;font-size:14px;font-weight:700}.speak,.again{border:0;background:#ec5b9d;color:white;border-radius:999px;padding:10px 15px;font-weight:800;box-shadow:0 4px #b93977}.track{display:flex;gap:8px;padding:0 18px 10px}.track i{height:10px;border-radius:99px;background:#dfe9e7;flex:1}.track i.now{background:#ffbf5f}.track i.done{background:#77cead}.mission{background:#f2fbf8;border:2px solid #d5efe6;border-radius:20px;margin:0 16px 12px;padding:12px 18px;display:flex;align-items:center;gap:12px}.mission b{font-size:clamp(18px,2.5vw,25px);flex:1}.stage{position:relative;margin:0 16px;border:5px solid #fff;border-radius:24px;aspect-ratio:1.8;background:#d5f6e9 url('/assets/yahoo-water/cozy-kitchen.webp') center 45%/cover;overflow:hidden;isolation:isolate;touch-action:none;box-shadow:0 4px 18px #3a737321}.stage:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#ffffff08 15%,#e5f4dc00 47%,#fffce77f 100%);pointer-events:none}.cat{position:absolute;left:5%;bottom:9%;height:57%;width:43%;object-fit:contain;object-position:center bottom;z-index:4;filter:drop-shadow(0 12px 8px #6f5b4436);transition:transform .6s ease;user-select:none;-webkit-user-drag:none;pointer-events:none}.cat.near{transform:translateX(24%) translateY(6%) scale(.96)}.cat.drink{animation:sip .58s ease-in-out infinite}.cat.purr{animation:purr .3s ease-in-out 4}.bowl{position:absolute;width:31%;height:24%;bottom:11%;left:60%;border-radius:50%;border:9px solid #e4f3f9;box-shadow:inset 0 -16px 25px #558cab75,0 13px 0 #8bb4c0,0 18px 18px #364d443d;background:radial-gradient(ellipse at 45% 60%,#7fc4d6 0%,#a5deed 40%,#e6faff 64%);z-index:5;transform:perspective(160px) rotateX(15deg);transition:box-shadow .4s}.bowl{background-image:url("/assets/yahoo-water/icons/bowl-empty.png");background-size:100% 100%;background-repeat:no-repeat;background-position:center;border:0;border-radius:28%;box-shadow:0 12px 15px #364d443d;transform:none;height:28%;bottom:10%}.bowl.dirty{background-image:url("/assets/yahoo-water/icons/bowl-empty.png")}.bowl.wet{background-image:url("/assets/yahoo-water/icons/bowl-full.png")}.bowl button{position:absolute;inset:0;border:0;background:transparent;width:100%;height:100%;border-radius:50%;color:#6b5640;font-size:38px;touch-action:none}.bowl .dirt{position:absolute;border-radius:50%;width:14%;height:22%;background:#b48a54aa;box-shadow:inset 1px 2px 4px #795f40;pointer-events:none;transition:opacity .2s}.bowl .bubbles{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 20% 40%,#fff 0 5%,transparent 6%),radial-gradient(circle at 55% 55%,#fff 0 9%,transparent 10%),radial-gradient(circle at 68% 23%,#effaff 0 10%,transparent 11%),radial-gradient(circle at 41% 26%,#defcff 0 12%,transparent 13%);pointer-events:none}.bowl .water{opacity:.23;position:absolute;inset:10%;border-radius:50%;background:linear-gradient(80deg,#9fe9fcdd,#e3ffff80);transform:scaleY(0);transition:transform .7s;pointer-events:none}.bowl.full .water{transform:scaleY(1)}.jug{position:absolute;bottom:8%;right:2%;width:15%;z-index:7;filter:drop-shadow(0 8px 4px #3d5f5a45);cursor:grab;touch-action:none;user-select:none;transition:transform .3s}.premium-jug{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 7px 5px #64838444)}.tool .premium-icon{height:60px;width:80px;object-fit:contain;display:block;flex-shrink:0}.jug.pouring{transform:rotate(-35deg) translate(-35px,-20px)}.jug.locked{opacity:.3;pointer-events:none}.hand{position:absolute;left:75%;top:35%;font-size:46px;z-index:8;pointer-events:none;animation:hand 1s ease-in-out infinite}.drop{position:absolute;z-index:9;pointer-events:none;font-size:27px;animation:fall 1s ease forwards}.happy{position:absolute;top:18%;left:29%;font-size:32px;z-index:8;pointer-events:none;animation:float 1.8s ease-out forwards}.tools{display:flex;gap:10px;align-items:stretch;justify-content:center;padding:14px 16px 9px;flex-wrap:wrap}.tool{border:3px solid #d4e9e5;background:#f9fdf9;border-radius:19px;padding:10px 15px;min-width:140px;min-height:99px;color:#285d67;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;box-shadow:0 5px 0 #cfe5db}.tool span{font-size:34px}.tool.active{border-color:#ffb85c;background:#fff4d4;transform:translateY(3px);box-shadow:0 2px 0 #e5c7a1}.tool:disabled{filter:grayscale(.6)}.hint{font-weight:700;text-align:center;margin:6px 15px 12px;min-height:26px;color:#387475}.footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 15px 18px;flex-wrap:wrap}.continue{border:0;border-radius:16px;background:#62bfb0;color:#fff;padding:13px 24px;font-weight:900;font-size:18px;box-shadow:0 5px 0 #328c82}.continue:disabled{background:#c6d9da;box-shadow:none}.again{background:#fff;border:2px solid #b6d9d8;color:#34796d;box-shadow:none}.confetti{position:absolute;inset:0;pointer-events:none;z-index:12}.confetti b{position:absolute;animation:float 1.6s ease-out forwards;font-size:27px}@keyframes sip{50%{transform:translateX(24%) translateY(9%) rotate(-3deg) scale(.96)}}@keyframes purr{50%{transform:translateY(-4px) rotate(2deg)}}@keyframes hand{50%{transform:translate(-12px,9px)}}@keyframes fall{to{transform:translateY(120px);opacity:0}}@keyframes float{to{transform:translateY(-75px);opacity:0}}@media(max-width:650px){.wrap{padding:0;margin:0}.shell{border-radius:0;border-width:0}.stage{aspect-ratio:1.1;background-position:55% center}.cat{left:0;bottom:16%;width:56%;height:52%}.cat.near{transform:translateX(17%) translateY(5%) scale(.94)}.bowl{width:43%;height:19%;left:54%;bottom:14%;border-width:6px}.jug{bottom:4%;right:1%;width:23%}.tools{gap:7px;padding:12px 8px}.tool{min-width:0;flex:1;font-size:13px;padding:8px 4px}.tool .premium-icon{width:58px;height:51px}.mission{padding:9px 12px;margin:0 8px 10px}.stage{margin:0 7px}.banner{padding:13px 12px}.banner p{font-size:12px}.stars{font-size:16px;padding:6px}.track{padding:0 8px 9px}.top{padding:10px}.speak{padding:9px}.premium-jug{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 7px 5px #64838444)}.tool .premium-icon{height:60px;width:80px;object-fit:contain;display:block;flex-shrink:0}.jug.pouring{transform:rotate(-30deg) translate(-30px,-15px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="shell"><header class="banner"><div><h1>雅虎的喝水小天地</h1><p>照顧雅虎・換水・玩一會兒</p></div><div id="score" class="stars">★ 0 / 4</div></header><div class="top"><a class="back" href="/rooms.html?room=dining">← 回到餐廳</a><button class="speak" id="speak" type="button">🔊 聽任務</button></div><div class="track" id="track"></div><div class="mission"><b id="mission">把水碗整理乾淨</b></div><section class="stage" id="stage" aria-label="雅虎的居家喝水互動區"><img id="cat" class="cat" alt="雅虎，黑白花貓" src="/cat-yahoo-peek.png"><div class="bowl dirty" id="bowl" aria-label="雅虎的水碗"><div id="water" class="water"></div><div id="bubbles" class="bubbles" hidden></div><div id="dirt"></div><button id="plate" type="button" aria-label="清潔雅虎的水碗">&nbsp;</button></div><div class="jug" id="jug" role="button" tabindex="0" aria-label="拿水壺倒乾淨水"><img src="/assets/yahoo-water/icons/water-jug.png" class="premium-jug" alt=""></div><div id="effects" class="confetti"></div></section><div class="tools" id="tools"></div><p class="hint" id="hint" role="status" aria-live="polite"></p><div class="footer"><button id="next" class="continue" disabled type="button">下一關 ▶</button><button id="restart" class="again" type="button">重新照顧 ↻</button></div></div></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const steps=[{title:'先把水碗刷乾淨',hint:'選海綿，再在水碗上來回刷刷刷！',speak:'雅虎的水碗髒髒的。先拿海綿，在碗上刷一刷吧。'},{title:'幫雅虎倒新鮮的水',hint:'按住小水壺，移到碗上，放手倒水。也可以直接點水壺。',speak:'水碗乾淨了！拿起小水壺，倒入新鮮的水。'},{title:'搖一搖逗貓棒',hint:'點逗貓棒三次，讓雅虎開心走到水碗旁。',speak:'雅虎還在看風景，拿逗貓棒輕輕搖一搖，叫牠過來吧。'},{title:'陪雅虎喝水',hint:'輕輕點雅虎或水碗三次，看牠低頭喝水。',speak:'雅虎走過來了！輕輕點水碗，陪雅虎喝幾口水。'}];
const state={step:0,score:0,scrubs:0,feather:0,sips:0,sponged:false,finished:false};const stage=$('#stage'),bowl=$('#bowl'),cat=$('#cat'),plate=$('#plate'),jug=$('#jug'),hint=$('#hint'),next=$('#next'),effects=$('#effects');const dirt=$('#dirt');let pointerActive=false,sponges=0;
const voices=()=>('speechSynthesis'in window)?speechSynthesis.getVoices():[];function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=1.03;u.pitch=1.2;const v=voices().find(v=>/zh[-_]TW/i.test(v.lang))||voices().find(v=>/zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}function pop(symbol,x,y){const z=document.createElement('b');z.textContent=symbol;z.style.cssText='left:'+x+'%;top:'+y+'%';effects.append(z);setTimeout(()=>z.remove(),1700);}function song(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(530,now);o.frequency.exponentialRampToValueAtTime(760,now+.17);g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.32);o.start();o.stop(now+.33);setTimeout(()=>ctx.close(),650);}catch(_){}}
function tools(){const box=$('#tools');box.replaceChildren();const acts=state.step===0?[['sponge','海綿',()=>{state.sponged=true;box.querySelector('button')?.classList.add('active');hint.textContent='準備好了！請在水碗上來回擦。';}]]:state.step===1?[['water-jug','水壺',pour]]:state.step===2?[['cat-wand','逗貓棒',feather]]:[['bowl-full','雅虎喝水',sip]];for(const [icon,label,action] of acts){const b=document.createElement('button');b.className='tool';b.type='button';b.innerHTML='<img class="premium-icon" src="/assets/yahoo-water/icons/'+icon+'.png" alt="" aria-hidden="true">'+label;b.addEventListener('click',action);box.append(b);}}
function mark(){state.score=Math.max(state.score,state.step+1);$('#score').textContent='★ '+state.score+' / 4';next.disabled=false;next.textContent=state.step===3?'領取四顆星 ★':'下一關 ▶';song();for(let i=0;i<7;i++)setTimeout(()=>pop(['✨','⭐','💛','💧'][i%4],20+Math.random()*66,30+Math.random()*40),i*100);}
function scrub(e){if(state.step!==0||!state.sponged||state.scrubs>=6)return;state.scrubs++;const n=state.scrubs;dirt.querySelectorAll('.dirt').forEach((el,i)=>{if(i<n)el.style.opacity='0'});hint.textContent='刷乾淨 '+Math.min(100,Math.round(n/6*100))+'%';if(n>=6){bowl.classList.remove('dirty');hint.textContent='水碗亮晶晶！準備換新鮮水。';mark();}}
function pour(){if(state.step!==1||!next.disabled)return;jug.classList.add('pouring');jug.classList.add('locked');bowl.classList.add('wet','full');for(let i=0;i<7;i++)setTimeout(()=>pop('💧',70+Math.random()*13,35+Math.random()*26),i*85);setTimeout(()=>{hint.textContent='新鮮的水倒好了！';mark();},1000)}
function feather(){if(state.step!==2||state.feather>=3)return;state.feather++;pop('💛',22+Math.random()*26,32+Math.random()*30);cat.classList.remove('purr');void cat.offsetWidth;cat.classList.add('purr');hint.textContent='雅虎：喵～ '+state.feather+' / 3';if(state.feather>=3){cat.classList.add('near');setTimeout(()=>{hint.textContent='雅虎走過來了！';mark()},500)}}
function sip(){if(state.step!==3||state.sips>=3)return;state.sips++;cat.classList.add('drink');hint.textContent='雅虎正在喝水～ '+state.sips+' / 3';pop('💧',61+Math.random()*20,47);if(state.sips>=3){setTimeout(()=>{cat.classList.remove('drink');cat.src='/cat-yahoo-sleep.png';hint.textContent='喝飽水的雅虎好開心！';mark()},1100)}}
function paint(){state.finished=false;const st=steps[state.step];$('#mission').textContent=st.title;hint.textContent=st.hint;$('#track').innerHTML=steps.map((_,i)=>'<i class="'+(i<state.step?'done':i===state.step?'now':'')+'"></i>').join('');next.disabled=true;next.textContent='下一關 ▶';jug.hidden=state.step!==1;cat.classList.toggle('near',state.step>=3||state.feather>=3);bowl.classList.toggle('full',state.step>=2);bowl.classList.toggle('wet',state.step>=2);bowl.classList.toggle('dirty',state.step===0);$('#bubbles').hidden=true;tools();if(state.step===0){dirt.innerHTML='';for(let i=0;i<6;i++){const dot=document.createElement('i');dot.className='dirt';dot.style.left=(8+i%3*29)+'%';dot.style.top=(16+Math.floor(i/3)*42)+'%';dirt.append(dot)}state.scrubs=0;state.sponged=false;}else dirt.innerHTML='';}
let fromJug=false; jug.addEventListener('pointerdown',e=>{if(state.step!==1)return;fromJug=true;try{jug.setPointerCapture(e.pointerId)}catch(_){}});jug.addEventListener('pointerup',e=>{if(fromJug&&state.step===1)pour();fromJug=false});jug.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pour()}});
plate.addEventListener('pointerdown',e=>{pointerActive=true;plate.setPointerCapture(e.pointerId);if(state.step===0)scrub();else if(state.step===3)sip()});plate.addEventListener('pointermove',e=>{if(pointerActive&&state.step===0)scrub()});plate.addEventListener('pointerup',()=>pointerActive=false);plate.addEventListener('click',()=>{if(state.step===0)scrub();else if(state.step===3)sip()});cat.addEventListener('click',sip);$('#speak').addEventListener('click',()=>speak(steps[state.step].speak));
next.addEventListener('click',()=>{if(next.disabled)return;if(state.step===3){state.finished=true;$('#mission').textContent='雅虎喝飽水了！';hint.textContent='今天照顧得真棒！雅虎送你四顆星 ⭐⭐⭐⭐';$('#track').innerHTML=steps.map(()=>'<i class="done"></i>').join('');next.disabled=true;next.textContent='太棒了！';speak('太棒了，雅虎喝飽水了，謝謝你用心照顧牠！');}else{state.step++;paint();speak(steps[state.step].speak)}});$('#restart').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();Object.assign(state,{step:0,score:0,scrubs:0,feather:0,sips:0,sponged:false,finished:false});jug.classList.remove('locked','pouring');cat.src='/cat-yahoo-peek.png';$('#score').textContent='★ 0 / 4';paint()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});paint();
})();
</script></body></html>
