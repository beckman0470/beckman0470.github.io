<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鼠姊姊幫龍弟弟洗澡｜雞爸爸生活研究室</title>
<meta name="theme-color" content="#9adbd3">
<style>
:root{--ink:#23555c;--teal:#258b95;--pink:#e85c9a;--gold:#f9bb46;--edge:#d9eff1;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:var(--ink);background:#f2faf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 8%,#fff6df 0,transparent 30%),linear-gradient(135deg,#e8fff8,#fff4f9 65%,#fdf0da)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #ffc94b;outline-offset:3px}button:disabled{cursor:default}header{display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto;padding:16px 22px;gap:12px}header a{font-weight:900;text-decoration:none;color:#23656f}main{max-width:1120px;margin:auto;padding:0 18px 36px}.game{border:5px solid #e4ffff;background:#ffffffdd;box-shadow:0 18px 65px #4c969d25,0 3px 14px #82bbbb22;border-radius:32px;overflow:hidden}.hero{background:linear-gradient(110deg,#61c7cd,#a7eadb 54%,#f2aed2);padding:20px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{margin:0;color:white;font-size:clamp(22px,4vw,38px);line-height:1.3;text-shadow:0 3px 2px #287f9980}.hero p{margin:6px 0 0;color:#125f6c;font-weight:850}.stars{flex-shrink:0;background:#fffaf1;color:#cc7a14;border-radius:24px;padding:12px 16px;font-size:20px;font-weight:1000;box-shadow:0 4px 0 #ecc5ac}.steps{display:flex;gap:8px;padding:16px 18px 4px;justify-content:center}.step{flex:1;max-width:130px;height:12px;background:#e0e9eb;border-radius:99px}.step.done{background:#64cbbb}.step.now{background:#ffbd5f;box-shadow:0 0 0 3px #ffe8aa}.question{margin:16px 18px;background:#f1faf7;border:2px solid #d0eeea;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px}.question p{font-size:clamp(19px,2.4vw,26px);font-weight:900;margin:0}.question small{display:block;color:#4b9299;font-size:14px;margin-bottom:5px}.speak{background:var(--pink);color:white;font-weight:950;border:0;border-radius:999px;min-height:56px;padding:12px 20px;box-shadow:0 5px 0 #bf3c79;white-space:nowrap}.body{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:4px 20px 20px;align-items:stretch}.scene{position:relative;background:linear-gradient(#d9f5f4,#fff);border-radius:24px;overflow:hidden;min-height:320px;border:3px solid #c7e9e8;box-shadow:inset 0 0 0 4px white}.scene img{display:block;width:100%;height:100%;min-height:320px;object-fit:cover}.scene .tap-surface{position:absolute;inset:0;border:none;background:transparent;cursor:pointer;width:100%}.scene .tap-surface:disabled{cursor:default}.scene .scene-tag{position:absolute;left:12px;bottom:12px;background:#ffffffd9;backdrop-filter:blur(8px);border:2px solid white;border-radius:16px;padding:8px 12px;font-weight:900;pointer-events:none}.scene .float{position:absolute;inset:auto auto 27% 48%;border-radius:100%;width:40px;height:40px;border:3px solid #e2fdffb5;background:#bdedf799;opacity:0;pointer-events:none;animation:bubble 1.2s ease-out forwards;box-shadow:inset -8px -8px 9px #ffffff9e}.scene .float:nth-child(even){left:55%;width:28px;height:28px;animation-delay:.1s}@keyframes bubble{0%{opacity:0;transform:translateY(20px) scale(.4)}15%{opacity:.92}100%{opacity:0;transform:translateY(-160px) scale(1.2)}}.right{display:flex;flex-direction:column;gap:10px;min-width:0}.instruction{font-weight:850;color:#366e70;font-size:18px;padding:4px 2px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1}.pick{border:4px solid white;outline:2px solid #cfe8e8;border-radius:22px;background:#fff;overflow:hidden;position:relative;box-shadow:0 8px 16px #468e8e16;transition:transform .2s ease,box-shadow .2s ease;min-height:170px;padding:0}.pick img{display:block;width:100%;height:100%;max-height:230px;object-fit:cover}.pick:hover{transform:translateY(-4px);box-shadow:0 11px 20px #468e8e40}.pick.correct{outline:6px solid #45c78a;transform:scale(1.025)}.pick.wrong{outline:5px solid #eca4aa;animation:shake .25s linear 1}@keyframes shake{0%,100%{transform:translateX(0)}40%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.pick .tick{position:absolute;right:8px;top:8px;border-radius:50%;background:#20b875;color:#fff;font-size:23px;width:37px;height:37px;display:grid;place-items:center;font-weight:1000}.pick .number{position:absolute;bottom:8px;left:8px;background:#ffffffe3;color:#357a83;border-radius:12px;min-width:28px;padding:4px 8px;font-size:15px;font-weight:900}.feedback{border-radius:18px;background:#fff7e6;padding:15px 18px;color:#945a1c;min-height:60px;font-size:18px;font-weight:800;line-height:1.55}.feedback.good{background:#e2f9e9;color:#196f4d}.actions{display:flex;gap:10px;flex-wrap:wrap}.action{flex:1;min-height:58px;border:0;border-radius:18px;background:#2b9ca1;color:white;font-weight:950;font-size:18px;box-shadow:0 5px 0 #1c6e78}.action.alt{background:#ffbf62;color:#6b441a;box-shadow:0 5px 0 #da984c}.action:disabled{opacity:.45;box-shadow:none}.dots{display:flex;gap:5px;justify-content:center;margin:0}.dots span{width:28px;height:12px;background:#d3e2e4;border-radius:99px}.dots span.filled{background:#f1ad4d}.done-screen{text-align:center;padding:28px 16px 38px}.done-screen h2{font-size:clamp(25px,5vw,42px);color:#ce4986}.done-screen img{width:min(500px,95%);border-radius:24px;box-shadow:0 12px 30px #75c1ae40}.small-note{padding:0 20px 18px;color:#7b8883;font-size:13px;line-height:1.7}.hidden{display:none!important}@media(max-width:800px){.body{grid-template-columns:1fr}.scene{min-height:auto}.scene img{height:auto;min-height:0;aspect-ratio:1}.options{min-height:185px}.pick{min-height:165px}.pick img{max-height:215px}.hero{padding:14px}.question{margin:12px}.body{padding:4px 12px 16px}.question p{font-size:20px}}@media(max-width:460px){.hero h1{font-size:22px}.hero p{font-size:13px}.stars{font-size:15px;padding:8px}.speak{font-size:15px;padding:10px 14px}.question{padding:10px}.pick{min-height:115px;border-radius:14px}.pick img{height:130px;max-height:130px}.options{gap:6px}.instruction{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style></head><body>
<header><a href="/rooms.html?room=bathroom">〈 回浴室</a><a href="/play/?area=dragon">龍弟弟快樂天地</a></header>
<main><section class="game"><div class="hero"><div><h1>鼠姊姊幫龍弟弟洗澡</h1><p>看圖片、聽聲音、一起完成洗澡任務</p></div><div class="stars" id="score">★ 0 / 6</div></div><div class="steps" id="progress" aria-label="六個關卡進度"></div>
<div class="question" id="question"><div><small id="round-name">第一關</small><p id="question-text">先聽聽鼠姊姊的問題吧！</p></div><button type="button" class="speak" id="listen" aria-label="聽老師朗讀題目">🔊 聽題目</button></div>
<div class="body" id="main-area"><div class="scene"><img id="scene-image" src="/assets/bath-family/step-1.webp" alt="鼠姊姊與龍弟弟的洗澡情境圖"><button id="scene-tap" type="button" class="tap-surface" aria-label="點選畫面完成洗澡動作" disabled></button><div class="scene-tag" id="scene-tag">看圖選下一步</div></div><div class="right"><div id="instruction" class="instruction">哪一張圖片是正確的呢？</div><div class="options" id="choices" aria-label="三張情境圖片選項"></div><div id="feedback" class="feedback" role="status" aria-live="polite">聽完題目，點選正確的圖片。</div><div id="dots" class="dots" aria-label="互動進度"></div><div class="actions"><button type="button" id="next" class="action" disabled>繼續下一關 ▶</button><button type="button" id="retry" class="action alt">從頭玩 ↻</button></div></div></div>
<div class="done-screen hidden" id="finished"><h2>太棒了！龍弟弟洗得香噴噴！</h2><img src="/assets/bath-family/step-6.webp" alt="鼠姊姊和龍弟弟完成洗澡任務，非常開心"><p>完成六個洗澡任務，獲得六顆星！</p><button class="action" id="play-again" type="button">再玩一次 ▶</button></div><div class="small-note">兒童生活練習遊戲。真實洗澡請由成人全程陪同，先確認水溫及防滑安全，勿讓幼兒獨自用水或使用浴缸。</div></section></main>
<script>
(()=>{'use strict';
const base='/assets/bath-family/';const $=id=>document.getElementById(id);
const rounds=[
 {title:'準備洗澡',question:'龍弟弟要洗澡了，第一件事要做什麼呢？',correct:0,choices:[0,4,5],scene:0,tip:'先請大人放好溫水，檢查水溫，小朋友洗澡才安全。',action:'點一點浴缸，確認水溫剛剛好。'},
 {title:'沖濕身體',question:'水溫剛剛好！接下來，鼠姊姊要幫龍弟弟做什麼？',correct:1,choices:[1,4,2],scene:1,tip:'先把身體輕輕沖濕，大人要幫忙拿蓮蓬頭。',action:'點一點畫面，幫龍弟弟輕輕沖水。'},
 {title:'搓泡泡',question:'現在身體濕濕了，要用什麼把身體洗乾淨？',correct:2,choices:[3,2,5],scene:2,tip:'用溫和的清潔用品，輕輕搓出泡泡。',action:'點一點泡泡，幫龍弟弟洗香香。'},
 {title:'沖掉泡泡',question:'洗出好多泡泡了！現在要做什麼呢？',correct:3,choices:[4,3,0],scene:3,tip:'把泡泡沖乾淨，眼睛和耳朵要小心。',action:'再點三下，把泡泡輕輕沖乾淨。'},
 {title:'擦乾身體',question:'龍弟弟洗乾淨了，接下來要用什麼擦乾？',correct:4,choices:[4,1,2],scene:4,tip:'用柔軟的毛巾輕輕擦乾，記得保暖。',action:'點一點毛巾，幫龍弟弟擦乾身體。'},
 {title:'穿好衣服',question:'擦乾乾以後，還有什麼重要的事呢？',correct:5,choices:[5,0,3],scene:5,tip:'穿上乾淨舒適的衣服，這樣就完成囉。',action:'點一點龍弟弟，幫他穿好衣服。'}
];
let idx=0,phase='pick',selected=null,taps=0;const img=i=>base+'step-'+(i+1)+'.webp';
function playVoice(text){if(!('speechSynthesis' in window))return;$('listen').disabled=true;const synth=window.speechSynthesis; synth.cancel();let count=0;function speak(){const voices=synth.getVoices();const tw=voices.filter(v=>/^zh[-_]TW$/i.test(v.lang));if(!tw.length&&count++<8){setTimeout(speak,200);return;}if(!tw.length){$('feedback').textContent='請在裝置安裝台灣國語語音，再按「聽題目」。';$('listen').disabled=false;return;}let voice=tw.find(v=>/female|hsiao|xiaoxiao|美|雅|佳|婷|曉/i.test(v.name))||tw[0];const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.voice=voice;u.rate=1.08;u.pitch=1.17;u.onend=u.onerror=()=>{$('listen').disabled=false};synth.speak(u);}speak();}
function bubbles(){const s=document.querySelector('.scene');for(let j=0;j<4;j++){const b=document.createElement('span');b.className='float';b.style.left=(20+Math.random()*60)+'%';b.style.bottom=(20+Math.random()*30)+'%';s.append(b);setTimeout(()=>b.remove(),1400);}}
function paint(){const r=rounds[idx];phase='pick';taps=0;selected=null;$('round-name').textContent='第 '+(idx+1)+' / 6 關 · '+r.title;$('question-text').textContent=r.question;$('scene-image').src=img(r.scene);$('scene-image').alt=r.title+'：鼠姊姊和龍弟弟在浴室';$('scene-tag').textContent='先選圖卡';$('scene-tap').disabled=true;$('instruction').textContent='看一看，下一步是哪一張圖？';$('feedback').className='feedback';$('feedback').textContent='點一張圖片，幫鼠姊姊選擇。';$('next').disabled=true;$('choices').replaceChildren();$('dots').replaceChildren();$('score').textContent='★ '+idx+' / 6';$('progress').replaceChildren();rounds.forEach((_,i)=>{const el=document.createElement('span');el.className='step'+(i<idx?' done':i===idx?' now':'');$('progress').append(el)});r.choices.forEach((item,n)=>{const btn=document.createElement('button');btn.type='button';btn.className='pick';btn.setAttribute('aria-label','選項 '+(n+1)+'：'+rounds[item].title);const pic=document.createElement('img');pic.src=img(item);pic.alt=rounds[item].title;const label=document.createElement('span');label.className='number';label.textContent=n+1;btn.append(pic,label);btn.onclick=()=>choose(item,btn);$('choices').append(btn)});}
function choose(item,btn){if(phase!=='pick')return;const r=rounds[idx];if(item!==r.correct){btn.classList.add('wrong');$('feedback').className='feedback';$('feedback').textContent='再看一看，找找鼠姊姊現在該做的事情。';return;}
phase='action';selected=item;btn.classList.add('correct');const mark=document.createElement('span');mark.className='tick';mark.textContent='✓';btn.append(mark);[...$('choices').children].forEach(b=>b.disabled=true);$('instruction').textContent=r.action;$('feedback').className='feedback good';$('feedback').textContent='選對了！ '+r.tip;$('scene-tag').textContent='點三下完成動作';$('scene-tap').disabled=false;for(let i=0;i<3;i++){const dot=document.createElement('span');$('dots').append(dot)};playVoice(r.tip);}
$('scene-tap').onclick=()=>{if(phase!=='action')return;taps++;bubbles();[...$('dots').children].forEach((e,i)=>e.classList.toggle('filled',i<taps));if(taps>=3){phase='done';$('scene-tap').disabled=true;$('scene-tag').textContent='完成！';$('feedback').textContent='好棒！'+rounds[idx].title+'完成！';$('next').disabled=false;playVoice('太棒了！'+rounds[idx].title+'完成！');}}
function finish(){synthCancel();$('main-area').classList.add('hidden');$('question').classList.add('hidden');$('finished').classList.remove('hidden');$('progress').querySelectorAll('.step').forEach(e=>e.className='step done');$('score').textContent='★ 6 / 6';playVoice('好棒！鼠姊姊和龍弟弟一起完成洗澡任務！')}function synthCancel(){window.speechSynthesis?.cancel();$('listen').disabled=false}
function advance(){if(phase!=='done')return;synthCancel();idx++;if(idx>=rounds.length)finish();else paint()}
function reset(){synthCancel();idx=0;$('main-area').classList.remove('hidden');$('question').classList.remove('hidden');$('finished').classList.add('hidden');paint()}
$('next').onclick=advance;$('retry').onclick=reset;$('play-again').onclick=reset;$('listen').onclick=()=>playVoice(rounds[Math.min(idx,5)].question);paint();
})();
</script></body></html>
