ound:#70b99b;color:#fff;box-shadow:0 5px #367e66}.next:disabled{background:#c9dcd4;box-shadow:none}.again{background:#fff4e0;color:#92674a;border:2px solid #ebd4b7}.end{display:grid;justify-items:center;text-align:center;padding:40px 15px}.end img{max-width:360px;width:95%;border-radius:25px}.end h2{font-size:32px;color:#e78050}.end .again{margin:15px}.note{font-size:12px;color:#917b6b;text-align:center;max-width:720px;margin:10px auto 22px;line-height:1.6}@keyframes munch{50%{transform:translateY(11px) rotate(-2deg)}}@keyframes cheer{50%{transform:translateY(-15px) rotate(3deg)}}@keyframes rise{to{transform:translateY(-105px) scale(1.5);opacity:0}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:650px){.wrap{padding:0;margin:0}.shell{border:0;border-radius:0}.board{grid-template-columns:1fr;gap:12px;padding:0 10px}.scene{min-height:300px}.cat{width:68%;height:70%}.bowl{width:42%;left:52%;height:24%}.options{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.option{min-height:96px;border-radius:16px}.option img{border-radius:10px}.hero{padding:12px}.hero p{font-size:12px}.stars{padding:6px}.prompt{margin:0 10px 10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style><!-- cdjg-standalone-v20261121b --><link rel="stylesheet" href="/css/cdj-game-shell-five.css?v=20261121-stage3b"><script defer src="/js/cdj-game-shell-five.js?v=20261121-stage3b"></script></head><body><main class="wrap"><div class="shell"><header class="hero"><div><h1>右右吃飯</h1><p>聽題目・找食物・餵右右</p></div><span class="stars" id="score">★ 0 / 6</span></header><div class="nav"><a class="back" href="/rooms.html?room=dining">← 回餐廳</a><button id="speak" class="listen" type="button">聽題目</button></div><div class="track" id="track"></div><div class="prompt"><strong id="question">右右想找食物，請幫忙！</strong></div><div id="game"><div class="board"><div class="scene" id="scene"><div class="status" id="status" role="status" aria-live="polite">聽題目，再選食物</div><img class="cat" id="cat" alt="右右，圓潤的橘色虎斑貓，沒有項圈和鈴鐺" src="/assets/youyou-food/youyou.webp?v=premium-v3"><div class="bowl" id="bowl" role="button" tabindex="0" aria-label="右右的食物碗，點一下送出已選的食物"></div></div><div class="options" id="options"></div></div></div><p class="tip" id="tip">點選食物，再點食物碗；也可以拖曳進碗裡。</p><div class="buttons"><button type="button" class="next" id="next" disabled>下一關 ▶</button><button type="button" class="again" id="again">從頭再玩</button></div></div><p class="note">這是辨認食物的遊戲。真實餵食以適合貓咪的完整均衡飼料為主；整隻帶骨魚、整雞、玉米、香蕉等不應直接讓孩子拿來餵貓。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),food=[['fish','魚'],['chicken','雞'],['corn','玉米'],['carrot','紅蘿蔔'],['banana','香蕉'],['apple','蘋果']],base='/assets/youyou-food/';let round=0,done=0,selected=null,locked=false,wrong=0;const bowl=$('bowl'),cat=$('cat'),status=$('status');const routeIds=food.map(x=>x[0]);const artVersion='?v=premium-v3';
function say(v){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v);u.lang='zh-TW';u.rate=.94;u.pitch=1.16;const voices=speechSynthesis.getVoices();u.voice=voices.find(x=>/zh[-_]TW/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang))||null;speechSynthesis.speak(u)}
function sound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(850,t+.18);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35);setTimeout(()=>ctx.close(),700)}catch(e){}}
function pop(v){const el=document.createElement('span');el.className='floating';el.textContent=v;el.style.left=(30+Math.random()*48)+'%';el.style.top=(27+Math.random()*26)+'%';$('scene').append(el);setTimeout(()=>el.remove(),980)}
function prompt(){const target=food[round];return '右右想找'+target[1]+'。請找出'+target[1]+'，放進食物碗。'}
function nextRound(){locked=false;selected=null;wrong=0;bowl.replaceChildren();bowl.classList.remove('ready');cat.classList.remove('eat','happy');$('next').disabled=true;status.textContent='選一張食物圖片';$('question').textContent='第 '+(round+1)+' 關：找出'+food[round][1]+'。';$('score').textContent='★ '+done+' / 6';$('track').innerHTML=food.map((_,i)=>'<span class="'+(i<round?'done':i===round?'current':'')+'"></span>').join('');const order=[...food];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}const box=$('options');box.replaceChildren();order.forEach(([id,name])=>{const b=document.createElement('button');b.type='button';b.className='option';b.dataset.id=id;b.setAttribute('aria-label','選擇'+name);b.innerHTML='<img src="'+base+id+'.webp" alt="'+name+'">';b.draggable=true;b.addEventListener('click',()=>choose(id,b));b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id);choose(id,b,false)});box.append(b)})}
function choose(id,button,send=true){if(locked)return;if(id!==food[round][0]){wrong++;button.classList.add('wrong');setTimeout(()=>button.classList.remove('wrong'),450);status.textContent='再找找，聽一次題目吧！';if(wrong>1)say('再看看，請找'+food[round][1]);return;}selected=id;$('options').querySelectorAll('.option').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));status.textContent='找到了！點碗把它送給右右';bowl.classList.add('ready');if(send){/* require second deliberate click on bowl, or drop */}}
function deliver(id){if(locked)return;if(id!==food[round][0]){status.textContent='這個不是題目要找的食物，再試一次！';return;}selected=id;locked=true;const img=document.createElement('img');img.src=base+id+'.webp'+artVersion;img.alt=food[round][1];bowl.replaceChildren(img);cat.classList.remove('eat');void cat.offsetWidth;cat.classList.add('eat');for(let i=0;i<5;i++)setTimeout(()=>pop(['❤','✦','★'][i%3]),150*i);sound();done++;$('score').textContent='★ '+done+' / 6';$('track').children[round].className='done';status.textContent='太棒了，右右吃得好開心！';$('question').textContent='找到'+food[round][1]+'了！';$('next').disabled=false;$('next').textContent=round===5?'完成六關 ★':'下一關 ▶';say('答對了！找到'+food[round][1]+'了，右右好開心！')}
bowl.addEventListener('click',()=>{if(selected)deliver(selected);else status.textContent='先從右邊選一張圖片'});bowl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected)deliver(selected)}});bowl.addEventListener('dragover',e=>e.preventDefault());bowl.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');deliver(id)});$('speak').addEventListener('click',()=>say(prompt()));$('next').addEventListener('click',()=>{if(!locked)return;if(round===5){$('game').innerHTML='<div class="end"><img src="'+base+'youyou.webp" alt="開心的橘貓右右"><h2>六關完成！★ ★ ★ ★ ★ ★</h2><p>右右謝謝你陪她玩！</p><button type="button" class="again" id="endAgain">再玩一次 ↻</button></div>';$('endAgain').onclick=()=>location.reload();$('next').hidden=true;$('question').textContent='完成任務！';$('score').textContent='★ 6 / 6';say('太棒了！六樣食物都認識了！');}else{round++;nextRound()}});$('again').onclick=()=>location.reload();document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});nextRound();})();
</script></body></html>
